# El ejecutor L2. Vive FUERA del binario `ore` a proposito, igual que el driver,
# pero por un motivo distinto: el driver esta vetado por saber hablar por la red
# y este por saber que hora es.
#
# `cedar-policy-core` depende de `chrono` porque Cedar 4 tiene extension
# `datetime`, y una politica puede decir «antes del 1 de enero». Un evaluador es
# funcion del instante; un compilador no puede serlo (invariante III).
#
# Razon completa y medicion: docs/decisions/0007-enlazar-el-evaluador-de-cedar.md
[package]
name        = "ore-exec"
version     = { workspace = true }
edition     = { workspace = true }
license     = { workspace = true }
repository  = { workspace = true }
authors     = { workspace = true }
description = "Ejecutor L2 de ORE: autoriza, planifica y federa"

[dependencies]
# El paquete, la proyeccion a esquema Cedar y la lectura estructural. El esquema
# que carga el evaluador tiene que ser EL MISMO que emite `ore export`, no uno
# equivalente: si divergieran, la politica se valido contra uno y se evalua
# contra otro, y ninguna prueba lo veria.
ore-core = { path = "../ore-core" }

# La implementacion de referencia. El ADR 0003 dijo que si algun dia hiciera
# falta decidir una autorizacion, la respuesta era enlazar esto y no ampliar
# `cedar.rs`. Este crate es ese dia.
cedar-policy = "4"
