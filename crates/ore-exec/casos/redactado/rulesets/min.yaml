apiVersion: oos.dev/v1alpha3
kind: Ruleset
metadata: { name: min, namespace: eu }
spec:
  owner: team:compliance
  targets:
    - atLeast: { gdpr.sensitivity: high }
  masks:
    # Sin `to`: redactar hace desaparecer el valor, luego su salida es siempre
    # el infimo del reticulo. Un campo derivable no es declarable (P2).
    - { id: sin-dni, declassifier: redact }
