apiVersion: oos.dev/v1alpha1
kind: Binding
metadata: { name: erp, namespace: hr }
spec:
  targetEntity: hr.Employee
  datasourceRef: erp
  source: "public.employees"
  properties:
    employeeId: employee_id
    managerId:  manager_id
    baseSalary: national_id
    actualizado: updated_at

  materialization:
    mode: index
    topology:
      refresh: { every: 15m, strategy: poll }
      # Con `poll`, `watermark` DEBE declarar la propiedad que ordena el avance.
      # Sin ella el refresco no sabe desde donde continuar y solo puede recargar
      # entero (`05-ejecutor` §7).
      watermark: actualizado
      freshnessSLA: 30m
