# La vista, adelgazada: nombra la tabla y renombra sus columnas. Ya no declara
# capacidades ni testigo, porque no son suyos.
apiVersion: oos.dev/v1alpha8
kind: View
metadata: { name: empleados, namespace: hr }
spec:
  owner: team:hr
  from: { table: erp.employees }
  fields:
    employeeId: employee_id
    nationalId: national_id
    pais: country
