[package]
name = "ore-cofre"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "El custodio: guarda el material cifrado y lo abre a quien puede"

# ⚠️ Mismo aviso que `ore-iam`: NO ENLAZA en Windows sin MinGW, porque `postgres`
# trae `tokio`. `cargo check` y `cargo clippy` sí pasan.

[dependencies]
# ── ⭐⭐ EL MOTOR DE AUTORIZACIÓN ES EL DE `ore-iam`, NO UNA COPIA ──────────
#
# «¿Puede este sujeto abrir este secreto?» ya está contestada allí: `exige`, la
# unión de conjuntos de la `016`, y la regla de que «no perteneces» y «no
# puedes» den el MISMO mensaje. Escribir aquí una segunda versión sería tener
# DOS motores contestando la misma pregunta — que es exactamente lo que la
# `0023` rechaza de Vault, y peor si lo hacemos nosotros por descuido.
ore-iam = { path = "../ore-iam" }

# El servidor, el token del realm y la forma canónica. Los mismos que montan
# `ore-serve` y `ore-iam`, para que haya UNA definición de qué es un sujeto.
ore-core = { path = "../ore-core" }
ore-entrada = { path = "../ore-entrada" }

# ⭐ El almacén (Secret Manager) por su API, con la puerta de `ore-store` y
# `ore-read-bigquery`: el token de la cuenta que corre (Workload Identity, sin
# llave) y el TLS de la plataforma. Hasta 0046 E9·3 era `gcloud` por un
# subproceso, y arrancarlo costaba 3,6 s por llamada (medido en el pod el
# 2026-09-30): ver `almacen.rs`. Ni OAuth ni criptografía escritos aquí.
#
# ⚠️ El KMS sigue siendo `gcloud` (`kms.rs`, sólo la mudanza).
ore-gcp = { path = "../ore-gcp" }
ureq = { version = "2", default-features = false, features = ["native-tls"] }

postgres = { version = "0.19", default-features = false }
