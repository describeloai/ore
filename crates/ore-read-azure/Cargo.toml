# El lector de un contenedor de Azure Blob (o ADLS Gen2) de un cliente como
# FUENTE (ADR 0061 O3·2).
#
# Lo de todos los almacenes de objetos (el catalogo, las filas, las versiones,
# la bajada y el bucle de verbos) es `ore-read-objetos`; aqui queda lo de
# Azure: su URL `az://`, el `check` que prueba listar, leer y la clave de
# delegacion (Azure no tiene a quien preguntar los permisos), `explorar` y como
# se clasifica lo que Azure contesta. El origen es `ore-azure`.
[package]
name        = "ore-read-azure"
version     = { workspace = true }
edition     = { workspace = true }
license     = { workspace = true }
repository  = { workspace = true }
authors     = { workspace = true }
description = "Lector de contenedores de Azure Blob: catalogo de objetos y de ficheros tabulares"

[dependencies]
ore-azure        = { path = "../ore-azure" }
ore-core         = { path = "../ore-core" }
ore-driver       = { path = "../ore-driver" }
ore-objetos      = { path = "../ore-objetos" }
ore-read-objetos = { path = "../ore-read-objetos" }
