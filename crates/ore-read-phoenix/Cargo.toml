# El lector de Apache Phoenix (ficha 0071, M2): el binario `ore-read-phoenix`. Todo lo que sabe de
# Phoenix vive en `ore-phoenix`; esto es el `main`.
#
# Como `ore-read-cassandra`, `ore-read-mongodb` y `ore-read-postgres`, fuera del cierre de `ore-cli`.
[package]
name        = "ore-read-phoenix"
version     = { workspace = true }
edition     = { workspace = true }
license     = { workspace = true }
repository  = { workspace = true }
authors     = { workspace = true }
description = "El lector de Apache Phoenix de ORE, por el Phoenix Query Server"

[dependencies]
ore-driver  = { path = "../ore-driver" }
ore-phoenix = { path = "../ore-phoenix" }

# El asignador de musl tiene un cerrojo global: con varios lectores a la vez los hilos se bloquean entre si
# (ficha 0073, §3 C4). Medido en Phoenix (1 M filas, paralelo=4): 25-31 s de CPU (15 de sistema) -> 5,3-5,9 s, y 25,9 s -> 18,3 s de reloj.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false }
