# El lector de Apache HBase (ficha 0072, N3): el binario `ore-read-hbase`. Todo lo que sabe de HBase vive en
# `ore-hbase`; esto es el `main`.
#
# Como `ore-read-phoenix`, `ore-read-cassandra`, `ore-read-mongodb` y `ore-read-postgres`, fuera del cierre de `ore-cli`.
[package]
name        = "ore-read-hbase"
version     = { workspace = true }
edition     = { workspace = true }
license     = { workspace = true }
repository  = { workspace = true }
authors     = { workspace = true }
description = "El lector de Apache HBase de ORE, por el protocolo nativo"

[features]
# Kerberos (ficha 0072, N6): pide libgssapi_krb5 y enlaza dinamicamente; es el binario de la imagen de los drivers.
kerberos = ["ore-hbase/kerberos"]

[dependencies]
ore-driver = { path = "../ore-driver" }
ore-hbase  = { path = "../ore-hbase" }

# El asignador de la imagen de los drivers (Alpine = musl). El `malloc` de musl guarda un candado global: con varios
# lectores a la vez, los hilos se bloquean entre si (ficha 0073, §3 C4: `paralelo=4` leia 10^6 filas en 67 s y 136 s de
# CPU, de ellos 54 s de sistema; con mimalloc, 7,4 s y 14 s). Solo en musl: en glibc y en Windows no hace falta.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false }
