[package]
name        = "ore-base"
description = "El vocabulario de ORE: leer y escribir un dato (analizador, JSON, diagnósticos, códigos, firmas, transparencia, medios). Lo usan todos los binarios; el árbol vive en ore-core."
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true

[dependencies]
ed25519-compact.workspace = true
saphyr-parser.workspace = true
sha2.workspace           = true
# El códec geo (ORE 0067): WKT y GeoJSON de entrada.
wkt = { version = "0.14", default-features = false }
geojson = { version = "1.0", default-features = false }

[dev-dependencies]
# ORE 0067 G3·1: el corpus del códec es JSON.
serde_json = "1"
