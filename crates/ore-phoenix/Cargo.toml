# Apache Phoenix como origen (ficha 0071, M2): los tipos de Phoenix a Arrow, el catálogo, la URL y el
# conector (`Origen`) sobre el cliente Avatica. Lo usa `ore-read-phoenix`.
#
# Vive FUERA del cierre de `ore-cli`, como `ore-cassandra` y `ore-mongodb`. No lleva un crate nuevo:
# `ore-avatica` (prost + ureq), Arrow 58 y `serde_json` ya están en el árbol.
[package]
name        = "ore-phoenix"
version     = { workspace = true }
edition     = { workspace = true }
license     = { workspace = true }
repository  = { workspace = true }
authors     = { workspace = true }
description = "Apache Phoenix como origen: los tipos a Arrow, el catálogo y el conector sobre Avatica"

[dependencies]
# El protocolo (`Peticion`, `Fallo`) y el contrato de tipos (`Fisico`, `Valor`).
ore-core    = { path = "../ore-core" }
ore-driver  = { path = "../ore-driver" }
# El cliente del Phoenix Query Server.
ore-avatica = { path = "../ore-avatica" }

# Arrow, el mismo que el resto de lectores (arrow 58).
arrow-array  = "58"
arrow-schema = "58"
arrow-ipc    = "58"

# Una lista (`INTEGER ARRAY`), como texto JSON.
serde_json = "1"

[dev-dependencies]
# Las trazas grabadas del PQS y su servidor falso: se comparten con `ore-avatica`.
prost      = "0.14"
base64     = "0.22"
