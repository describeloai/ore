# El lector de una biblioteca de SharePoint (o un OneDrive) de un cliente como
# FUENTE (ADR 0061 O5·2).
#
# Lo de todos los almacenes de objetos (el catalogo, las filas, las versiones,
# la bajada y el bucle de verbos) es `ore-read-objetos`; aqui queda lo de
# SharePoint: su URL `sharepoint://`, el `check` que prueba la identidad, el
# sitio (la concesion de Sites.Selected), la biblioteca, listar y leer,
# `explorar` y como se clasifica lo que Graph contesta. El origen es `ore-graph`.
[package]
name        = "ore-read-sharepoint"
version     = { workspace = true }
edition     = { workspace = true }
license     = { workspace = true }
repository  = { workspace = true }
authors     = { workspace = true }
description = "Lector de bibliotecas de SharePoint: catalogo de objetos y de ficheros tabulares"

[dependencies]
ore-core         = { path = "../ore-core" }
ore-driver       = { path = "../ore-driver" }
ore-graph        = { path = "../ore-graph" }
ore-objetos      = { path = "../ore-objetos" }
ore-read-objetos = { path = "../ore-read-objetos" }
