[package]
name    = "ore-medios"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
authors.workspace    = true
description = "La media de una celda: el índice de cada colección y las URLs firmadas, en un proceso vivo (ADR 0049 B2)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ore-medios"
path = "src/main.rs"

[dependencies]
# La forma canónica, el analizador de JSON y cómo se sirve un ítem.
ore-core = { path = "../ore-core" }

# El servidor HTTP de ORE: el mismo que `ore-serve`, sin dependencias de fuera.
ore-entrada = { path = "../ore-entrada" }

# **El lago** (0049 B2·0): `ore-medios` es el único proceso de la celda que lo
# lee y firma —y en B3, el único que lee un origen—, y por eso enlaza
# `ore-store` como biblioteca. `ore-serve` sigue sin TLS y decide quién puede.
ore-store = { path = "../ore-store" }

# **El origen de una colección virtual** (0049 B3): leer S3 fijado a la versión
# (`ore-s3`, con la firma de `ore-sigv4`) con la credencial temporal que
# `ore-serve` canjeó por el rol (0046 E9b). Y el sha256 al paso.
ore-s3    = { path = "../ore-s3" }
ore-sigv4 = { path = "../ore-sigv4" }
# El origen de una fuente, de cualquier proveedor (ADR 0061 O0·3), y GCS
# (O2·3), con la cuenta de este proceso o suplantando la del cliente.
ore-objetos = { path = "../ore-objetos" }
ore-gcs     = { path = "../ore-gcs" }
# Y Azure Blob (O3·3), con la cuenta de este proceso federada en Entra.
ore-azure   = { path = "../ore-azure" }
# Y SharePoint (O5·3), por Graph, con la misma federacion.
ore-graph   = { path = "../ore-graph" }
sha2      = { workspace = true }
# El permiso de leer un ítem (B3·2): aleatoriedad del sistema. Ya está en el
# cierre por `ore-store`.
uuid = { version = "1", features = ["v4"] }

# Las columnas del listado de una colección, leídas de sus lotes.
arrow-array = "58"

[dev-dependencies]
arrow-schema = "58"
