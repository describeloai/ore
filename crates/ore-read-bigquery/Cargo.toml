# La tercera familia, y la que cierra un circuito que estaba abierto por un
# lado. `ore` trae dentro la receta del CATALOGO de BigQuery y no traia nada
# para la fase ③: `ore materialize` llama a `ore-read-<tipo> leer` sin receta
# interna de ninguna clase, asi que BigQuery entraba y no salia.
#
# Hasta A2 (2026-09-26) delegaba en el CLI `bq`, para que la credencial no
# entrara en el proceso. Se midio lo que costaba: tres perdidas silenciosas en
# la salida `prettyjson` (el texto 'null' se volvia NULL, un TIMESTAMP perdia
# los microsegundos y la zona) y 8-11 s de arranque por llamada. Ahora habla la
# API REST con el token de la cuenta que corre (`ore-gcp`), y la credencial que
# antes vivia en el proceso de `bq` —en el mismo pod— vive en este. Acotarla no
# sirve: BigQuery ignora la Credential Access Boundary (medido). La frontera es
# el IAM de la cuenta de servicio del driver.
[package]
name        = "ore-read-bigquery"
version     = { workspace = true }
edition     = { workspace = true }
license     = { workspace = true }
repository  = { workspace = true }
authors     = { workspace = true }
description = "Lector de filas de BigQuery para la fase ③"

[dependencies]
ore-core   = { path = "../ore-core" }
ore-driver = { path = "../ore-driver" }
# Y la FORMA, que resulto ser la misma que la de Postgres salvo tres ejes.
ore-sql    = { path = "../ore-sql" }
# El token, renovado antes de caducar, y el cliente HTTPS (A1).
ore-gcp    = { path = "../ore-gcp" }
# Solo para nombrar los errores de estado HTTP; la version y las features son
# las de `ore-gcp`, asi que no anade nada al cierre.
ureq       = { version = "2", default-features = false, features = ["native-tls"] }
# Las respuestas de la API. No el analizador de `ore-core`: aqui importa
# distinguir `null` de `"null"` —es una de las tres perdidas que A2 arregla— y
# leer paginas de decenas de MB sin pasar por un analizador de YAML. Ya estaba
# en el arbol (lo trae `iceberg`).
serde_json = "1"
# **Storage Read** (B2, ADR 0043): las tablas se leen en Arrow por gRPC, en
# paralelo y sin pasar por texto. Medido con 2 M de filas: 21,7 s y 12 MB frente
# a 157 s y 600 MB por `jobs.query`.
#
# La pila es la unica de las tres medidas que compila sin un compilador de C:
# `tonic` SIN sus features de TLS (que traen `ring` o `aws-lc-sys`, los dos con
# C) sobre `hyper-tls`, que es `native-tls` —la misma pila que `ureq` ya usa—.
# El codigo de la API viene generado en `googleapis-tonic-…`: no hace falta
# `protoc`.
tonic       = { version = "0.14.6", default-features = false, features = ["transport", "codegen"] }
tonic-prost = "0.14.6"
prost       = "0.14"
bq-storage  = { package = "googleapis-tonic-google-cloud-bigquery-storage-v1", version = "0.34.0" }
hyper-util  = { version = "0.1", features = ["client-legacy", "tokio", "http1", "http2"] }
hyper-tls   = "0.6"
native-tls  = { version = "0.2", features = ["alpn"] }
tokio       = { version = "1", default-features = false, features = ["rt-multi-thread", "sync"] }
# El flujo que sale: Arrow IPC. `lz4` es `lz4_flex`, Rust puro: BigQuery manda
# los buffers comprimidos y la linea es el limite (medido: LZ4 duplica).
arrow-array  = "58"
arrow-schema = "58"
arrow-ipc    = { version = "58", default-features = false, features = ["lz4"] }
