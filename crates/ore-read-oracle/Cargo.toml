# El lector de Oracle (ficha 0075): el binario `ore-read-oracle`. Todo lo que sabe de Oracle vive en
# `ore-oracle`; esto es el `main`.
#
# Como `ore-read-phoenix`, `ore-read-cassandra`, `ore-read-mongodb` y `ore-read-postgres`, fuera del cierre
# de `ore-cli`.
[package]
name        = "ore-read-oracle"
version     = { workspace = true }
edition     = { workspace = true }
license     = { workspace = true }
repository  = { workspace = true }
authors     = { workspace = true }
description = "El lector de Oracle de ORE: Oracle Database 12.1 en adelante, por el driver thin"

[dependencies]
ore-driver = { path = "../ore-driver" }
ore-oracle = { path = "../ore-oracle" }
