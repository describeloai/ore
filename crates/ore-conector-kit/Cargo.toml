# El kit de conformidad de los conectores (ADR 0053 F2.1, docs/federation.md §2).
#
# Una herramienta de prueba, no un componente: lanza un `ore-read-<tipo>` como
# lo lanzaria la pasarela, le pasa los 14 casos contra unos datos de partida
# que el mismo carga en el origen (un Postgres, un MinIO), y dice cual pasa.
# Por eso arrastra un cliente de Postgres y un escritor de Parquet: son para
# CARGAR la semilla, nunca para leerla —lo que se lee, lo lee el conector—.
[package]
name        = "ore-conector-kit"
version     = { workspace = true }
edition     = { workspace = true }
license     = { workspace = true }
repository  = { workspace = true }
authors     = { workspace = true }
description = "El kit de conformidad de los conectores v2 de ORE"

[[bin]]
name = "ore-kit"
path = "src/main.rs"

[dependencies]
ore-base   = { path = "../ore-base" }
ore-driver = { path = "../ore-driver" }
ore-sigv4  = { path = "../ore-sigv4" }
# Cargar la semilla en el Postgres de pruebas, y preguntarle por sus sesiones.
postgres   = "0.19"
# Subir la semilla a un S3 compatible (MinIO), firmado con `ore-sigv4`.
ureq       = { version = "2", default-features = false }
# Subir la semilla a un SFTP de pruebas (atmoz/sftp), ADR 0061 O4·3.
ssh2       = "0.9"
# Cargar la semilla en BigQuery, con la credencial del conector.
ore-gcp    = { path = "../ore-gcp" }
serde_json = "1"
# Leer lo que el conector contesta, y escribir los Parquet de la semilla.
arrow-array  = "58"
arrow-schema = "58"
arrow-ipc    = "58"
parquet      = { version = "58", default-features = false, features = ["arrow", "snap"] }

# El banco de MongoDB (`--banco mongodb`): carga la semilla con el cliente oficial,
# que son ~220 crates y no es cosa de quien solo prueba Postgres.
mongodb = { version = "=3.9.1", optional = true, default-features = false, features = [
    "sync", "openssl-tls", "dns-resolver", "compat-3-0-0",
] }

# El banco de Cassandra (`--banco cassandra`): carga la semilla con el transporte de
# `ore-cassandra` (el driver de ScyllaDB/Cassandra, ~110 crates).
ore-cassandra = { path = "../ore-cassandra", optional = true }

# El banco de Phoenix (`--banco phoenix`): carga la semilla por el Phoenix Query Server con el cliente de
# `ore-phoenix` (Avatica sobre HTTP: nada que no esté ya en el árbol).
ore-phoenix = { path = "../ore-phoenix", optional = true }
ore-avatica = { path = "../ore-avatica", optional = true }

# El banco de HBase (`--banco hbase`): carga la semilla por la pasarela REST con los bytes que escribe `ore-hbase`
# (sin cliente nuevo: `ureq` ya esta).
ore-hbase = { path = "../ore-hbase", optional = true }

[features]
hbase = ["dep:ore-hbase"]
phoenix = ["dep:ore-phoenix", "dep:ore-avatica"]
mongodb = ["dep:mongodb"]
cassandra = ["dep:ore-cassandra"]
