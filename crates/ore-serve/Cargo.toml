[package]
name    = "ore-serve"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
authors.workspace    = true
description = "El plano de control de ORE: atiende a un cliente y delega lo que toca el mundo"

[dependencies]
# El nucleo, para la forma canonica y el analizador.
ore-core = { path = "../ore-core" }
# La puerta de los punteros sobre el catálogo transaccional (ADR 0079 §19.2): con `postgres`, que
# trae `tokio`; no enlaza en Windows sin MinGW (como ore-catalogo): se compila en Docker.
ore-catalogo = { path = "../ore-catalogo" }
# Y la derivacion del codigo (0050 G5b): Dry Run lee la firma del texto sin
# guardar, con la misma regla que el commit. Ya entraba por `ore-core`.
ore-code = { path = "../ore-code" }

# ── Y la entrada, que dejo de vivir aqui ────────────────────────────────────
#
# `http`, `identidad` y `oidc` eran modulos privados de este binario. En cuanto
# hubo un segundo servidor —`ore-iam`— habia dos opciones: copiar la definicion
# de que es un sujeto, o sacarla. Copiarla es tener dos descripciones del mismo
# contrato, y **la que se quede vieja no dara error: dara permiso.**
ore-entrada = { path = "../ore-entrada" }
# La firma de las teselas (0072 F2·1, HMAC-SHA256): `sha2` ya entraba por `ore-core`.
sha2.workspace = true
# 0074 AR1·2: las sumas de `maven-metadata.xml` que Maven coteja.
sha1.workspace = true
md-5.workspace = true
# El puente a `ore-iam` (0047 A4-A5): `puede` y `hizo`, con `--acceso`.
ore-acceso = { path = "../ore-acceso" }
