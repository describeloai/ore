[package]
name    = "ore-serve"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
authors.workspace    = true
description = "El plano de control de ORE: atiende a un cliente y delega lo que toca el mundo"

[dependencies]
# El nucleo, para la forma canonica y el analizador.
ore-core = { path = "../ore-core" }

# ── Y la entrada, que dejo de vivir aqui ────────────────────────────────────
#
# `http`, `identidad` y `oidc` eran modulos privados de este binario. En cuanto
# hubo un segundo servidor —`ore-iam`— habia dos opciones: copiar la definicion
# de que es un sujeto, o sacarla. Copiarla es tener dos descripciones del mismo
# contrato, y **la que se quede vieja no dara error: dara permiso.**
ore-entrada = { path = "../ore-entrada" }
