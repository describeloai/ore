[package]
name        = "ore-core"
description = "Núcleo L0 de ORE: análisis, forma canónica, análisis de flujo y digest."
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true

[dependencies]
ed25519-compact.workspace = true
saphyr-parser.workspace = true
sha2.workspace           = true
sqlparser.workspace      = true
unicode-normalization.workspace = true
# El código como fuente (0050 G1): el `Function` de un `@function` se deriva
# del `.py` leyéndolo, y aquí se coteja con el documento (`promover`).
ore-code = { path = "../ore-code" }
