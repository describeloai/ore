# El lector de un almacen de objetos, de CUALQUIER proveedor (ADR 0061 O0·2):
# el catalogo (tablas sobre los ficheros que son filas —Parquet, CSV, JSONL— y
# conjuntos de objetos sobre los demas), las filas en Arrow, las versiones de
# una coleccion, la bajada de sus bytes y el bucle de verbos. Estaba en
# `ore-read-s3`; cada driver (`ore-read-s3`, despues GCS, Azure…) pone su
# proveedor —leer la fuente, comprobar el acceso, su `Origen`— y llama a
# `driver::main`.
[package]
name        = "ore-read-objetos"
version     = { workspace = true }
edition     = { workspace = true }
license     = { workspace = true }
repository  = { workspace = true }
authors     = { workspace = true }
description = "El lector de un almacen de objetos como fuente, comun a todos los proveedores"

[dependencies]
ore-core    = { path = "../ore-core" }
ore-driver  = { path = "../ore-driver" }
ore-objetos = { path = "../ore-objetos" }
# El pie de un Parquet, leido por rangos: su esquema exacto (decimal128(12, 2),
# timestamp[us, tz=UTC]) sin bajar el fichero. Ya estaba en el arbol (lo trae
# `ore-store`), con las mismas features.
parquet    = { version = "58", default-features = false, features = ["arrow", "snap"] }
arrow-schema = "58"
# 0046 E6 · leer: el lote en Arrow, el flujo IPC, el cast de un Parquet al
# contrato y los filtros. Todas estaban ya en el arbol (las trae `ore-store`).
arrow-array  = "58"
arrow-ipc    = "58"
arrow-cast   = "58"
arrow-ord    = "58"
arrow-arith  = "58"
arrow-select = "58"
bytes        = "1"
serde_json   = "1"
