[package]
name    = "ore-store"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ore-store-r2"
path = "src/bin/ore-store-r2.rs"

[[bin]]
name = "ore-store-gcs"
path = "src/bin/ore-store-gcs.rs"

[dependencies]
# La forma canonica y el digest. La cabecera del sobre es JSON canonico por lo
# mismo que todo lo demas del proyecto: dos construcciones sobre la misma
# instantanea tienen que dar LOS MISMOS BYTES, o el digest no nombra nada. Y el
# nombre del objeto ES el digest, asi que aqui eso deja de ser una promesa de
# higiene y pasa a ser la direccion.
ore-core = { path = "../ore-core" }

# **Iceberg** (W3.6a, 2026-09-20): la copia es un dataset —una tabla Iceberg en
# el bucket, con su historia— y este programa la escribe. Medido antes de
# entrar (`pruebas-de-fuego/medida-w3-iceberg-rust.py`): 0.10 escribe desde
# Arrow a 2,6 M filas/s, anexa sin reescribir, y los diez fisicos del contrato
# de tipos (0032) vuelven exactos por DuckDB. Lo que no trae —sobrescribir,
# promover tipos— lo pone `lago.rs` con las piezas publicas de la crate.
#
# Sin `iceberg-storage-opendal`: el almacen de este programa YA sabe hablar
# con GCS y con S3 (`gcs.rs`, `r2.rs`, con la identidad del pod y sin clave), y
# `lago.rs` se lo presta a Iceberg como su `Storage`. Un solo transporte, y no
# dos que habria que mantener de acuerdo.
iceberg = "0.10.1"
# Parquet y Arrow, en la version que `iceberg` 0.10 exige (58; el arbol iba en
# 56 hasta W3.6a). `iceberg` escribe los ficheros de datos; aqui se leen —para
# fundir un incremento con lo que habia, y para `leer`— y se construye el
# RecordBatch tipado. SNAPPY es Rust puro; zstd entra por `iceberg` (avro).
parquet = { version = "58", default-features = false, features = ["arrow", "snap"] }
arrow-array  = "58"
arrow-schema = "58"
# El escritor de Iceberg es asincrono; este programa no. Un runtime que se
# arranca una vez y se bloquea hasta que termina cada verbo.
tokio = { version = "1", default-features = false, features = ["rt-multi-thread"] }
async-trait = "0.1"
futures = "0.3"
# Lo que `iceberg::io::Storage` exige del suelo que se le presta.
serde = { version = "1", features = ["derive"] }
typetag = "0.2"
# Los nombres de los ficheros de datos y de los manifiestos llevan un UUID, como
# manda la especificacion: dos escrituras nunca pisan el mismo nombre.
uuid = { version = "1", features = ["v4"] }

# HTTP con TLS de la plataforma, y bloqueante: este programa hace UNA subida y
# termina. Es la misma eleccion, y por la misma razon, que `ore-read-postgres`
# documenta para `native-tls` — el administrador ya puso la CA de la empresa
# donde el sistema operativo la busca.
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"

# SHA-256, para el digest del cuerpo y para la firma. HMAC NO se enlaza: es una
# construccion de seis lineas sobre esto, con vectores oficiales, y la crate
# `hmac` arrastra `digest 0.10` entera al lado de la `0.11` que el arbol ya usa.
# `dependencias.rs` lo vio antes que nadie.
sha2 = { workspace = true }

# Solo por `Bytes`, que es lo que el lector de Parquet acepta como fuente. Ya
# estaba en el arbol —la trae `parquet`—, asi que nombrarla no anade nada al
# cierre: lo unico que hace es dejar de depender de un reexport.
bytes = "1"
