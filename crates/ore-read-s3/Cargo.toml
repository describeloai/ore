# El lector de un almacen de objetos: un bucket de S3 como FUENTE (0046 E4).
#
# No hay SQL ni conexion: hay un listado y bytes que se leen por rangos. De un
# bucket sale un catalogo de dos cosas —tablas sobre los ficheros que son filas
# (Parquet, CSV, JSONL) y conjuntos de objetos que no lo son (documentos,
# imagenes…)— y `ore source induce` las escribe como `Table` con `format` y
# como `ObjectTable`.
[package]
name        = "ore-read-s3"
version     = { workspace = true }
edition     = { workspace = true }
license     = { workspace = true }
repository  = { workspace = true }
authors     = { workspace = true }
description = "Lector de buckets de S3: catalogo de objetos y de ficheros tabulares"

[dependencies]
ore-core   = { path = "../ore-core" }
ore-driver = { path = "../ore-driver" }
ore-objetos = { path = "../ore-objetos" }
ore-s3     = { path = "../ore-s3" }
ore-sigv4  = { path = "../ore-sigv4" }
ore-sts    = { path = "../ore-sts" }
# Lo de todos los almacenes de objetos (ADR 0061 O0·2): el catalogo, las
# filas, las versiones, la bajada y el bucle de verbos.
ore-read-objetos = { path = "../ore-read-objetos" }
serde_json   = "1"
