# **ORE Runtime** (ORE 0081 §7.4): el suelo del motor de ORE. Un runtime con nombre y versión —DataFusion, y
# después Ballista e iceberg-rust, más lo de ORE— del que nace igual cualquier ejecución: una consulta local,
# un scheduler, un ejecutor, una prueba o un banco.
#
# La librería es S2 (0081 §7.4.3): el motor del proceso, la sesión de cada consulta, la configuración, los
# límites, la versión y los zócalos. S3 (§7.4.4) le pone Ballista como librería y los tres papeles. Sin productos, sin DuckDB, y fuera del cierre de `ore` y de `ore-serve`
# (lo vigila `ore-cli/tests/dependencias.rs`).
[package]
name        = "ore-runtime"
version     = { workspace = true }
edition     = { workspace = true }
license     = { workspace = true }
repository  = { workspace = true }
authors     = { workspace = true }
description = "ORE Runtime: el suelo del motor de ORE sobre Apache DataFusion"

[dependencies]
# El motor. Sus features por defecto (SQL, Parquet, las funciones): el suelo no recorta lo que el estándar
# trae; lo que sobre lo dirá la medida. Va con UNA versión en todo el árbol (0081 S1).
datafusion = "55"
# Ballista como librería (0081 §7.4.4), con UNA versión en el árbol como el motor. Sin features por defecto:
# traen clap, tracing, axum, la API REST con `ballista-history` y mimalloc, que es del binario. Sólo se pide
# `arrow-ipc-optimizations`, que el upstream trae por defecto.
ballista-core      = { version = "55", default-features = false, features = ["arrow-ipc-optimizations"] }
ballista-scheduler = { version = "55", default-features = false }
ballista-executor  = { version = "55", default-features = false, features = ["arrow-ipc-optimizations"] }
# Los nodos del plan que viajan del scheduler a los ejecutores: los tipos con que se arranca el scheduler.
datafusion-proto = { version = "55", default-features = false }
# Los dos runtimes del motor (E/S y CPU): el de CPU sin E/S, como en el ejemplo `thread_pools` de DataFusion.
# `sync`: el canal por el que una consulta entrega sus lotes (`correr`).
# `net`, `signal` y `macros`: el puerto del scheduler y las señales de los papeles (S3).
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "time", "sync", "net", "signal", "macros"] }
# El zócalo de catálogo es asíncrono y se usa como objeto (`Arc<dyn Catalogo>`). Ya estaban en el árbol.
async-trait = "0.1"
futures = "0.3"
# `statvfs`: el disco libre del directorio de derrame. Ya estaba en el árbol.
libc = "0.2"
# Los argumentos del binario (`src/bin/ore-runtime.rs`), con las features del workspace. Ballista escribe
# con el facade `log`, y `registro` pone el del proceso; `std`, para que `--registro` se lea como un nivel.
clap = { workspace = true }
log = { version = "0.4", features = ["std"] }

# El asignador del binario: el `malloc` de musl tiene un candado global y la sesión cuesta el doble sin él
# (0081 S0). Sólo en musl, como los demás binarios de ORE.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[dev-dependencies]
# Un directorio de derrame por prueba. Ya estaba en el árbol (lo trae DataFusion).
tempfile = "3"
# Un almacén en memoria para probar el zócalo de almacenes. Es el de DataFusion: una sola versión (0081 S1).
object_store = { version = "0.13", default-features = false }
# La URL de un almacén. Ya estaba en el árbol.
url = "2"
# **La vara** (0081 §7.4, S4: `tests/vara.rs`): el corpus `sqllogictest` de DataFusion sobre la sesión de ORE.
# El motor y la preparación por fichero del upstream, en la versión EXACTA de DataFusion del árbol; y el
# `sqllogictest` y el `indicatif` que ese crate usa, para que sus tipos casen.
datafusion-sqllogictest = "=55.2.0"
sqllogictest = "=0.29.1"
indicatif = "0.18"

# La vara corre su propio bucle (`harness = false`), como el `sqllogictests` del upstream.
[[test]]
name = "vara"
harness = false
