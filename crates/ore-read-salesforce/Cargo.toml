# El lector de Salesforce (ADR 0083): el binario `ore-read-salesforce`. Todo lo
# que sabe de Salesforce vive en `ore-salesforce`; esto es el `main`.
#
# Como `ore-read-mongodb`: fuera del cierre de `ore-cli`.
[package]
name        = "ore-read-salesforce"
version     = { workspace = true }
edition     = { workspace = true }
license     = { workspace = true }
repository  = { workspace = true }
authors     = { workspace = true }
description = "El lector de Salesforce de ORE: una org por JWT bearer, con SOQL"

[dependencies]
ore-driver     = { path = "../ore-driver" }
ore-salesforce = { path = "../ore-salesforce" }
