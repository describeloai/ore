# Las cuatro imágenes que salen de este árbol, en una construcción.
#
# ── ⭐ Por qué las cuatro juntas y no una por invocación ────────────────────
#
# Comparten la etapa `build`: un `cargo build --release` sobre el mismo `musl`.
# En una sola construcción el demonio de Docker la reutiliza —es la misma capa—
# y las tres siguientes son copiar un binario. En cuatro invocaciones se
# compilaría Rust cuatro veces.
#
# ── ⭐⭐ DOS ETIQUETAS, Y LA SEGUNDA ES LA QUE IMPORTA ─────────────────────
#
#   :main    la que los manifiestos nombran. Se mueve.
#   :<sha>   inmutable, y **es la única forma de mirar un pod y saber qué código
#            lleva**. Hasta hoy no la había: entre un `git push` verde y lo que
#            estaba corriendo podía haber cualquier cosa, y el 2026-09-08 hubo
#            un pánico desplegado veinte minutos.
#
# ⭐ (2026-09-30) Aquí sólo se pone `:<sha>`. `:main` —y `:1` en los puestos—
#   la mueve el trabajo `imagen` de `ci.yml` DESPUÉS de las seis pruebas, que
#   ahora corren a la vez que esto. Así una construcción de un commit rojo no
#   llega a nada que un manifiesto nombre.
#
# ── ⭐ En paralelo, y reutilizando lo que no cambió (2026-09-30) ───────────
#
#   Medido: ~19 min, con los once pasos en fila y cada capa rehecha y subida
#   de nuevo (el PUSH solo, 4 min). Ahora:
#   · `waitFor`: lo que no lleva nada de Rust (`informador`, `capa-jvm`, `idp`)
#     arranca con `ore`; lo que copia un binario espera a `ore`, que es quien
#     deja la etapa `build` en la caché del demonio.
#   · BuildKit con caché EN LÍNEA: cada imagen se construye `--cache-from` la
#     que corre hoy (`:main` o `:1`) y lleva dentro su propia caché para la
#     siguiente. Una capa cuyas entradas no cambiaron se reutiliza tal cual —y
#     un `COPY` de un binario se compara por CONTENIDO: el mismo commit de un
#     crate da el mismo binario (es la tesis del perfil `release`)—, así que ni
#     se rehace ni se sube.
#   · `_CACHE_MAIN`/`_CACHE_UNO` sólo existen para medir esto a mano sin tocar
#     `:main`: se apuntan a la `:<sha>` de una construcción anterior.
#
# ⚠️ Y el despliegue NO cambia la etiqueta del manifiesto: sigue siendo `:main`
#   con `imagePullPolicy: Always`, para que `kubectl apply -f malla/…` a mano
#   siga diciendo la verdad. La trazabilidad va en una anotación con el commit,
#   que además es lo que provoca el relevo.

substitutions:
  # La pone CI con los doce primeros del commit. `SHORT_SHA` es reservada y
  # sin disparador no llega: una propia no depende de como se invoque esto.
  _SHA: sin-commit
  _REGISTRO: europe-west1-docker.pkg.dev/project-8853a180-450d-47be-b83/ore
  # De dónde sale la caché: lo que corre hoy.
  _CACHE_MAIN: main
  _CACHE_UNO: '1'
  # La huella de lo que compila Rust (`ci/huella-de-los-binarios.sh`); el job
  # de GitHub la pasa. Vacía (una construcción a mano), se calcula aquí.
  _BINARIOS: ''
  # (sccache se fue el 2026-10-03: con él los binarios morían con SIGSEGV. Su
  # bucket, project-8853a180-450d-47be-b83-ci-sccache, ya no lo usa nadie.)

steps:
  # ⭐⭐ LOS BINARIOS, POR SU CONTENIDO (2026-10-03). Si ya hay una imagen
  #   `ore-binarios:h-<huella>`, Rust no cambió desde que se hizo: se reutiliza
  #   y no se compila NADA (era ~20 min en cada commit, también en uno que sólo
  #   tocaba un ADR). Si no, se compila una vez y queda para la próxima. En los
  #   dos casos lleva también la etiqueta del commit, que es la que las demás
  #   etapas toman (`--build-arg BINARIOS=…:${_SHA}`).
  - id: binarios
    name: gcr.io/cloud-builders/docker
    env: [DOCKER_BUILDKIT=1]
    waitFor: ['-']
    entrypoint: bash
    args:
      - -c
      - |
        set -eu
        H="${_BINARIOS}"
        [ -n "$$H" ] || H=$$(sh ci/huella-de-los-binarios.sh)
        B="${_REGISTRO}/ore-binarios"
        if docker pull -q "$$B:h-$$H" >/dev/null 2>&1; then
          echo "binarios h-$$H: ya estaban, NO se compila"
        else
          echo "binarios h-$$H: no estaban, se compilan"
          # ⭐ Las dependencias, por su receta (CI paso 2): `ore-deps:h-<D>`
          #   trae lo de terceros ya compilado; si la receta (los manifiestos y
          #   el Cargo.lock), el guion o las etapas no cambiaron, se baja y
          #   sólo se compila nuestro código. Si no, se construye una vez.
          docker build -q --target receta -t receta . >/dev/null
          D=$$({ docker run --rm receta cat /receta.json
                 awk '/^FROM rust:.* AS herramientas$$/ {p=1} /^FROM deps AS build$$/ {p=0} p' Dockerfile
                 cat ci/compilar-binarios.sh rust-toolchain.toml; } | sha256sum | cut -c1-16)
          DEPS="${_REGISTRO}/ore-deps"
          if docker pull -q "$$DEPS:h-$$D" >/dev/null 2>&1; then
            echo "deps h-$$D: ya estaban, sólo se compila lo nuestro"
          else
            echo "deps h-$$D: no estaban, se compilan (una vez)"
            docker build -q --target deps -t "$$DEPS:h-$$D" . >/dev/null
            docker push -q "$$DEPS:h-$$D"
          fi
          # El árbol en /src encima del esqueleto de cargo-chef; lo compilado
          # sigue en /t (CARGO_TARGET_DIR de la imagen). El guion acaba
          # arrancando cada servidor: uno que muere no se publica.
          docker run --rm -v /workspace:/src -w /src -e SALIDA=/src/.binarios \
            "$$DEPS:h-$$D" sh ci/compilar-binarios.sh
          printf 'FROM scratch\nCOPY . /b/\n' | docker build -q -t "$$B:h-$$H" -f - .binarios >/dev/null
          docker push -q "$$B:h-$$H"
        fi
        docker tag "$$B:h-$$H" "$$B:${_SHA}"
        docker push -q "$$B:${_SHA}"

  # La fina: sus dos binarios, de los de `binarios`.
  - id: ore
    name: gcr.io/cloud-builders/docker
    env: [DOCKER_BUILDKIT=1]
    waitFor: [binarios]
    args: [build, --target, ore, --build-arg, 'BINARIOS=${_REGISTRO}/ore-binarios:${_SHA}', --build-arg, BUILDKIT_INLINE_CACHE=1,
           --cache-from, '${_REGISTRO}/ore:${_CACHE_MAIN}', -t, '${_REGISTRO}/ore:${_SHA}', .]

  # Sin Rust: `curl`, `jq` y un guion.
  - id: informador
    name: gcr.io/cloud-builders/docker
    env: [DOCKER_BUILDKIT=1]
    waitFor: ['-']
    args: [build, --target, informador, --build-arg, BUILDKIT_INLINE_CACHE=1,
           --cache-from, '${_REGISTRO}/ore-informador:${_CACHE_MAIN}', -t, '${_REGISTRO}/ore-informador:${_SHA}', .]

  # ⭐ Y quien resuelve la capa de la JVM (0037 ③c): el mismo JDK que el puesto
  #   y Maven, sin testigo ni credencial. Su etiqueta va con la del puesto
  #   porque comparten `jars.txt`: lo que una provee es lo que la otra lleva.
  - id: capa-jvm
    name: gcr.io/cloud-builders/docker
    env: [DOCKER_BUILDKIT=1]
    waitFor: ['-']
    args: [build, --target, capa-jvm, --build-arg, BUILDKIT_INLINE_CACHE=1,
           --cache-from, '${_REGISTRO}/capa-jvm:${_CACHE_UNO}', -t, '${_REGISTRO}/capa-jvm:${_SHA}', .]

  # ⭐ Y la de Node (0050 R3 T5b): el mismo Node que el puesto y npm, sin
  #   testigo ni credencial. Comparte `provisto.txt` con `puesto-node`.
  - id: capa-node
    name: gcr.io/cloud-builders/docker
    env: [DOCKER_BUILDKIT=1]
    waitFor: ['-']
    args: [build, --target, capa-node, --build-arg, BUILDKIT_INLINE_CACHE=1,
           --cache-from, '${_REGISTRO}/capa-node:${_CACHE_UNO}', -t, '${_REGISTRO}/capa-node:${_SHA}', .]

  # ⭐ Y la de Python (0050 P2): el mismo Python que el puesto y uv, sin
  #   testigo ni credencial. Comparte `provisto.txt` con `puesto-python`.
  - id: capa-python
    name: gcr.io/cloud-builders/docker
    env: [DOCKER_BUILDKIT=1]
    waitFor: ['-']
    args: [build, --target, capa-python, --build-arg, BUILDKIT_INLINE_CACHE=1,
           --cache-from, '${_REGISTRO}/capa-python:${_CACHE_UNO}', -t, '${_REGISTRO}/capa-python:${_SHA}', .]

  # 0048 I2: el IdP, cocido y con el tema del correo. La que CORRE la fija
  # `malla/60-idp.yaml` (cambiarla reinicia el login): aquí sólo se construye.
  - id: idp
    name: gcr.io/cloud-builders/docker
    env: [DOCKER_BUILDKIT=1]
    waitFor: ['-']
    args: [build, --target, idp, --build-arg, BUILDKIT_INLINE_CACHE=1,
           --cache-from, '${_REGISTRO}/idp:${_CACHE_MAIN}', -t, '${_REGISTRO}/idp:${_SHA}', .]

  # Desde aquí, los que copian binarios de `build`: esperan a `ore`.
  - id: drivers
    name: gcr.io/cloud-builders/docker
    env: [DOCKER_BUILDKIT=1]
    waitFor: [binarios]
    args: [build, --target, drivers, --build-arg, 'BINARIOS=${_REGISTRO}/ore-binarios:${_SHA}', --build-arg, BUILDKIT_INLINE_CACHE=1,
           --cache-from, '${_REGISTRO}/ore-drivers:${_CACHE_MAIN}', -t, '${_REGISTRO}/ore-drivers:${_SHA}', .]

  - id: serve
    name: gcr.io/cloud-builders/docker
    env: [DOCKER_BUILDKIT=1]
    waitFor: [binarios]
    args: [build, --target, serve, --build-arg, 'BINARIOS=${_REGISTRO}/ore-binarios:${_SHA}', --build-arg, BUILDKIT_INLINE_CACHE=1,
           --cache-from, '${_REGISTRO}/ore-serve:${_CACHE_MAIN}', -t, '${_REGISTRO}/ore-serve:${_SHA}', .]

  - id: iam
    name: gcr.io/cloud-builders/docker
    env: [DOCKER_BUILDKIT=1]
    waitFor: [binarios]
    args: [build, --target, iam, --build-arg, 'BINARIOS=${_REGISTRO}/ore-binarios:${_SHA}', --build-arg, BUILDKIT_INLINE_CACHE=1,
           --cache-from, '${_REGISTRO}/ore-iam:${_CACHE_MAIN}', -t, '${_REGISTRO}/ore-iam:${_SHA}', .]

  - id: cofre
    name: gcr.io/cloud-builders/docker
    env: [DOCKER_BUILDKIT=1]
    waitFor: [binarios]
    args: [build, --target, cofre, --build-arg, 'BINARIOS=${_REGISTRO}/ore-binarios:${_SHA}', --build-arg, BUILDKIT_INLINE_CACHE=1,
           --cache-from, '${_REGISTRO}/ore-cofre:${_CACHE_MAIN}', -t, '${_REGISTRO}/ore-cofre:${_SHA}', .]

  # El puesto Python, entorno 1 (0031 W3): un runtime, no un binario nuestro
  # (salvo `ore-store-gcs`, que es lo que les hace esperar a `ore`).
  - id: puesto-python
    name: gcr.io/cloud-builders/docker
    env: [DOCKER_BUILDKIT=1]
    waitFor: [binarios]
    args: [build, --target, puesto-python, --build-arg, 'BINARIOS=${_REGISTRO}/ore-binarios:${_SHA}', --build-arg, BUILDKIT_INLINE_CACHE=1,
           --cache-from, '${_REGISTRO}/puesto-python:${_CACHE_UNO}', -t, '${_REGISTRO}/puesto-python:${_SHA}', .]

  # Y los de TS/JS y Java (0031 W3.4): mismo agente, otro runtime.
  - id: puesto-node
    name: gcr.io/cloud-builders/docker
    env: [DOCKER_BUILDKIT=1]
    waitFor: [binarios]
    args: [build, --target, puesto-node, --build-arg, 'BINARIOS=${_REGISTRO}/ore-binarios:${_SHA}', --build-arg, BUILDKIT_INLINE_CACHE=1,
           --cache-from, '${_REGISTRO}/puesto-node:${_CACHE_UNO}', -t, '${_REGISTRO}/puesto-node:${_SHA}', .]

  - id: puesto-jvm
    name: gcr.io/cloud-builders/docker
    env: [DOCKER_BUILDKIT=1]
    waitFor: [binarios]
    args: [build, --target, puesto-jvm, --build-arg, 'BINARIOS=${_REGISTRO}/ore-binarios:${_SHA}', --build-arg, BUILDKIT_INLINE_CACHE=1,
           --cache-from, '${_REGISTRO}/puesto-jvm:${_CACHE_UNO}', -t, '${_REGISTRO}/puesto-jvm:${_SHA}', .]

images:
  - '${_REGISTRO}/ore:${_SHA}'
  - '${_REGISTRO}/ore-informador:${_SHA}'
  - '${_REGISTRO}/capa-jvm:${_SHA}'
  - '${_REGISTRO}/capa-node:${_SHA}'
  - '${_REGISTRO}/capa-python:${_SHA}'
  - '${_REGISTRO}/idp:${_SHA}'
  - '${_REGISTRO}/ore-drivers:${_SHA}'
  - '${_REGISTRO}/ore-serve:${_SHA}'
  - '${_REGISTRO}/ore-iam:${_SHA}'
  - '${_REGISTRO}/ore-cofre:${_SHA}'
  - '${_REGISTRO}/puesto-python:${_SHA}'
  - '${_REGISTRO}/puesto-node:${_SHA}'
  - '${_REGISTRO}/puesto-jvm:${_SHA}'

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 3600s
