[workspace]
resolver = "3"
members = ["crates/*"]

# El build POR DEFECTO de este repositorio es el compilador hermetico. Los
# drivers son miembros —entran en `Cargo.lock`, y por tanto en el radar del
# guardian de dependencias— pero no se construyen si no se piden.
#
# No es comodidad: es la misma frase del proyecto dicha en la unica sintaxis que
# `cargo` entiende. Y tiene un efecto secundario que vale la pena nombrar: una
# maquina sin MinGW ni MSVC compila `ore` entero y no puede compilar el driver,
# porque `ore` no enlaza NADA nativo. La herramienta lo demuestra sin que nadie
# se lo pida.
default-members = ["crates/ore-core", "crates/ore-cli"]

[workspace.package]
version    = "0.1.0"
edition    = "2024"
license    = "Apache-2.0"
repository = "https://github.com/describeloai/ore"
authors    = ["ORE contributors"]

# El binario que se distribuye. `lto` y `codegen-units = 1` no estan aqui por
# tamano: **quitan fuentes de no-determinismo**. Con varias unidades de
# generacion el reparto del trabajo entre hilos puede variar entre compilaciones,
# y un proyecto cuya tesis es que el mismo commit produce el mismo digest no
# puede permitirse que el mismo commit produzca dos binarios distintos.
#
# `strip` quita los simbolos, que embeben rutas absolutas de la maquina que
# compilo — un binario que revela el `home` del que lo construyo, y ademas
# distinto en cada runner.
#
# Lo comprueba el trabajo `determinista` de `.github/workflows/release.yml`, que
# construye dos veces y compara: una afirmacion de determinismo sin medicion es
# justo lo que este proyecto lleva cuatro versiones desmontando.
[profile.release]
lto           = true
codegen-units = 1
strip         = true
panic         = "abort"

[workspace.dependencies]
anyhow = "1"

# Sin `default-features`: los colores de clap arrastran `anstream` -> `windows-sys`,
# y con ello FFI de plataforma. Un compilador de especificacion es puro por
# invariante III y no tiene ningun motivo para enlazar contra el sistema
# operativo. Menos dependencias nativas tambien significa compilacion cruzada
# trivial, que es lo que un binario que se distribuye por brew, cargo, curl,
# npm y docker necesita.
# `string` permite que `--version` se construya en tiempo de ejecucion: la
# identidad del motor incluye el commit, que no es un literal. No arrastra nada
# nativo, que es la razon por la que las demas features siguen fuera.
clap = { version = "4", default-features = false, features = [
    "std", "derive", "help", "usage", "error-context", "string",
] }

# El parser de YAML, a nivel de EVENTOS y no de arbol.
#
# No queremos un deserializador: queremos un front-end de compilador. El trabajo
# de serde es tirar la sintaxis, y nosotros necesitamos la sintaxis — el estilo
# del escalar decide si OOS6003 se dispara, y la posicion decide si el error
# sirve para algo.
#
# Evaluado contra cinco criterios de la especificacion, cuatro candidatos.
# Registro: docs/decisions/0001-parser-de-yaml.md
saphyr-parser = "0.0.12"

# SHA-256. El digest es EL artefacto normativo del proyecto, no un detalle de
# implementacion: `sha256:<64 hex>` viaja en cada bundle, se firma y lo verifica
# un tercero. Reimplementar a mano una primitiva criptografica para ahorrar seis
# crates puras seria exactamente la clase de decision que este proyecto critica
# en otros. `sha2` es la implementacion estandar del ecosistema, esta auditada y
# no arrastra FFI: la razon que descarto a los validadores de JSON Schema y a
# los colores de clap no aplica aqui.
sha2 = "0.10"

# Ed25519, y **solo para verificar**.
#
# Un digest dice QUE es un paquete; una firma dice DE QUIEN, y es lo unico que un
# digest no puede contestar — uno correcto lo produce cualquiera que tenga los
# bytes, incluido quien los sustituyo.
#
# Verificar vive dentro porque es aritmetica sobre bytes que ya estan en el
# arbol: no es red, no es reloj y no es una credencial. Firmar vive fuera, en
# `ore-sign`, porque exige una clave privada — la misma frontera que `source add`
# traza para un secreto.
#
# El veto de `dependencias.rs` no lo impide y conviene decir por que: veta RED y
# FFI. `ring` esta vetada por traer ensamblador, no por ser cripto, y `sha2` ya
# esta dentro. `ed25519-compact` es Rust puro; sin `default-features` no arrastra
# `getrandom` —que si esta vetada— porque verificar no necesita aleatoriedad. El
# cierre de `ore-cli` sube en UNA crate, y `CIERRE` lo dice.
#
# La alternativa era escribir la aritmetica de curva a mano. No: equivocarse en
# ella no da un fallo visible, da firmas invalidas que verifican — que es
# exactamente el modo de fallo silencioso y en la direccion insegura contra el
# que existe la denegacion por defecto.
ed25519-compact = { version = "2.4.2", default-features = false }

# NFC (N5). Normalizacion Unicode es tablas, no algoritmo: "compañia" escrita
# con n-tilde precompuesta y con n + combinante son el MISMO texto, y si no
# convergen el digest deja de ser una identidad y pasa a ser un accidente de
# como escribio el autor. Implementarlo a mano seria portar el UCD.
unicode-normalization = "0.1"
