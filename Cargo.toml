[workspace]
resolver = "3"
members = ["crates/*"]
# Los spikes de medida en Rust (`pruebas-de-fuego/medida-*-rust/`) tienen su
# propio Cargo.toml y no entran aqui: son desechables y traen dependencias que
# el producto no lleva (arrow 58 frente al 56 del arbol).
exclude = ["pruebas-de-fuego/medida-w3-iceberg-rust"]

# El build POR DEFECTO de este repositorio es el compilador hermetico. Los
# drivers son miembros —entran en `Cargo.lock`, y por tanto en el radar del
# guardian de dependencias— pero no se construyen si no se piden.
#
# No es comodidad: es la misma frase del proyecto dicha en la unica sintaxis que
# `cargo` entiende. `ore` no enlaza nada nativo **salvo una pieza, a sabiendas**:
# el cambio de pila de `psm` (ensamblador, via `stacker`), que trae el parser de
# Python de `ore-code` (0050 G1). El compilador lee codigo ajeno, y una pila que
# crece en un anidamiento hostil es lo que no lo deja caer; la alternativa (una
# pila fija medida, sin `stacker`) falla abortando el dia que la medida se queda
# corta. No es FFI ni habla con nadie: la hermeticidad (`dependencias.rs`) no
# cambia. Lo que cuesta: compilar `ore` pide un compilador de C (el CI y la
# imagen lo tienen; en un Windows sin MinGW, con Docker).
default-members = ["crates/ore-core", "crates/ore-cli"]

[workspace.package]
version    = "0.1.0"
edition    = "2024"
license    = "Apache-2.0"
repository = "https://github.com/describeloai/ore"
authors    = ["ORE contributors"]

# El binario que se distribuye. `lto` y `codegen-units = 1` no estan aqui por
# tamano: **quitan fuentes de no-determinismo**. Con varias unidades de
# generacion el reparto del trabajo entre hilos puede variar entre compilaciones,
# y un proyecto cuya tesis es que el mismo commit produce el mismo digest no
# puede permitirse que el mismo commit produzca dos binarios distintos.
#
# `strip` quita los simbolos, que embeben rutas absolutas de la maquina que
# compilo — un binario que revela el `home` del que lo construyo, y ademas
# distinto en cada runner.
#
# Lo comprueba el trabajo `determinista` de `.github/workflows/release.yml`, que
# construye dos veces y compara: una afirmacion de determinismo sin medicion es
# justo lo que este proyecto lleva cuatro versiones desmontando.
[profile.release]
lto           = true
codegen-units = 1
strip         = true
panic         = "abort"

# ⭐ LAS IMÁGENES QUE SE DESPLIEGAN (2026-10-03): `release` sin LTO y con 16
#   unidades. Con LTO completo cada binario se enlaza solo y en serie —el
#   enlace dominaba: 20 min por commit— y ninguna caché lo evita. Medido el
#   2026-09-30: sin LTO, tocar `ore-serve` 56 s frente a 206. Lo que se
#   PUBLICA (releases, el trabajo `determinista`) sigue siendo `release`.
#
# ⛔ El SIGSEGV de `ore-cofre` y `ore-medios` al arrancar (t-demo, 2026-10-03)
#   era de **sccache**, no de quitar el LTO. Medido en local con la etapa
#   `herramientas` (rustc 1.99, `ore-medios`): sin LTO + sccache en frío →
#   139; en caliente → 139; sin LTO SIN sccache → vivo; con LTO sin sccache →
#   vivo. Por eso sccache está apagado (`CACHE_GCS` vacío en cloudbuild.yaml):
#   no se enciende sin repetir esa prueba.
[profile.imagen]
inherits      = "release"
lto           = false
codegen-units = 16

[workspace.dependencies]
anyhow = "1"

# Sin `default-features`: los colores de clap arrastran `anstream` -> `windows-sys`,
# y con ello FFI de plataforma. Un compilador de especificacion es puro por
# invariante III y no tiene ningun motivo para enlazar contra el sistema
# operativo. Menos dependencias nativas tambien significa compilacion cruzada
# trivial, que es lo que un binario que se distribuye por brew, cargo, curl,
# npm y docker necesita.
# `string` permite que `--version` se construya en tiempo de ejecucion: la
# identidad del motor incluye el commit, que no es un literal. No arrastra nada
# nativo, que es la razon por la que las demas features siguen fuera.
clap = { version = "4", default-features = false, features = [
    "std", "derive", "help", "usage", "error-context", "string",
] }

# El parser de YAML, a nivel de EVENTOS y no de arbol.
#
# No queremos un deserializador: queremos un front-end de compilador. El trabajo
# de serde es tirar la sintaxis, y nosotros necesitamos la sintaxis — el estilo
# del escalar decide si OOS6003 se dispara, y la posicion decide si el error
# sirve para algo.
#
# Evaluado contra cinco criterios de la especificacion, cuatro candidatos.
# Registro: docs/decisions/0001-parser-de-yaml.md
saphyr-parser = "0.0.12"

# El analizador de SQL del arbol (`ore_core::sql_del_arbol`): un `.sql` dice el
# solo que lee y que escribe, y hay que sacarlo de la frase ANTES de correrla
# (el grafo, el linaje, el permiso de un trabajo) y sin el motor delante.
# Medido en `pruebas-de-fuego/medida-el-sql-del-arbol.py`: 18/19 casos con el
# dialecto de DuckDB en 0,046 ms, frente a la regex del SDK (8/13) y sqlglot
# (13/13, pero Python). Sin `default-features`: la de por defecto,
# `recursive-protection`, trae `recursive` -> `stacker` -> `psm`, con `cc` y
# ensamblador por plataforma; sin ella queda `log` y su derive. El limite de
# recursion del propio parser sigue puesto.
sqlparser = { version = "0.63", default-features = false, features = ["std", "visitor"] }

# El analizador de Python de `ore-code` (0050 G1): el `@function` del cliente
# es la fuente y el `Function` se deriva de el, leyendo y sin ejecutar nada.
# Medido en M-G1 (2026-10-01, Docker, contra el `ast` de CPython 3.14): 26/26
# derivaciones, 655/655 ficheros de la stdlib de 3.14, 8/8 rotos rechazados,
# +1,9 MB; `rustpython-parser` se quedo en 649/655 (no entiende 3.13+) y esta
# parado. Es el parser de Ruff, ty y uv. Version EXACTA: Astral lo publica como
# crate interno (0.0.x) y su API cambia; solo `ore-code/src/python/sintaxis.rs`
# la toca. Trae `stacker` -> `psm` (cc y ensamblador), y esta vez se acepta:
# ver `default-members` arriba.
ruff_python_parser = "=0.0.15"
ruff_python_ast    = "=0.0.15"
ruff_text_size     = "=0.0.15"

# El analizador de TypeScript de `ore-code` (0050 R3): la exportacion por
# defecto de un `.ts` de `functions/` es la fuente, y su `Function` se deriva
# leyendo (OOS v1alpha23). Medido en M-T1 (2026-10-03, Docker): 1238/1238
# ficheros reales (zod, date-fns, TypeScript, typescript-eslint, vscode/base,
# type-fest; 9 MB) en 526 ms, 5/5 rotos rechazados, 76 crates normales, sin
# nada vetado; `swc_ecma_parser` 45 se quedo en 1228/1238 (los decoradores, sin
# activarlos), 683 ms, 93 crates y trae `rand` y `ahash`. El arbol vive en un
# arena: soltarlo no es recursivo (lo que con Ruff obliga a `stacker` al
# soltar). Version EXACTA, como Ruff: oxc publica 0.x cada semana; solo
# `ore-code/src/typescript/sintaxis.rs` la toca.
oxc_allocator = "=0.152.0"
oxc_ast       = "=0.152.0"
oxc_ast_visit = "=0.152.0"
oxc_parser    = "=0.152.0"
oxc_span      = "=0.152.0"

# SHA-256. El digest es EL artefacto normativo del proyecto, no un detalle de
# implementacion: `sha256:<64 hex>` viaja en cada bundle, se firma y lo verifica
# un tercero. Reimplementar a mano una primitiva criptografica para ahorrar seis
# crates puras seria exactamente la clase de decision que este proyecto critica
# en otros. `sha2` es la implementacion estandar del ecosistema, esta auditada y
# no arrastra FFI: la razon que descarto a los validadores de JSON Schema y a
# los colores de clap no aplica aqui.
#
# 0.11 y no 0.10 desde W3.6a (2026-09-20), y no por la API: `ore-store` trae
# `iceberg`, que trae `aes-gcm`, que enciende `crypto-common 0.1/rand_core` y
# con ella `getrandom` — y `sha2 0.10` comparte ese `crypto-common 0.1`. Con
# `sha2 0.11` (`digest 0.11`, `crypto-common 0.2`) el digest de `ore` no pisa
# ningun nodo que otro crate del workspace haya encendido: `dependencias.rs`
# lo mide. `ore-entrada` se queda en 0.10 porque `rsa 0.9` lo exige.
sha2 = "0.11"

# Ed25519, y **solo para verificar**.
#
# Un digest dice QUE es un paquete; una firma dice DE QUIEN, y es lo unico que un
# digest no puede contestar — uno correcto lo produce cualquiera que tenga los
# bytes, incluido quien los sustituyo.
#
# Verificar vive dentro porque es aritmetica sobre bytes que ya estan en el
# arbol: no es red, no es reloj y no es una credencial. Firmar vive fuera, en
# `ore-sign`, porque exige una clave privada — la misma frontera que `source add`
# traza para un secreto.
#
# El veto de `dependencias.rs` no lo impide y conviene decir por que: veta RED y
# FFI. `ring` esta vetada por traer ensamblador, no por ser cripto, y `sha2` ya
# esta dentro. `ed25519-compact` es Rust puro; sin `default-features` no arrastra
# `getrandom` —que si esta vetada— porque verificar no necesita aleatoriedad. El
# cierre de `ore-cli` sube en UNA crate, y `CIERRE` lo dice.
#
# La alternativa era escribir la aritmetica de curva a mano. No: equivocarse en
# ella no da un fallo visible, da firmas invalidas que verifican — que es
# exactamente el modo de fallo silencioso y en la direccion insegura contra el
# que existe la denegacion por defecto.
ed25519-compact = { version = "2.4.2", default-features = false }

# NFC (N5). Normalizacion Unicode es tablas, no algoritmo: "compañia" escrita
# con n-tilde precompuesta y con n + combinante son el MISMO texto, y si no
# convergen el digest deja de ser una identidad y pasa a ser un accidente de
# como escribio el autor. Implementarlo a mano seria portar el UCD.
unicode-normalization = "0.1"
