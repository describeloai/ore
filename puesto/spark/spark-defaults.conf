# ORE 0068 C2·2 · Lo que toda sesión de Spark del puesto pesado lleva, sin que el código lo diga.
#   (SPARK_CONF_DIR=/opt/ore/spark/conf). El catálogo `ore` NO va aquí: su URI y su identidad son de
#   cada Build, y los pone quien lo lanza (C2·3).

# Iceberg y Sedona, siempre.
# C3·b: y las reglas de ORE (`ReglasDeOre.java`: el LEFT JOIN espacial, con índice).
spark.sql.extensions                          org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions,org.apache.sedona.sql.SedonaSqlExtensions,ore.spark.ReglasDeOre
spark.serializer                              org.apache.spark.serializer.KryoSerializer
spark.kryo.registrator                        org.apache.sedona.core.serde.SedonaKryoRegistrator

# ⛔ Medido (pieza 0): sin esto, `ST_Transform` (proj4sedona, el de Sedona 1.9) BAJA la definición EPSG
#   de spatialreference.org, y el puesto no sale a internet. Con `all`, GeoTools la lleva dentro.
#   `true` y `vector` siguen saliendo a la red.
spark.sedona.crs.geotools                     all

# De Spark a pandas por Arrow (el SDK de ORE habla Arrow).
spark.sql.execution.arrow.pyspark.enabled     true

# Sin la interfaz web: en el puesto no la mira nadie, y es un puerto abierto.
spark.ui.enabled                              false

# ⭐ C3·c · La rejilla de un join espacial repartido (`RangeJoin`), sobre el argumento DERECHO del
#   predicado, y el índice sobre el izquierdo; la regla `LadoGrandeALaDerecha` (ReglasDeOre) pone a la
#   derecha el lado con más filas. Medido en C3·c0: con la rejilla sobre el lado pequeño y uniforme, unos
#   puntos densos caen en una celda y el join se queda en un core; sobre el grande, usa todos.
sedona.join.spatitionside                     right
