apiVersion: v1
data:
  scheduler-config.yaml: "apiVersion: kubescheduler.config.k8s.io/v1\nkind: KubeSchedulerConfiguration\nleaderElection:\n  leaderElect: false\nprofiles:\n  - schedulerName: autoscale-scheduler\n    plugins:\n      multiPoint:\n        enabled:\n          - name: AutoscaleEnforcer\n      score:\n        # Score() for some plugins is disabled to avoid conflicts with AutoscaleEnforcer\n        disabled:\n          - name: ImageLocality\n          - name: NodeResourcesBalancedAllocation\n          - name: NodeResourcesFit\n"
kind: ConfigMap
metadata:
  name: autoscale-scheduler-config
  namespace: kube-system
---
apiVersion: v1
data:
  autoscale-enforcer-config.json: "{\n  \"watermark\": 0.9,\n  \"scoring\": {\n    \"minUsageScore\": 0.5,\n    \"maxUsageScore\": 0,\n    \"scorePeak\": 0.8,\n    \"randomize\": true\n  },\n  \"schedulerName\": \"autoscale-scheduler\",\n  \"reconcileWorkers\": 16,\n  \"logSuccessiveFailuresThreshold\": 10,\n  \"startupEventHandlingTimeoutSeconds\": 15,\n  \"patchRetryWaitSeconds\": 1,\n  \"k8sCRUDTimeoutSeconds\": 1,\n  \"nodeMetricLabels\": {},\n  \"ignoredNamespaces\": []\n}\n"
kind: ConfigMap
metadata:
  name: scheduler-plugin-config
  namespace: kube-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    component: scheduler
    tier: control-plane
  name: autoscale-scheduler
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      component: scheduler
      tier: control-plane
  template:
    metadata:
      labels:
        component: scheduler
        name: autoscale-scheduler
        tier: control-plane
    spec:
      containers:
      - command:
        - /usr/bin/kube-scheduler
        - --config=/etc/kubernetes/autoscale-scheduler-config/scheduler-config.yaml
        image: europe-west1-docker.pkg.dev/project-8853a180-450d-47be-b83/ore/autoscale-scheduler:v0.49.1
        livenessProbe:
          httpGet:
            path: /healthz
            port: 10259
            scheme: HTTPS
          initialDelaySeconds: 15
        name: autoscale-scheduler
        ports:
        - containerPort: 9100
          name: metrics
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /healthz
            port: 10259
            scheme: HTTPS
        resources:
          limits:
            cpu: 1
            memory: 2000Mi
          requests:
            cpu: 200m
            memory: 2000Mi
        securityContext:
          privileged: false
        volumeMounts:
        - mountPath: /etc/kubernetes/autoscale-scheduler-config
          name: scheduler-config-volume
        - mountPath: /etc/scheduler-plugin-config
          name: plugin-config-volume
      hostNetwork: false
      hostPID: false
      priorityClassName: system-cluster-critical
      serviceAccountName: autoscale-scheduler
      tolerations:
      - effect: NoExecute
        key: node.kubernetes.io/not-ready
        tolerationSeconds: 30
      - effect: NoExecute
        key: node.kubernetes.io/unreachable
        tolerationSeconds: 30
      - key: ore.dev/neon
        operator: Equal
        value: 'true'
        effect: NoSchedule
      volumes:
      - configMap:
          name: autoscale-scheduler-config
        name: scheduler-config-volume
      - configMap:
          name: scheduler-plugin-config
        name: plugin-config-volume
      nodeSelector:
        ore.dev/pool: neon
---
