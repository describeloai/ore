---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: autoscaler-agent
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: autoscaler-agent
  template:
    metadata:
      labels:
        name: autoscaler-agent
    spec:
      containers:
      - env:
        - name: K8S_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: K8S_POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: CONFIG_PATH
          value: /etc/autoscaler-agent-config/config.json
        image: europe-west1-docker.pkg.dev/project-8853a180-450d-47be-b83/ore/autoscaler-agent:v0.49.1
        name: autoscaler-agent
        ports:
        - containerPort: 9100
          name: metrics
          protocol: TCP
        - containerPort: 9101
          name: vm-metrics
          protocol: TCP
        resources:
          limits:
            cpu: 1000m
            memory: 600Mi
          requests:
            cpu: 100m
            memory: 600Mi
        volumeMounts:
        - mountPath: /etc/autoscaler-agent-config
          name: config
      serviceAccountName: autoscaler-agent
      volumes:
      - configMap:
          name: autoscaler-agent-config
