# La base del cómputo de ORE Serverless Postgres (ADR 0058, P3·3) · 1 de 3: cert-manager.
# La aplica el Kustomization de Flux `ore-pg-cert-manager` (malla/84-…), no el de la malla.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cert-manager.yaml
patches:
  # P5·2: el reto DNS-01 del comodín *.europe-west1.pg.paladio.io. El controlador habla con Cloud
  # DNS como ore-pg-dns por Workload Identity (dns.admin sólo sobre la zona pg-paladio-io; la crea
  # malla/87-postgres-la-entrada-gcp.sh), sin claves. Un parche y no el fichero vendorizado:
  # vendorizar.py lo reescribe.
  - target: { kind: ServiceAccount, name: cert-manager, namespace: cert-manager }
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          iam.gke.io/gcp-service-account: ore-pg-dns@project-8853a180-450d-47be-b83.iam.gserviceaccount.com
  # ⭐ cert-manager NO va al pool `neon` (2026-10-29). `vendorizar.py` fijaba ahí todo Deployment, y
  #   el pool está a 0 casi siempre: cert-manager pasó días en `Pending`, el Kustomization
  #   `ore-pg-cert-manager` en rojo y `ore-pg-neonvm` (que depende de él) parado; el comodín de la
  #   entrada no se habría renovado. cert-manager es de la malla, no del cómputo: al pool de
  #   sistema, siempre encendido, con lo poco que pide (medido en clústeres pequeños: <10m, ~40Mi).
  #   Un parche, como el de arriba: sobrevive a volver a vendorizar.
  - target: { kind: Deployment, name: cert-manager, namespace: cert-manager }
    patch: |-
      - op: remove
        path: /spec/template/spec/nodeSelector/ore.dev~1pool
      - op: remove
        path: /spec/template/spec/tolerations
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: { requests: { cpu: 10m, memory: 64Mi }, limits: { memory: 256Mi } }
  - target: { kind: Deployment, name: cert-manager-cainjector, namespace: cert-manager }
    patch: |-
      - op: remove
        path: /spec/template/spec/nodeSelector/ore.dev~1pool
      - op: remove
        path: /spec/template/spec/tolerations
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: { requests: { cpu: 10m, memory: 64Mi }, limits: { memory: 256Mi } }
  - target: { kind: Deployment, name: cert-manager-webhook, namespace: cert-manager }
    patch: |-
      - op: remove
        path: /spec/template/spec/nodeSelector/ore.dev~1pool
      - op: remove
        path: /spec/template/spec/tolerations
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: { requests: { cpu: 10m, memory: 64Mi }, limits: { memory: 256Mi } }
