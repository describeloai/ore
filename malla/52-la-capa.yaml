# ═══════════════════════════════════════════════════════════════════════════
# LA CAPA — las dependencias de Python que un repositorio declara, resueltas
# (0031 §3, W3.2; desde ADR 0050 P2, el gemelo de `57-la-capa-node.yaml`)
#
# ⭐ El puesto no tiene `pip` como verdad: no alcanza PyPI (21-el-puesto.yaml).
#   Lo que una sesión Python necesita se DECLARA en el árbol —`[project]
#   .dependencies` de `pyproject.toml` y, desde P2, el grupo `dev` de
#   `[dependency-groups]` (PEP 735)— y lo resuelve ESTE Job con uv, en
#   `capa-python:1` (el mismo Python que el puesto). Sube al bucket del
#   inquilino, en `ore/puesto/<capa>/`, DOS cajas con su suma —`capa.tgz`, lo
#   que corre, y `dev.tgz`, lo de desarrollo— y el informe; y deja en el árbol
#   el informe `entorno/<digest>.json` y, junto al `pyproject.toml` del
#   repositorio, su `pylock.toml` (PEP 751): lo resuelto, versionado donde se
#   declara. El puesto, al arrancar, baja las cajas, las comprueba contra el
#   informe y las abre en `/capa` (51-el-puesto.yaml, `traer-la-capa`); una
#   invocación sólo recibe la de lo que corre.
#
# ── Lo que la sesión trae es una RESTRICCIÓN, no un aviso (P2) ─────────────
#   Se resuelve con las versiones de `puesto/python/provisto.txt`: lo
#   compatible se resuelve y ninguna caja lo lleva; lo que choca es un error
#   que lo dice. En Python dos `numpy` no conviven. Y sólo ruedas: ningún
#   paquete ejecuta código al instalarse (`no-build`, la decisión de
#   `--ignore-scripts` en Node).
#
# ── Quién hace qué, y por qué en tres contenedores (como en Node) ─────────
#   traer-el-testigo · `ore-drivers`: el token de la forja del secreto.
#   traer-el-arbol   · `ore-drivers`: clona el árbol en `/trabajo/arbol`.
#   resolver         · `capa-python`: uv contra PyPI. NO tiene el testigo ni
#                      credencial de nube: lo que resuelve no puede publicar.
#                      (Hasta P2, `pip` corría en `ore-drivers` con el testigo.)
#   subir-e-informar · `ore-drivers`: sube las cajas y empuja el informe y el
#                      lock. NO sale a PyPI.
#
# ── Quién lo rinde ─────────────────────────────────────────────────────────
#   `ore-serve` escribe `52-la-capa-<12 hex>.yaml` en la cola (rendido de
#   `plantilla-capa.txt`, ⚠️ esta plantilla) al `POST /entorno`, al abrir un
#   puesto con la capa pendiente o con un commit que toca un `pyproject.toml`.
#   `CAPA` es el digest de la declaración (con el intérprete, `cp314`); el Job
#   la recalcula del árbol y, si el árbol cambió entre medias, el informe lleva
#   el digest de lo que resolvió de verdad.
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: batch/v1
kind: Job
metadata:
  name: la-capa-00000000
  namespace: t-demo
  labels:
    kueue.x-k8s.io/queue-name: cola
    ore.dev/tenant: demo
    ore.dev/rol: driver
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 1200
  template:
    metadata:
      labels:
        ore.dev/rol: driver
        ore.dev/tenant: demo
    spec:
      restartPolicy: Never
      serviceAccountName: driver
      volumes:
        - name: puesto
          emptyDir: { medium: Memory }
        - name: trabajo
          emptyDir: {}
      initContainers:
        - name: traer-el-testigo
          image: europe-west1-docker.pkg.dev/project-8853a180-450d-47be-b83/ore/ore-drivers:main
          env:
            - { name: HOME, value: /tmp }
            - { name: CLOUDSDK_CONFIG, value: /tmp/.gcloud }
          volumeMounts: [{ name: puesto, mountPath: /puesto }]
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              gcloud secrets versions access latest \
                --secret=t-demo-forja-token --out-file=/puesto/forja
              chmod 0400 /puesto/forja
              echo "testigo puesto · $(wc -c < /puesto/forja) bytes"
          resources:
            requests: {cpu: "50m", memory: 128Mi}
            limits:   {cpu: "500m", memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
        - name: traer-el-arbol
          image: europe-west1-docker.pkg.dev/project-8853a180-450d-47be-b83/ore/ore-drivers:main
          imagePullPolicy: Always
          env:
            - { name: HOME, value: /tmp }
            - { name: GIT_TERMINAL_PROMPT, value: "0" }
            - { name: GIT_CONFIG_COUNT, value: "2" }
            - { name: GIT_CONFIG_KEY_0, value: "http.extraheader" }
            - { name: GIT_CONFIG_KEY_1, value: "safe.directory" }
            - { name: GIT_CONFIG_VALUE_1, value: "*" }
            - { name: RAMA, value: "rama-modelo" }
          volumeMounts:
            - { name: puesto, mountPath: /puesto, readOnly: true }
            - { name: trabajo, mountPath: /trabajo }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              export GIT_CONFIG_VALUE_0="Authorization: token $(cat /puesto/forja)"
              cd /trabajo
              git clone --quiet ${RAMA:+--branch "$RAMA"} \
                http://forja.t-demo.svc.cluster.local:3000/t-demo/ontologia.git arbol
              echo "árbol clonado · $(git -C arbol rev-parse --short HEAD)"
          resources:
            requests: {cpu: "100m", memory: 256Mi}
            limits:   {cpu: "1000m", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
        # ⭐ El que sale a PyPI, y sólo él: sin el testigo montado y sin cuenta de
        #   servicio que valga para la nube.
        - name: resolver
          image: europe-west1-docker.pkg.dev/project-8853a180-450d-47be-b83/ore/capa-python:1
          imagePullPolicy: Always
          env:
            - { name: HOME, value: /tmp }
            - { name: TRABAJO, value: /trabajo }
            - { name: CAPA, value: "capa-modelo" }
            # ⭐ 0036 ③: la carpeta del repositorio, o vacío para la celda entera.
            #   La capa es SUYA —la raíz, su paquete y él—, no la unión del árbol.
            - { name: ALCANCE, value: "alcance-modelo" }
            - { name: INTENTO, value: "intento-modelo" }
            # ⭐ El tope, con su mensaje. Un paquete de Python puede ser
            #   enorme (`torch`, gigas): más vale un «no cabe» en el informe que
            #   un puesto que tarda dos minutos en arrancar.
            - { name: TOPE_MB, value: "512" }
          volumeMounts:
            - { name: trabajo, mountPath: /trabajo }
          command: ["/bin/sh", "-c"]
          args:
            - |
              exec /opt/ore/resolver.sh /trabajo/arbol "$ALCANCE"
          resources:
            requests: {cpu: "500m", memory: 1Gi}
            limits:   {cpu: "2000m", memory: 3Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
      containers:
        - name: subir-e-informar
          image: europe-west1-docker.pkg.dev/project-8853a180-450d-47be-b83/ore/ore-drivers:main
          imagePullPolicy: Always
          env:
            - { name: HOME, value: /tmp }
            - { name: CLOUDSDK_CONFIG, value: /tmp/.gcloud }
            - { name: GIT_TERMINAL_PROMPT, value: "0" }
            - { name: GIT_CONFIG_COUNT, value: "2" }
            - { name: GIT_CONFIG_KEY_0, value: "http.extraheader" }
            - { name: GIT_CONFIG_KEY_1, value: "safe.directory" }
            - { name: GIT_CONFIG_VALUE_1, value: "*" }
            - { name: RAMA, value: "rama-modelo" }
            - { name: ALCANCE, value: "alcance-modelo" }
            - { name: BUCKET, value: "project-8853a180-450d-47be-b83-t-demo-copia" }
          volumeMounts:
            - { name: puesto, mountPath: /puesto, readOnly: true }
            - { name: trabajo, mountPath: /trabajo }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              export GIT_CONFIG_VALUE_0="Authorization: token $(cat /puesto/forja)"
              [ -f /trabajo/informe.json ] || { echo "· el árbol no declara dependencias de Python: nada que subir"; exit 0; }
              DIGEST=$(cat /trabajo/digest.txt)
              # ── 1 · la caja al bucket, con el nombre de la capa ──
              if [ -f /trabajo/capa.tgz ]; then
                gcloud storage cp -q /trabajo/capa.tgz "gs://$BUCKET/ore/puesto/$DIGEST/capa.tgz"
                echo "### capa.tgz ($(du -k /trabajo/capa.tgz | cut -f1) KB) en gs://$BUCKET/ore/puesto/$DIGEST/"
              else
                echo "### nada que subir: lo declarado lo pone ya el contenedor, o no se resolvió"
              fi
              # P2: y la de lo de desarrollo, a su lado.
              if [ -f /trabajo/dev.tgz ]; then
                gcloud storage cp -q /trabajo/dev.tgz "gs://$BUCKET/ore/puesto/$DIGEST/dev.tgz"
                echo "### dev.tgz ($(du -k /trabajo/dev.tgz | cut -f1) KB) en gs://$BUCKET/ore/puesto/$DIGEST/"
              fi
              # ── 2 · el informe al árbol, uno POR DIGEST (0036 ③) ──
              cd /trabajo/arbol
              mkdir -p entorno
              # El informe se sube CON LA CAJA y no después: si el commit
              # fallara, la caja ya está y el siguiente intento la reusa.
              gcloud storage cp -q /trabajo/informe.json "gs://$BUCKET/ore/puesto/$DIGEST/informe.json"
              cp /trabajo/informe.json "entorno/$DIGEST.json"
              git add -A entorno
              # ── 3 · ⭐ P2: el lock al repositorio, junto a su pyproject.toml ──
              #   Lo que se instaló, versionado donde se declara: sólo de una
              #   capa lista (el resolver no lo deja si no) y sólo en la carpeta
              #   de un repositorio que tiene su pyproject.toml. La celda (sin
              #   alcance) no tiene dónde.
              LOCK=""
              case "$ALCANCE" in
                packages/*) case "$ALCANCE" in *..*) ;; *)
                  if [ -f /trabajo/lock-del-repositorio.toml ] && [ -f "$ALCANCE/pyproject.toml" ]; then
                    cp /trabajo/lock-del-repositorio.toml "$ALCANCE/pylock.toml"
                    git add "$ALCANCE/pylock.toml"
                    LOCK=" · $ALCANCE/pylock.toml"
                  fi ;; esac ;;
              esac
              if git diff --cached --quiet; then echo "· el informe no cambió"; exit 0; fi
              ESTADO=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["estado"])' "entorno/$DIGEST.json")
              git -c user.name=la-capa -c user.email=la-capa@invalido \
                commit -q -m "La capa $DIGEST (Python): $ESTADO$LOCK"
              git push -q origin HEAD:${RAMA:-main}
              echo "✓ informe empujado · $(git rev-parse --short HEAD)"
          resources:
            requests: {cpu: "200m", memory: 512Mi}
            limits:   {cpu: "1000m", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
