# ═══════════════════════════════════════════════════════════════════════════
# LA ENTRADA DEL INQUILINO — su hostname colgado de la puerta compartida
#
# E6 de la `0022`, la mitad que vive en el compartimento del inquilino. La otra
# —`19-la-puerta-del-tunel.yaml`— es de la plataforma y dice QUIÉN puede colgarse.
#
# ⛔ Y esto no es el alta. La entrada es LA PUERTA: el host por el que se llega
#   a este inquilino desde fuera. Lo guarda `iam.organizacion.entrada` con un
#   `unique` encima (`022`), así que dos inquilinos reclamando el mismo host es
#   una violación de clave en la base **antes** de que nadie escriba esto.
#
# ── ⭐ Dos objetos, y ninguno sobra ────────────────────────────────────────
#
#   la HTTPRoute       dice qué host es mío y a qué `Service` va
#   la NetworkPolicy   deja entrar a Envoy, que hoy NO puede
#
# La segunda es la que se olvida. `entrada-al-control` (`40-ore-serve.yaml`)
# sólo admite tráfico del propio namespace del inquilino, así que sin esto la
# ruta queda `Accepted` y programada y quien llame recibe un **502 sin una sola
# línea en ningún registro**: una `NetworkPolicy` no rechaza, tira el paquete.
#
# ⚠️ Hasta ORE 0060 C2·5 (2026-10-11) eran cuatro: con el balanceador de Google
#   iban una `HealthCheckPolicy` (la salud en `/salud`, que la `Gateway` de GKE no
#   deducía) y una `GCPBackendPolicy` de 300 s (el flujo de 0037 ②). Con Envoy, la
#   salud es la readiness del pod y el plazo es la `BackendTrafficPolicy` de la
#   puerta, para todas las celdas a la vez (⑮ de `gen-inquilino.py` lo comprueba).
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: entrada
  namespace: t-demo
  labels:
    ore.dev/tenant: demo
spec:
  parentRefs:
    # ⭐ La puerta está en OTRO namespace, y no hace falta un `ReferenceGrant`:
    #   quien autoriza colgarse es la puerta con su `allowedRoutes`, no el
    #   inquilino. Un `ReferenceGrant` haría falta para apuntar a un `Service`
    #   de otro namespace — y eso no pasa aquí, ni debe.
    # La puerta del túnel (ORE 0060 C2, `19-la-puerta-del-tunel.yaml`): Envoy
    # dentro del clúster, detrás de Cloudflare. La de Google (`puerta`, un
    # balanceador global) se retiró en C2·5.
    - name: puerta-tunel
      namespace: ore-system
      sectionName: ore
  # ⛔ UN hostname, y es el de la fila. Si esto y `iam.organizacion.entrada` se
  #   separaran, la consola mandaría a la gente a una puerta que no existe.
  hostnames:
    - demo.ore.paladio.io
  rules:
    - backendRefs:
        - name: ore-serve
          port: 8080
      # ⚠️ Y NO hay regla para el custodio. Está medido que hoy no lo alcanza
      #   nadie —ni desde dentro del propio inquilino—, y publicarlo sería la
      #   decisión contraria tomada por descuido: quien abre un secreto no tiene
      #   por qué estar en internet. El día que la consola necesite pedirle algo,
      #   pasa por `ore-serve` o se decide aparte, y se escribe por qué.
---
# Y Envoy, la puerta del túnel (ORE 0060 C2): no llega desde los rangos de Google
# sino desde sus pods, en `envoy-gateway-system`. Sin esto, el mismo 502 mudo.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: entrada-de-la-puerta-del-tunel
  namespace: t-demo
spec:
  podSelector:
    matchLabels:
      ore.dev/rol: control
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: envoy-gateway-system }
          podSelector:
            matchLabels: { app.kubernetes.io/name: envoy }
      ports:
        - protocol: TCP
          port: 8080
