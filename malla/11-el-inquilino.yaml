# ═══════════════════════════════════════════════════════════════════════════
# UN INQUILINO — y esto es la PLANTILLA, no la configuración de un cliente
#
# ── ⛔ Por qué esto sale de `10-kueue.yaml` ─────────────────────────────────
#
# El namespace del inquilino nacía dentro del manifiesto de la COLA. Con uno
# daba igual. Con `ore-serve` por organización —decidido, porque los clientes
# son enterprise y administración pública— dar de alta al segundo no puede
# significar reaplicar la configuración de Kueue: son dos cosas con dos ritmos,
# y una de ellas la va a escribir una máquina.
#
# ⇒ En `10-kueue.yaml` se queda lo que es del CLÚSTER —el sabor, que describe
#   qué nodos sirven—. Aquí está lo que es de UN inquilino.
#
# ── ⭐⭐ LO QUE CAMBIA POR INQUILINO, Y NO HAY MÁS ─────────────────────────
#
#       ore.dev/tenant: demo   el nombre de la organización
#       t-demo                 su namespace       `t-<nombre>`
#       cq-demo                su cola de clúster `cq-<nombre>`
#
# Tres sustituciones. Es lo que el aprovisionador tendrá que rellenar, y por eso
# están dichas aquí arriba en vez de descubrirse leyendo.
#
# ⭐ Y están escritas con su forma COMPLETA —`t-demo`, `cq-demo`— y nunca con la
# palabra suelta. `gen-inquilino.py` sustituye también dentro de los comentarios y
# exige que el nombre del inquilino modelo **no sobreviva en ningún sitio** de lo
# renderizado; bajar esa comprobación para tolerar la prosa dejaría pasar también
# un `t-demo` olvidado en un VALOR, que es el `ore-serve` de un cliente clonando
# el árbol de otro.
#
# ⚠️ Y esta sección es la prueba de que muerde: se escribió con la palabra suelta
# dentro y la comprobación se puso roja señalando la línea.
#
# ⚠️ Y lo que NO está aquí, a propósito, porque no se puede escribir de
# antemano: los dos `Secret` —el testigo de la forja de ESE inquilino y el del
# agente— y el repositorio en la forja. Los tres nacen de tres llamadas a la
# forja y al IdP, no de un YAML.
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Namespace
metadata:
  name: t-demo
  labels:
    ore.dev/tenant: demo
    ore.dev/rol: cargas

    # ── Pod Security Admission ─────────────────────────────────────────────
    #
    # ⚠️ `baseline` y no `restricted`, y la diferencia importa: `restricted`
    # RECHAZA un pod que no declare `runAsNonRoot` y `seccompProfile`, y hoy los
    # nuestros no los declaran. Ponerlo ahora no endurecería el inquilino: lo
    # dejaría sin arrancar.
    #
    # ⭐ Por eso `warn` y `audit` SÍ van a `restricted`: cada pod que no llegue
    # lo dice al crearse y queda en el registro de auditoría del clúster. Es la
    # lista de trabajo para subir el `enforce`, y se escribe sola.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
# ── La cola del inquilino, dentro de un COHORTE ────────────────────────────
#
# El cohorte es la pieza que hoy no se ve y mañana lo es todo: las colas de un
# mismo cohorte se PRESTAN la cuota que no usan. Con un inquilino no hace nada;
# con dos, el segundo se declara y el reparto justo ya existe — no hay que
# rediseñar la cola, hay que escribir un manifiesto.
#
# La cuota nominal sale de lo que el pool puede dar de VERDAD: 3 nodos
# e2-standard-4 son 12 vCPU y 48 Gi en bruto, y GKE reserva por nodo. Se
# declara 10 y 36Gi, que es conservador a propósito: una cuota que promete más
# de lo que hay convierte una espera en un pod que no arranca nunca.
#
# ⚠️ Con varios inquilinos esta cifra deja de ser «lo que hay» y pasa a ser «lo
# que le toca a éste». `borrowingLimit: 0` dice que no se presta; el día que se
# quiera repartir de verdad, es aquí y no en otro sitio.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: cq-demo
spec:
  namespaceSelector: {}
  cohortName: ore
  resourceGroups:
    - coveredResources: ["cpu", "memory"]
      flavors:
        - name: jobs
          resources:
            # ⚠️ ENTRECOMILLADAS, y no es estilo. Son `resource.Quantity`, y el API
            # las guarda como cadenas: escritas como números se aceptan, pero lo
            # que queda almacenado es `"10"` y `"0"`. Con eso, el manifiesto y lo
            # vivo dejan de ser el mismo texto aunque signifiquen lo mismo, y
            # `la-deriva-del-inquilino.sh` lo canta como una diferencia.
            #
            # ⭐ Lo destapó Flux: mientras aplicaba `kubectl` no se notaba, y en
            # cuanto el agente reescribió el objeto con apply del lado del
            # servidor apareció. Una diferencia que sólo es de forma ensucia la
            # prueba que tiene que cazar las que no lo son.
            - name: cpu
              nominalQuota: "10"
              borrowingLimit: "0"
            - name: memory
              nominalQuota: "36Gi"
              borrowingLimit: "0"
  preemption:
    reclaimWithinCohort: Any
    withinClusterQueue: LowerPriority
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: cola
  namespace: t-demo
spec:
  clusterQueue: cq-demo
---
# La misma base que `ore-system`: se niega por defecto, se abre después.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-ingress
  namespace: t-demo
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-egress
  namespace: t-demo
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
# El techo DURO del namespace, por encima de la cola. Kueue decide CUÁNDO
# arranca un Job; esto decide cuánto puede pedir en total. Son dos preguntas y
# hacen falta las dos: sin la cuota, un Job mal escrito pide 40 CPU y Kueue lo
# deja esperando para siempre en vez de rechazarlo.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: cuota
  namespace: t-demo
spec:
  hard:
    requests.cpu: "10"
    requests.memory: 36Gi
    count/jobs.batch: "50"
---
# ── Y la puerta a la forja, por el otro lado ───────────────────────────────────
#
# Sin esto la forja está viva y **nadie llega**: `salida-del-driver` abre el
# mundo MENOS las redes privadas —`10.0.0.0/8` entre ellas— y la forja vive
# justo ahí. Es la consecuencia correcta de una política escrita en negativo, y
# la que hay que abrir a mano, con nombre.
#
# Alcanza a los pods de `t-demo` con rol `driver` o `ore`, y sólo al puerto de
# la forja. No es «que salgan a la red interna»: es que puedan hablar con UNA
# cosa.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: salida-a-la-forja
  namespace: t-demo
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: forja
          podSelector:
            matchLabels:
              ore.dev/rol: forja
      ports:
        - protocol: TCP
          port: 3000
---
# ── Y hablar con el EMISOR ────────────────────────────────────
#
# ✓ 2026-09-09 · Vivia en `97-la-consola-con-token.yaml`, un fichero de PRUEBAS,
#    y `t-demo` la tenia SOLO porque alguien habia corrido ese test. El segundo
#    inquilino nacio sin ella, y su refresco de JWKS murio con un `curl` agotado
#    a los 134 segundos — un sintoma que manda a mirar el IdP, no una politica
#    que no existe.
#
# ⇒ Una regla que el inquilino NECESITA no puede vivir en su prueba. Y sin un
#   segundo inquilino esto no se ve: el primero funcionaba.
#
# Alcanza a TODO el inquilino y no a un rol: cualquiera que vaya a hablar con el
# plano de control necesita antes hablar con el emisor. Lo que sigue sin poder es
# salir a internet — eso lo decide `salida-del-driver`, y esta regla no lo toca.
# Pedir un token es una cosa normal, y por eso esto alcanza a TODO el
# inquilino y no a un rol: cualquiera que vaya a hablar con el plano de control
# necesita antes hablar con el emisor. Lo que sigue sin poder es salir a
# internet — eso lo decide `salida-del-driver`, y esta regla no lo toca.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: salida-al-emisor
  namespace: t-demo
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              ore.dev/rol: identidad
      ports:
        - protocol: TCP
          port: 8080
---
# ── Y hablar con su PROPIO plano de control ──────────────────────
#
# ✓ 2026-09-09 · Vivia en `96-la-consola-contra-el-servidor.yaml`, otro fichero
#    de PRUEBAS. El segundo inquilino nacio sin ella y el alta de una fuente se
#    colgo dos minutos y medio: `deny-all-egress` gana, y un paquete tirado no
#    da error — da un `curl` que no vuelve.
#
# ⇒ Segundo caso identico en dos ficheros vecinos, el mismo dia. Lo que los une
#   no es el descuido: es que **el primero funcionaba**, y una regla que sobrevive
#   porque alguien corrio su test no se distingue de una que esta puesta.
# Y la puerta para que un pod del inquilino pueda hablar con el plano de
# control. Sin esto, `deny-all-egress` gana y la consola no llega: es la misma
# consecuencia de escribir la red en negativo que ya obligó a abrir la forja.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: salida-al-control
  namespace: t-demo
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              ore.dev/rol: control
      ports:
        - protocol: TCP
          port: 8080
