{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "annotations": {
      "app.quarkus.io/build-timestamp": "2024-12-03 - 07:20:51 +0000",
      "app.quarkus.io/quarkus-version": "3.15.1",
      "app.quarkus.io/vcs-uri": "https://github.com/keycloak/keycloak.git",
      "kustomize.toolkit.fluxcd.io/prune": "disabled"
    },
    "labels": {
      "app.kubernetes.io/managed-by": "quarkus",
      "app.kubernetes.io/name": "keycloak-operator",
      "app.kubernetes.io/version": "26.0.7"
    },
    "name": "keycloak-operator",
    "namespace": "identidad"
  },
  "spec": {
    "progressDeadlineSeconds": 600,
    "replicas": 1,
    "revisionHistoryLimit": 10,
    "selector": {
      "matchLabels": {
        "app.kubernetes.io/name": "keycloak-operator"
      }
    },
    "strategy": {
      "rollingUpdate": {
        "maxSurge": "25%",
        "maxUnavailable": "25%"
      },
      "type": "RollingUpdate"
    },
    "template": {
      "metadata": {
        "annotations": {
          "app.quarkus.io/build-timestamp": "2024-12-03 - 07:20:51 +0000",
          "app.quarkus.io/quarkus-version": "3.15.1",
          "app.quarkus.io/vcs-uri": "https://github.com/keycloak/keycloak.git"
        },
        "labels": {
          "app.kubernetes.io/managed-by": "quarkus",
          "app.kubernetes.io/name": "keycloak-operator",
          "app.kubernetes.io/version": "26.0.7"
        }
      },
      "spec": {
        "containers": [
          {
            "env": [
              {
                "name": "KUBERNETES_NAMESPACE",
                "valueFrom": {
                  "fieldRef": {
                    "apiVersion": "v1",
                    "fieldPath": "metadata.namespace"
                  }
                }
              },
              {
                "name": "RELATED_IMAGE_KEYCLOAK",
                "value": "quay.io/keycloak/keycloak:26.0.7"
              }
            ],
            "image": "quay.io/keycloak/keycloak-operator:26.0.7",
            "imagePullPolicy": "Always",
            "livenessProbe": {
              "failureThreshold": 3,
              "httpGet": {
                "path": "/q/health/live",
                "port": 8080,
                "scheme": "HTTP"
              },
              "initialDelaySeconds": 5,
              "periodSeconds": 10,
              "successThreshold": 1,
              "timeoutSeconds": 10
            },
            "name": "keycloak-operator",
            "ports": [
              {
                "containerPort": 8080,
                "name": "http",
                "protocol": "TCP"
              }
            ],
            "readinessProbe": {
              "failureThreshold": 3,
              "httpGet": {
                "path": "/q/health/ready",
                "port": 8080,
                "scheme": "HTTP"
              },
              "initialDelaySeconds": 5,
              "periodSeconds": 10,
              "successThreshold": 1,
              "timeoutSeconds": 10
            },
            "resources": {
              "limits": {
                "cpu": "700m",
                "memory": "450Mi"
              },
              "requests": {
                "cpu": "100m",
                "memory": "450Mi"
              }
            },
            "startupProbe": {
              "failureThreshold": 3,
              "httpGet": {
                "path": "/q/health/started",
                "port": 8080,
                "scheme": "HTTP"
              },
              "initialDelaySeconds": 5,
              "periodSeconds": 10,
              "successThreshold": 1,
              "timeoutSeconds": 10
            },
            "terminationMessagePath": "/dev/termination-log",
            "terminationMessagePolicy": "File"
          }
        ],
        "dnsPolicy": "ClusterFirst",
        "restartPolicy": "Always",
        "schedulerName": "default-scheduler",
        "securityContext": {},
        "serviceAccount": "keycloak-operator",
        "serviceAccountName": "keycloak-operator",
        "terminationGracePeriodSeconds": 30
      }
    }
  }
}
