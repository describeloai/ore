# ═══════════════════════════════════════════════════════════════════════════
# EL OPERADOR DE KEYCLOAK — declarado (0048 I2), y hasta hoy instalado a mano
#
# El IdP (`60-idp.yaml`) es un `Keycloak` CR: sin su operador no hay IdP, y el
# operador no estaba en NINGUN repositorio. Se instalo el 2026-09-08 con el
# manifiesto oficial de 26.0.7 (`kubectl apply`, ns `identidad`) y un parche a
# mano: la CPU pedida de 300m a 100m (el nodo estable iba justo). Esto es LO QUE
# CORRE, exportado del cluster —no descargado—, sin lo que pone el servidor.
#
# ⛔ `prune: disabled` en todo: si este fichero se fuera, Flux borraria el
#   operador; y de `59-crds-de-keycloak.yaml`, los CRD —y con ellos TODOS los CR
#   de Keycloak: el IdP entero—. Retirarlo es un acto a mano, no un `git rm`.
#
# ⚠️ Subir de version (26.0.7 → 26.2, que M5 de 0047 necesita para tokens por
#   celda) es cambiar ESTE fichero, los CRD y la imagen del IdP a la vez.
# ═══════════════════════════════════════════════════════════════════════════
