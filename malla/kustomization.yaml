# ═══════════════════════════════════════════════════════════════════════════
# LO QUE ES LA PLATAFORMA — y por eso esta lista es EXPLICITA y no un comodin
#
# `malla/` mezcla tres cosas que se parecen porque son YAML y no lo son:
#
#   LA PLATAFORMA     lo de aqui abajo. Uno de cada, compartido por todos los
#                     inquilinos: el IdP, la forja, Kueue, Flux, la puerta.
#   LAS PLANTILLAS    `11`, `20`, `40`…`44`, `50`. Llevan `demo`
#                     dentro y son la ENTRADA de `gen-inquilino.py`. Lo que
#                     corre de verdad son sus copias rendidas, que viven en
#                     `inquilino-<org>` y las aplica OTRO `Kustomization`.
#   LAS PRUEBAS       los `9x-` y los guiones. Se corren a mano, contra un
#                     inquilino, cuando alguien quiere comprobar algo.
#
# ── ⛔⛔ Y POR ESO UN `resources: ["."]` HABRIA SIDO UN DESASTRE ───────────
#
# No un fallo: un DESASTRE silencioso. `malla/40-ore-serve.yaml` declara el
# `Deployment` de `t-demo` con `demo` dentro, y ese mismo objeto ya lo gobierna
# el `Kustomization` de `inquilino-demo`. Dos duenos sobre un objeto no dan un
# error — dan dos controladores escribiendolo por turnos, y una plantilla que
# alguien edite pensando que edita una plantilla se aplicaria a un cliente.
#
# ⇒ La lista se escribe a mano, y anadir un manifiesto de plataforma exige
#   anadirlo aqui. Es el mismo trato que `PLANTILLAS` en `gen-inquilino.py`, y
#   alli hay una comprobacion —la ⑤— que caza al que se olvide. Aqui todavia no.
#
# ── ⚠️ Los `9x-` fuera, y no por ser pruebas ──────────────────────────────
#
# Por ser JOBS QUE HACEN COSAS. `99-el-cerrojo-de-la-llave.yaml` intenta abrir
# con la clave de otro para demostrar que no puede; `93-discover.yaml` lee un
# origen de verdad. Reconciliarlos seria correrlos cada vez que Flux mire.
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # ── El suelo ────────────────────────────────────────────────────────────
  - 00-base.yaml
  - 10-kueue.yaml
  # ⚠️ Flux se gobierna a si mismo, y es lo que hace `flux bootstrap`. Lo que
  #   compra es que la pieza que detecta la deriva no pueda derivar en silencio.
  #   Lo que cuesta es que un commit malo aqui rompa al que tendria que
  #   arreglarlo — por eso el `Kustomization` de la malla lleva `prune: false`:
  #   un fichero que desaparezca no se lleva por delante al controlador.
  - 12-flux.yaml
  # El enganche del inquilino. Vive aqui A PROPOSITO: es la parte que decide QUE
  # SE OBEDECE, y si viviera dentro de lo que se obedece, quien escribiera alli
  # cambiaria a que apunta el agente.
  - 13-el-inquilino-reconciliado.yaml
  # Y el de la malla, que es este mismo arbol. Se incluye para que tampoco EL
  # pueda derivar: si alguien cambia a mano a que rama apunta, Flux lo devuelve.
  - 15-la-malla-reconciliada.yaml
  # El aprovisionador: su cuenta, su Job y por donde puede salir.
  - 16-el-aprovisionador.yaml
  # El tercer controlador de Flux: el que recibe el aviso de la forja en vez de
  # sondear. Revierte una exclusion de la E3, y el motivo esta en su cabecera.
  - 17-el-aviso.yaml
  # ── La puerta compartida ────────────────────────────────────────────────
  - 14-la-puerta.yaml
  # ── La forja ────────────────────────────────────────────────────────────
  - 30-forja.yaml
  - 31-copias-de-la-forja.yaml
  # ── La identidad ────────────────────────────────────────────────────────
  - 60-idp.yaml
  # ⛔⛔ `61-realms.yaml` NO ESTÁ, y esto lo destapó `kubectl diff -k` antes de
  #   dejar que Flux tocara nada. Los tres `KeycloakRealmImport` vivos difieren
  #   del fichero, así que aplicarlos les sube la `generation` — y eso hace que
  #   el operador **reimporte los realms**.
  #
  # ⚠️ Reimportar no es aplicar un YAML: es que el operador rehaga el realm a
  #   partir de la representación del fichero. Y el realm vivo lleva cosas que
  #   el fichero no describe — `ore-agente` en `rubix-dev` se creó A MANO con
  #   `kcadm` porque el operador sólo importa un realm AL CREARLO. Su secreto de
  #   cliente es el que hay dentro del `Secret` `idp-agente`.
  #
  # ⇒ Poner la malla bajo GitOps no puede tener como efecto colateral rehacer la
  #   identidad de la plataforma. Entra cuando el fichero y los tres realms digan
  #   lo mismo, y eso es un trabajo con su propia medida — no una línea de esta
  #   lista.
  - 62-copias-del-idp.yaml
  - 63-entrada-del-idp.yaml
  - 65-iam.yaml
  - 66-ore-iam.yaml
  - 67-iam-servir.yaml

# ═══════════════════════════════════════════════════════════════════════════
# EL PUESTO DEL APROVISIONADOR — y hasta hoy se subia A MANO
#
# ── ⛔⛔ LO QUE ESTO ARREGLA, Y ESTABA ROTO EN SILENCIO ────────────────────
#
# El Job de `16-…` monta un `ConfigMap` llamado `aprovisionador` con el guion y
# las plantillas dentro, y `gen-inquilino.py` lee las plantillas de SU PROPIO
# directorio — o sea, de esa copia. Nada de este arbol lo creaba: se subio con
# un `kubectl create configmap --from-file` y ahi se quedo.
#
# Medido el 2026-09-10:
#
#     ConfigMap ore-system/aprovisionador   creado  2026-09-09 18:09 UTC
#     8d4000a  el cliente del cofre                 2026-09-09 21:18 UTC
#
# ⇒ Tres horas de retraso, y creciendo. Aprovisionar un inquilino HOY rendiria
#   el Job de catalogo viejo —el que no sabe pedirle nada al cofre— y nadie se
#   enteraria: no hay anotacion de commit, no hay comprobacion, no hay sintoma.
#
# ⚠️ Y es el mismo fallo que el relevo de CI acababa de destapar en `t-prueba`:
#   EN VERDE Y DESACTUALIZADO. La copia a mano no es la alternativa prudente a
#   automatizar; es la que ya estaba fallando.
#
# ── ⭐ Por que un GENERADOR y no un fichero mas ───────────────────────────
#
# Porque un `ConfigMap` escrito a mano en un YAML seria la MISMA copia, solo que
# versionada: habria que acordarse de pegar dentro cada cambio de las
# plantillas. El generador no tiene copia — lee los ficheros de al lado cada vez
# que `kustomize-controller` construye.
#
# ⛔ `disableNameSuffixHash` a proposito. Kustomize le pone por defecto un
#   sufijo con el hash del contenido, y ese nombre es el que el Job referencia:
#   con sufijo, cada cambio de plantilla dejaria al Job apuntando a un
#   `ConfigMap` que ya no existe. El sufijo existe para forzar el relevo de un
#   `Deployment`, y aqui no hay `Deployment` — hay un Job que se crea entero
#   cada vez y monta lo que haya en ese momento, que es justo lo que se quiere.
#
# ⚠️ Y el primer efecto de este arreglo es que el contenido del `ConfigMap`
#   CAMBIA de golpe en la proxima reconciliacion, poniendose al dia de tres
#   horas de una vez. Es lo que se busca, pero conviene no descubrirlo.
#
# ⭐ La comprobacion ⑧ de `gen-inquilino.py` exige que esta lista sea
#   exactamente `PLANTILLAS` + `POR_FUENTE` + los tres guiones. Olvidar una
#   plantilla aqui daba un `FileNotFoundError` dentro de un pod, a mitad de un
#   alta y sin nadie delante.
configMapGenerator:
  - name: aprovisionador
    # ⛔⛔ Y EL NAMESPACE, QUE SE ESCAPO POR POCO. Un generador sin `namespace`
    #   produce el objeto en `default` — no falla, no avisa: crea un
    #   `ConfigMap` inutil en un sitio donde nadie lo mira y deja vivo al de
    #   `ore-system`, que es justo la copia vieja que esto viene a matar.
    #
    # ⭐ Lo destapo `kubectl diff -k malla/` antes de dejar que Flux tocara
    #   nada — la misma disciplina que dejo `61-realms.yaml` fuera de la lista.
    #   Construir en verde no es aplicar bien.
    #
    # ⚠️ Y va POR ENTRADA y no como `namespace:` de arriba: un namespace global
    #   reescribiria los setenta y nueve objetos de esta lista, que viven en
    #   siete namespaces distintos.
    namespace: ore-system
    files:
      # Los tres guiones: el que da de alta a uno, el que los converge a todos,
      # y el que rinde.
      - aprovisionar-inquilino.sh
      - converger-inquilinos.sh
      - gen-inquilino.py
      # Y las plantillas que rinde.
      - 11-el-inquilino.yaml
      - 20-driver.yaml
      - 40-ore-serve.yaml
      - 41-el-cofre.yaml
      - 42-el-arbol.yaml
      - 43-la-entrada.yaml
      - 44-el-catalogo.yaml
      - 50-jwks.yaml

generatorOptions:
  disableNameSuffixHash: true
  labels:
    ore.dev/tenant: system
    ore.dev/rol: aprovisionador
