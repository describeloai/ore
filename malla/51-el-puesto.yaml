# ═══════════════════════════════════════════════════════════════════════════
# EL PUESTO — la sesión viva de una persona en su celda (0031 W3.1)
#
# ⭐⭐ Es la misma figura que `48-la-copia.yaml` y `49-la-invocacion.yaml` —un
#   Job de Kueue en el pool privado, con la identidad del pod y el testigo
#   traído por un `initContainer`— y cambia la VIDA: este Job **no termina**.
#   Dentro corre el agente de un ENTORNO (W3.4): `puesto-python:1` (python
#   3.12, pandas, pyarrow, duckdb, GCS · `puesto/python/agente.py`),
#   `puesto-node:1` (node 24, TS sin transpilador, duckdb · `puesto/node/
#   agente.mjs`) o `puesto-jvm:1` (JDK 21, JShell en proceso, duckdb JDBC ·
#   `puesto/jvm/ore/Agente.java`): pide celdas a `ore-serve` por polling largo,
#   las ejecuta en un espacio que dura toda la sesión, y devuelve la salida
#   tipada. La consola nunca habla con este pod. Cada imagen trae su `CMD`
#   (el agente), por eso aquí no hay `command`.
#
# ── Quién lo rinde y quién lo retira ────────────────────────────────────────
#
#   `ore-serve` escribe `51-el-puesto-<persona>-<entorno>.yaml` en la cola del
#   inquilino (rendido de `plantilla-puesto.txt`, ⚠️ esta plantilla: el hueco
#   del entorno → la imagen) al `POST /puestos`, y Flux lo
#   aplica. `DELETE /puestos/{id}` quita el fichero y `prune: true` se lleva
#   el Job. Uno por persona y entorno: el fichero se llama por ellos.
#
# ── Cuándo muere ───────────────────────────────────────────────────────────
#
#   · sin celdas durante `TTL` segundos: el agente se va (el TTL de inactividad
#     es del agente, no de la cola — medido en 0031);
#   · `activeDeadlineSeconds`: el tope de sesión, lo pone el Job;
#   · `DELETE /puestos/{id}`, o un relevo de `ore-serve` (el agente recibe 410
#     y se cierra: el estado de la sesión vive en memoria del servidor).
#
# ── ⛔ La red: `ore.dev/rol: puesto`, y NO `driver` ─────────────────────────
#
#   Medido el 2026-09-19 (`medida-w3-el-puesto.py`): un puesto con el rol del
#   driver ALCANZA INTERNET —`salida-del-driver` abre 0.0.0.0/0 porque el driver
#   lee orígenes, y `jobs-p` es privado pero hay Cloud NAT—. Este rol tiene su
#   política (`21-el-puesto.yaml`): DNS, metadatos, `ore-serve`, el emisor y
#   Google por `private.googleapis.com`. Nada más.
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: batch/v1
kind: Job
metadata:
  # El nombre lleva el resumen del contenido, como la copia y la invocación:
  # `puesto-<persona>-<8 hex>`. El renderizador lo pone.
  name: puesto-00000000
  namespace: t-demo
  labels:
    # ⛔ La cola de Kueue, y no es opcional: es lo que hace que este pod aterrice
    #   en el pool privado y cuente contra la cuota del inquilino.
    kueue.x-k8s.io/queue-name: cola
    ore.dev/tenant: demo
    ore.dev/rol: puesto
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  # El tope de sesión (0031: 24 h en Foundry; aquí 8 h mientras se mide).
  activeDeadlineSeconds: 28800
  template:
    metadata:
      labels:
        ore.dev/rol: puesto
        ore.dev/tenant: demo
    spec:
      restartPolicy: Never
      # La cuenta del puesto (`21-el-puesto.yaml`): Workload Identity con
      # lectura del bucket de copias y de los secretos del agente, y NADA de
      # escritura: `write()` escribe con el token que el catálogo le presta.
      # La RED no va por la cuenta sino por el rol.
      serviceAccountName: puesto
      volumes:
        - name: puesto
          emptyDir: { medium: Memory }
        - name: trabajo
          emptyDir: {}
        # ⭐ La capa (0031 §3, W3.2): las dependencias del árbol, instaladas al
        #   arrancar desde la caja de ruedas del bucket (52-la-capa.yaml).
        - name: capa
          emptyDir: {}
      initContainers:
        # El testigo del agente de la celda: con él el agente pide tokens al
        # emisor (client credentials) y habla con `ore-serve` como agente.
        #
        # ⭐ Por HTTP y no por `gcloud` (W3.7 ④). Medido en «Lo medido para
        #   W3.7» §5: `gcloud secrets versions access` en la imagen de drivers
        #   tardaba **31 s** de los 48 del trabajo entero — el arranque de
        #   gcloud, no la red—. El token del pod (Workload Identity, por el
        #   servidor de metadatos) contra la API REST de Secret Manager
        #   (`private.googleapis.com`, que este rol alcanza) es la misma
        #   llamada sin el arranque: la imagen del puesto ya trae python.
        - name: traer-el-testigo
          image: europe-west1-docker.pkg.dev/project-8853a180-450d-47be-b83/ore/puesto-python:1
          imagePullPolicy: Always
          env:
            - { name: HOME, value: /tmp }
            - { name: PROYECTO, value: "project-8853a180-450d-47be-b83" }
            - { name: CELDA, value: t-demo }
          volumeMounts: [{ name: puesto, mountPath: /puesto }]
          command: ["python3", "-c"]
          args:
            - |
              import base64, json, os, time, urllib.request
              t0 = time.time()
              r = urllib.request.Request("http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token", headers={"Metadata-Flavor": "Google"})
              token = json.load(urllib.request.urlopen(r, timeout=10))["access_token"]
              for p in ("cliente", "secreto"):
                  u = "https://secretmanager.googleapis.com/v1/projects/%s/secrets/%s-agente-%s/versions/latest:access" % (os.environ["PROYECTO"], os.environ["CELDA"], p)
                  d = json.load(urllib.request.urlopen(urllib.request.Request(u, headers={"Authorization": "Bearer " + token}), timeout=20))
                  with open("/puesto/agente-" + p, "wb") as f:
                      f.write(base64.b64decode(d["payload"]["data"]))
                  os.chmod("/puesto/agente-" + p, 0o444)
              print("agente puesto · %s · %d ms" % (open("/puesto/agente-cliente").read().strip(), (time.time() - t0) * 1000), flush=True)
          resources:
            requests: {cpu: "50m", memory: 128Mi}
            limits:   {cpu: "500m", memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile: { type: RuntimeDefault }
            capabilities: { drop: [ALL] }
        # ⭐ La capa: sin `pip` contra internet (esta red no lo alcanza). Baja
        #   `ore/puesto/<capa>/` del bucket y lo instala en /capa con
        #   `--no-index`; medido: ~1 s de bajada y ~3 s de instalación (polars).
        #   Sin capa (`CAPA` vacía) no hace nada.
        - name: traer-la-capa
          image: europe-west1-docker.pkg.dev/project-8853a180-450d-47be-b83/ore/puesto-python:1
          # ⛔ `Always`, y no es descuido: `:1` es el ENTORNO (lo que una celda
          #   importa no cambia), pero el agente y el SDK viajan dentro y cambian
          #   con cada commit. Con `IfNotPresent` el nodo se quedaba con el `:1`
          #   viejo (medido en victor el 2026-09-19: una celda SQL llegó a un
          #   agente que aún no sabía de SQL). `Always` sólo compara el digest
          #   con el registro: ~1 s cuando ya está.
          imagePullPolicy: Always
          env:
            - { name: CAPA, value: "capa-modelo" }
            - { name: BUCKET, value: "project-8853a180-450d-47be-b83-t-demo-copia" }
            - { name: HOME, value: /tmp }
            - { name: PIP_CACHE_DIR, value: /tmp/pip }
          volumeMounts:
            - { name: capa, mountPath: /capa }
            - { name: trabajo, mountPath: /trabajo }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              [ -n "$CAPA" ] || { echo "· sin capa: el árbol no declara dependencias"; exit 0; }
              mkdir -p /trabajo/ruedas
              python3 - <<'PY'
              import os, time
              from google.cloud import storage
              t = time.time(); cli = storage.Client(); b = cli.bucket(os.environ["BUCKET"]); pre = "ore/puesto/" + os.environ["CAPA"] + "/"
              n = 0
              for o in cli.list_blobs(b, prefix=pre):
                  o.download_to_filename("/trabajo/ruedas/" + o.name[len(pre):]); n += 1
              print("### capa %s: %d objeto(s) en %d ms" % (os.environ["CAPA"], n, (time.time() - t) * 1000), flush=True)
              if n == 0:
                  raise SystemExit("✗ la caja de la capa no está en el bucket: ¿la resolvió 52-la-capa?")
              PY
              T0=$(cut -d. -f1 /proc/uptime)
              python3 -m pip install --disable-pip-version-check -q --no-index --no-deps --target /capa /trabajo/ruedas/*.whl
              echo "### instalada en /capa en $(( $(cut -d. -f1 /proc/uptime) - T0 )) s · $(du -sm /capa | cut -f1) MB"
          resources:
            requests: {cpu: "500m", memory: 1Gi}
            limits:   {cpu: "2", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile: { type: RuntimeDefault }
            capabilities: { drop: [ALL] }
      containers:
        - name: puesto
          # El hueco del entorno: `ore-serve` pone `puesto-python:1`,
          # `puesto-node:1` o `puesto-jvm:1` según el lenguaje del puesto.
          image: europe-west1-docker.pkg.dev/project-8853a180-450d-47be-b83/ore/puesto-entorno-modelo:1
          # ⛔ `Always`, y no es descuido: `:1` es el ENTORNO (lo que una celda
          #   importa no cambia), pero el agente y el SDK viajan dentro y cambian
          #   con cada commit. Con `IfNotPresent` el nodo se quedaba con el `:1`
          #   viejo (medido en victor el 2026-09-19: una celda SQL llegó a un
          #   agente que aún no sabía de SQL). `Always` sólo compara el digest
          #   con el registro: ~1 s cuando ya está.
          imagePullPolicy: Always
          env:
            - { name: PUESTO, value: "puesto-modelo" }
            - { name: RAMA, value: "rama-modelo" }
            - { name: CAPA, value: "capa-modelo" }
            # El instante de apertura: reabrir tras un TTL, un tope o un relevo
            # es OTRO Job (otro nombre), y Flux retira el viejo. Lo pone ore-serve.
            - { name: ABIERTO, value: "abierto-modelo" }
            # ⭐ El trabajo (0031 §9, W3.7 ④): con `TRABAJO` (`<ruta>@<commit>`)
            #   este mismo Job corre UN fichero del árbol como una sola celda y
            #   termina; el agente sale con el resultado, y `ore-serve` deja
            #   el informe en `trabajos/`. Vacío es una sesión.
            - { name: TRABAJO, value: "trabajo-modelo" }
            - { name: PYTHONPATH, value: /capa }
            - { name: TTL, value: "1800" }
            - { name: ORE_SERVE, value: "http://ore-serve.t-demo.svc.cluster.local:8080" }
            - { name: ORE_ALMACEN, value: "gcs" }
            - { name: BUCKET, value: "project-8853a180-450d-47be-b83-t-demo-copia" }
            - { name: DIRECCION, value: "http://idp-service.identidad.svc.cluster.local:8080" }
            - { name: REALM, value: "rubix" }
            - { name: PUESTO_DIR, value: /puesto }
            - { name: HOME, value: /tmp }
            - { name: PYTHONUNBUFFERED, value: "1" }
          volumeMounts:
            - { name: puesto, mountPath: /puesto, readOnly: true }
            - { name: trabajo, mountPath: /trabajo }
            - { name: capa, mountPath: /capa, readOnly: true }
          workingDir: /trabajo
          resources:
            requests: {cpu: "1", memory: 2Gi}
            limits:   {cpu: "2", memory: 4Gi}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile: { type: RuntimeDefault }
            capabilities: { drop: [ALL] }
