# ═══════════════════════════════════════════════════════════════════════════
# LA CAPA DE NODE — los paquetes de npm que un repositorio de TypeScript
# declara, resueltos (ADR 0050 R3 T5b)
#
# ⭐ El gemelo de `55-la-capa-jvm.yaml` para Node: lo que el árbol declara en
#   `dependencies` de un `package.json`, resuelto por un Job con red, subido al
#   bucket del inquilino como `ore/puesto/<capa>/capa.tgz` y anotado en el árbol
#   como `entorno/<digest>.json`. El puesto, sin red, lo baja al arrancar, lo
#   comprueba contra la suma del informe y lo desempaqueta en `/capa`.
#
# ── ⛔ LO QUE NO CORRE: EL CÓDIGO DE LOS PAQUETES AL INSTALARSE ────────────
#   `npm install --ignore-scripts`: ningún `preinstall`/`postinstall` de un
#   paquete se ejecuta. Es la decisión de T5b: más seguro y reproducible, y un
#   paquete que compila código nativo al instalarse no funciona —el informe lo
#   dice—. Lo que la sesión ya trae (`ore`, `@duckdb/node-api`) no se copia:
#   manda el contenedor, como en la JVM, y si se pide otra versión el informe
#   lo dice.
#
# ── Quién hace qué, y por qué en tres contenedores ────────────────────────
#   traer-el-testigo · `ore-drivers`: el token de la forja del secreto.
#   traer-el-arbol   · `ore-drivers`: clona el árbol en `/trabajo/arbol`.
#   resolver         · `capa-node`: npm contra el registro. NO tiene el testigo
#                      ni credencial de nube: lo que resuelve no puede publicar.
#   subir-e-informar · `ore-drivers`: sube la caja y empuja el informe. NO
#                      sale al registro de npm.
#
# ── Quién lo rinde ────────────────────────────────────────────────────────
#   `ore-serve` escribe `57-la-capa-node-<12 hex>.yaml` en la cola (rendido de
#   `plantilla-capa-node.txt`, ⚠️ esta plantilla) al `POST /entorno/node`, o al
#   abrir un puesto de Node con la capa pendiente.
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: batch/v1
kind: Job
metadata:
  name: la-capa-node-00000000
  namespace: t-demo
  labels:
    kueue.x-k8s.io/queue-name: cola
    ore.dev/tenant: demo
    ore.dev/rol: driver
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 1200
  template:
    metadata:
      labels:
        ore.dev/rol: driver
        ore.dev/tenant: demo
    spec:
      restartPolicy: Never
      serviceAccountName: driver
      volumes:
        - name: puesto
          emptyDir: { medium: Memory }
        - name: trabajo
          emptyDir: {}
      initContainers:
        - name: traer-el-testigo
          image: europe-west1-docker.pkg.dev/project-8853a180-450d-47be-b83/ore/ore-drivers:main
          env:
            - { name: HOME, value: /tmp }
            - { name: CLOUDSDK_CONFIG, value: /tmp/.gcloud }
          volumeMounts: [{ name: puesto, mountPath: /puesto }]
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              gcloud secrets versions access latest \
                --secret=t-demo-forja-token --out-file=/puesto/forja
              chmod 0400 /puesto/forja
              echo "testigo puesto · $(wc -c < /puesto/forja) bytes"
          resources:
            requests: {cpu: "50m", memory: 128Mi}
            limits:   {cpu: "500m", memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
        - name: traer-el-arbol
          image: europe-west1-docker.pkg.dev/project-8853a180-450d-47be-b83/ore/ore-drivers:main
          imagePullPolicy: Always
          env:
            - { name: HOME, value: /tmp }
            - { name: GIT_TERMINAL_PROMPT, value: "0" }
            - { name: GIT_CONFIG_COUNT, value: "2" }
            - { name: GIT_CONFIG_KEY_0, value: "http.extraheader" }
            - { name: GIT_CONFIG_KEY_1, value: "safe.directory" }
            - { name: GIT_CONFIG_VALUE_1, value: "*" }
            - { name: RAMA, value: "rama-modelo" }
          volumeMounts:
            - { name: puesto, mountPath: /puesto, readOnly: true }
            - { name: trabajo, mountPath: /trabajo }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              export GIT_CONFIG_VALUE_0="Authorization: token $(cat /puesto/forja)"
              cd /trabajo
              git clone --quiet ${RAMA:+--branch "$RAMA"} \
                http://forja.t-demo.svc.cluster.local:3000/t-demo/ontologia.git arbol
              echo "árbol clonado · $(git -C arbol rev-parse --short HEAD)"
          resources:
            requests: {cpu: "100m", memory: 256Mi}
            limits:   {cpu: "1000m", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
        # ⭐ El que sale al registro de npm, y sólo él: sin el testigo montado y sin
        #   cuenta de servicio que valga para la nube.
        - name: resolver
          image: europe-west1-docker.pkg.dev/project-8853a180-450d-47be-b83/ore/capa-node:1
          imagePullPolicy: Always
          env:
            - { name: HOME, value: /tmp }
            - { name: TRABAJO, value: /trabajo }
            - { name: CAPA, value: "capa-modelo" }
            # ⭐ 0036 ③: la carpeta del repositorio, o vacío para la celda entera.
            #   La capa es SUYA —la raíz, su paquete y él—, no la unión del árbol.
            - { name: ALCANCE, value: "alcance-modelo" }
            - { name: INTENTO, value: "intento-modelo" }
            # ⭐ El tope, con su mensaje. Un paquete de npm puede ser
            #   enorme (cientos de MB con lo que arrastra): más vale un «no cabe» en el
            #   informe que un puesto que tarda dos minutos en arrancar.
            - { name: TOPE_MB, value: "512" }
          volumeMounts:
            - { name: trabajo, mountPath: /trabajo }
          command: ["/bin/sh", "-c"]
          args:
            - |
              exec /opt/ore/resolver.sh /trabajo/arbol "$ALCANCE"
          resources:
            requests: {cpu: "500m", memory: 1Gi}
            limits:   {cpu: "2000m", memory: 3Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
      containers:
        - name: subir-e-informar
          image: europe-west1-docker.pkg.dev/project-8853a180-450d-47be-b83/ore/ore-drivers:main
          imagePullPolicy: Always
          env:
            - { name: HOME, value: /tmp }
            - { name: CLOUDSDK_CONFIG, value: /tmp/.gcloud }
            - { name: GIT_TERMINAL_PROMPT, value: "0" }
            - { name: GIT_CONFIG_COUNT, value: "2" }
            - { name: GIT_CONFIG_KEY_0, value: "http.extraheader" }
            - { name: GIT_CONFIG_KEY_1, value: "safe.directory" }
            - { name: GIT_CONFIG_VALUE_1, value: "*" }
            - { name: RAMA, value: "rama-modelo" }
            - { name: BUCKET, value: "project-8853a180-450d-47be-b83-t-demo-copia" }
          volumeMounts:
            - { name: puesto, mountPath: /puesto, readOnly: true }
            - { name: trabajo, mountPath: /trabajo }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              export GIT_CONFIG_VALUE_0="Authorization: token $(cat /puesto/forja)"
              [ -f /trabajo/informe.json ] || { echo "· el árbol no declara dependencias de Node: nada que subir"; exit 0; }
              DIGEST=$(cat /trabajo/digest.txt)
              # ── 1 · la caja al bucket, con el nombre de la capa ──
              if [ -f /trabajo/capa.tgz ]; then
                gcloud storage cp -q /trabajo/capa.tgz "gs://$BUCKET/ore/puesto/$DIGEST/capa.tgz"
                echo "### capa.tgz ($(du -k /trabajo/capa.tgz | cut -f1) KB) en gs://$BUCKET/ore/puesto/$DIGEST/"
              else
                echo "### nada que subir: lo declarado lo pone ya el contenedor, o no se resolvió"
              fi
              # ── 2 · el informe al árbol, uno POR DIGEST (0036 ③) ──
              cd /trabajo/arbol
              mkdir -p entorno
              # El informe se sube CON LA CAJA y no después: si el commit
              # fallara, la caja ya está y el siguiente intento la reusa.
              gcloud storage cp -q /trabajo/informe.json "gs://$BUCKET/ore/puesto/$DIGEST/informe.json"
              cp /trabajo/informe.json "entorno/$DIGEST.json"
              git add -A entorno
              if git diff --cached --quiet; then echo "· el informe no cambió"; exit 0; fi
              ESTADO=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["estado"])' "entorno/$DIGEST.json")
              git -c user.name=la-capa-node -c user.email=la-capa-node@invalido \
                commit -q -m "La capa $DIGEST (Node): $ESTADO"
              git push -q origin HEAD:${RAMA:-main}
              echo "✓ informe empujado · $(git rev-parse --short HEAD)"
          resources:
            requests: {cpu: "200m", memory: 512Mi}
            limits:   {cpu: "1000m", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
