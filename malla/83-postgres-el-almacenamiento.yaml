# ═══════════════════════════════════════════════════════════════════════════
# ORE SERVERLESS POSTGRES · LA CAPA DE ALMACENAMIENTO (ADR 0058, P2·4)
#
#   (avisos)             el receptor de juguete de P2 se fue en P4·5: los avisos del
#                        controller (notify-attach) los atiende `ore-postgres` en
#                        /avisos y reconfigura los cómputos del tenant (86).
#   storage-controller   dueño de tenants, generaciones y nodos. Modo ESTRICTO (con
#                        autenticación) y --handle-ps-local-disk-loss: sin ella un
#                        pageserver con el disco vacío deja el tenant colgado para
#                        siempre (medido en P2·1).
#   storage-broker       el bus entre safekeepers y pageservers. Sin autenticación:
#                        sólo se le habla desde dentro de `ore-pg`.
#   safekeeper ×3        el WAL, por quórum; descargan a gs://ore-pg-almacen-euw1/safekeeper/
#   pageserver ×1        las páginas; capas en gs://ore-pg-almacen-euw1/pageserver/. Se
#                        registra SOLO en el controller (metadata.json) y le pide sus
#                        tenants al arrancar (re-attach).
#
# Imágenes: `neon:<commit>` de ci/neon/almacen.yaml (Postgres 17.10). Mismo commit en
# todas: cambiarlo es un commit aquí.
#
# Autenticación: el par Ed25519 y los tokens (`almacen-jwt`) los crea 80-postgres-gcp.sh;
# la privada vive aparte (`almacen-jwt-privada`) y aquí no la monta nadie.
#
# Fuera de P2, a propósito (es la puerta de producción): safekeepers en 3 zonas (el
# clúster es zonal: hoy los 3 en el mismo nodo), discos SSD, varios pageservers,
# sharding, y que el controller gestione los safekeepers (se mide en P2·6).
# ═══════════════════════════════════════════════════════════════════════════
# ── El controller ─────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata: { name: storage-controller, namespace: ore-pg }
spec:
  selector: { ore.dev/rol: storage-controller }
  ports: [{ name: http, port: 1234 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: storage-controller, namespace: ore-pg }
spec:
  # Uno. Neon soporta varios con elección de líder por la base; aquí, Recreate: nunca
  # dos a la vez repartiendo generaciones.
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { ore.dev/rol: storage-controller } }
  template:
    metadata: { labels: { ore.dev/rol: storage-controller, ore.dev/tenant: system } }
    spec:
      nodeSelector: { ore.dev/pool: neon }
      tolerations: [{ key: ore.dev/neon, operator: Equal, value: "true", effect: NoSchedule }]
      containers:
        - name: controller
          image: europe-west1-docker.pkg.dev/project-8853a180-450d-47be-b83/ore/neon:8269bece3fd934fd0a9746794b5e7b6c3aaf1d6b
          command: [storage_controller]
          args:
            - -l
            - 0.0.0.0:1234
            - --control-plane-url
            - http://ore-postgres.ore-pg.svc.cluster.local:8100/avisos
            - --handle-ps-local-disk-loss
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: storcon-db, key: url } }
            - name: PUBLIC_KEY
              valueFrom: { secretKeyRef: { name: almacen-jwt, key: publica.pem } }
            - name: PAGESERVER_JWT_TOKEN
              valueFrom: { secretKeyRef: { name: almacen-jwt, key: pageserverapi } }
            - name: SAFEKEEPER_JWT_TOKEN
              valueFrom: { secretKeyRef: { name: almacen-jwt, key: safekeeperdata } }
            - name: CONTROL_PLANE_JWT_TOKEN
              valueFrom: { secretKeyRef: { name: almacen-jwt, key: infra } }
          ports: [{ containerPort: 1234 }]
          # tcp y no /status: en modo estricto la API pide token, y una sonda sin él reiniciaría en bucle
          readinessProbe: { tcpSocket: { port: 1234 }, periodSeconds: 5 }
          livenessProbe: { tcpSocket: { port: 1234 }, periodSeconds: 10, failureThreshold: 6 }
          resources: { requests: { cpu: 20m, memory: 64Mi }, limits: { memory: 512Mi } }
---
# ── El broker ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata: { name: storage-broker, namespace: ore-pg }
spec:
  selector: { ore.dev/rol: storage-broker }
  ports: [{ name: grpc, port: 50051 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: storage-broker, namespace: ore-pg }
spec:
  replicas: 1
  selector: { matchLabels: { ore.dev/rol: storage-broker } }
  template:
    metadata: { labels: { ore.dev/rol: storage-broker, ore.dev/tenant: system } }
    spec:
      nodeSelector: { ore.dev/pool: neon }
      tolerations: [{ key: ore.dev/neon, operator: Equal, value: "true", effect: NoSchedule }]
      containers:
        - name: broker
          image: europe-west1-docker.pkg.dev/project-8853a180-450d-47be-b83/ore/neon:8269bece3fd934fd0a9746794b5e7b6c3aaf1d6b
          command: [storage_broker, --listen-addr=0.0.0.0:50051]
          resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 256Mi } }
---
# ── Los safekeepers ───────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata: { name: safekeeper, namespace: ore-pg }
spec:
  clusterIP: None
  selector: { ore.dev/rol: safekeeper }
  ports: [{ name: pg, port: 5454 }, { name: http, port: 7676 }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: safekeeper, namespace: ore-pg }
spec:
  maxUnavailable: 1                # el quórum es 2 de 3: nunca dos fuera a la vez por voluntad
  selector: { matchLabels: { ore.dev/rol: safekeeper } }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: safekeeper, namespace: ore-pg }
spec:
  serviceName: safekeeper
  replicas: 3
  podManagementPolicy: Parallel
  selector: { matchLabels: { ore.dev/rol: safekeeper } }
  template:
    metadata: { labels: { ore.dev/rol: safekeeper, ore.dev/tenant: system } }
    spec:
      serviceAccountName: neon
      nodeSelector: { ore.dev/pool: neon }
      tolerations: [{ key: ore.dev/neon, operator: Equal, value: "true", effect: NoSchedule }]
      affinity:
        podAntiAffinity:
          # preferida, no exigida: hoy hay UN nodo. Con 3 (P3) se reparten; en 3 zonas, la puerta.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm: { topologyKey: kubernetes.io/hostname, labelSelector: { matchLabels: { ore.dev/rol: safekeeper } } }
      securityContext: { fsGroup: 1000 }
      containers:
        - name: safekeeper
          image: europe-west1-docker.pkg.dev/project-8853a180-450d-47be-b83/ore/neon:8269bece3fd934fd0a9746794b5e7b6c3aaf1d6b
          command: ["/bin/sh", "-c"]
          args:
            - |
              ID=$(( ${HOSTNAME##*-} + 1 ))
              exec safekeeper --id=$ID -D /data \
                --listen-pg=0.0.0.0:5454 --advertise-pg=${HOSTNAME}.ore-pg.svc.cluster.local:5454 \
                --listen-http=0.0.0.0:7676 \
                --broker-endpoint=http://storage-broker.ore-pg.svc.cluster.local:50051 \
                --pg-auth-public-key-path=/jwt/publica.pem \
                --http-auth-public-key-path=/jwt/publica.pem \
                --auth-token-path=/jwt/safekeeperdata \
                --remote-storage="{bucket_name='ore-pg-almacen-euw1', prefix_in_bucket='safekeeper/'}"
          ports: [{ containerPort: 5454 }, { containerPort: 7676 }]
          readinessProbe: { tcpSocket: { port: 5454 }, periodSeconds: 5 }
          resources: { requests: { cpu: 30m, memory: 96Mi }, limits: { memory: 1Gi } }
          volumeMounts:
            - { name: datos, mountPath: /data }
            - { name: jwt, mountPath: /jwt, readOnly: true }
      volumes:
        - name: jwt
          secret: { secretName: almacen-jwt, items: [{ key: publica.pem, path: publica.pem }, { key: safekeeperdata, path: safekeeperdata }] }
  volumeClaimTemplates:
    - metadata: { name: datos }
      spec:
        # el WAL aún no descargado a GCS: que sobreviva a un borrado por error
        storageClassName: retiene-estandar
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 10Gi } }
---
# ── El pageserver ─────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata: { name: pageserver, namespace: ore-pg }
spec:
  clusterIP: None
  selector: { ore.dev/rol: pageserver }
  ports: [{ name: pg, port: 6400 }, { name: http, port: 9898 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: pageserver, namespace: ore-pg }
spec:
  serviceName: pageserver
  replicas: 1
  selector: { matchLabels: { ore.dev/rol: pageserver } }
  template:
    metadata: { labels: { ore.dev/rol: pageserver, ore.dev/tenant: system } }
    spec:
      serviceAccountName: neon
      nodeSelector: { ore.dev/pool: neon }
      tolerations: [{ key: ore.dev/neon, operator: Equal, value: "true", effect: NoSchedule }]
      securityContext: { fsGroup: 1000 }
      containers:
        - name: pageserver
          image: europe-west1-docker.pkg.dev/project-8853a180-450d-47be-b83/ore/neon:8269bece3fd934fd0a9746794b5e7b6c3aaf1d6b
          command: ["/bin/sh", "-c"]
          # La configuración se escribe al arrancar: lleva el token de upcall (de un Secret)
          # y el metadata.json con el nombre estable del pod. La zona va fija porque el
          # clúster es zonal y la API downward no da las etiquetas del nodo.
          args:
            - |
              set -e
              N=$(( ${HOSTNAME##*-} + 1 ))
              H=${HOSTNAME}.ore-pg.svc.cluster.local   # su Service ClusterIP: IP estable (P2·6)
              mkdir -p /data/.neon
              cat > /data/.neon/identity.toml <<EOF
              id = $N
              EOF
              cat > /data/.neon/metadata.json <<EOF
              {"host":"$H","port":6400,"http_host":"$H","http_port":9898,"availability_zone_id":"$ZONA"}
              EOF
              cat > /data/.neon/pageserver.toml <<EOF
              broker_endpoint = 'http://storage-broker.ore-pg.svc.cluster.local:50051'
              pg_distrib_dir = '/usr/local/'
              listen_pg_addr = '0.0.0.0:6400'
              listen_http_addr = '0.0.0.0:9898'
              availability_zone = '$ZONA'
              remote_storage = { bucket_name = 'ore-pg-almacen-euw1', prefix_in_bucket = 'pageserver/' }
              control_plane_api = 'http://storage-controller.ore-pg.svc.cluster.local:1234/upcall/v1/'
              control_plane_api_token = '$(cat /jwt/generations_api)'
              http_auth_type = 'NeonJWT'
              pg_auth_type = 'NeonJWT'
              auth_validation_public_key_path = '/jwt/publica.pem'
              # P2·5 · la historia que se guarda por defecto: 1 día (Neon trae 7). Es lo que el
              # cliente puede recuperar en el tiempo (rama en un instante) y lo que se paga en
              # GCS; por proyecto se cambia en el controller (PUT /v1/tenant/config, P9).
              [tenant_config]
              pitr_interval = '1 day'
              EOF
              export NEON_AUTH_TOKEN=$(cat /jwt/safekeeperdata)
              exec pageserver -D /data/.neon
          env: [{ name: ZONA, value: europe-west1-b }]
          ports: [{ containerPort: 6400 }, { containerPort: 9898 }]
          readinessProbe: { tcpSocket: { port: 9898 }, periodSeconds: 5 }
          resources: { requests: { cpu: 50m, memory: 256Mi }, limits: { memory: 2Gi } }
          volumeMounts:
            - { name: datos, mountPath: /data/.neon }
            - { name: jwt, mountPath: /jwt, readOnly: true }
      volumes:
        - name: jwt
          secret:
            secretName: almacen-jwt
            items:
              - { key: publica.pem, path: publica.pem }
              - { key: generations_api, path: generations_api }
              - { key: safekeeperdata, path: safekeeperdata }
  volumeClaimTemplates:
    - metadata: { name: datos }
      spec:
        # caché: perderlo no pierde nada (C4) ⇒ clase que borra
        storageClassName: standard
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 20Gi } }
---
# ── IPs estables (P2·6) ───────────────────────────────────────────────────
# El DNS de pod de un servicio headless (pageserver-0.pageserver…) cambia de IP al recrear el
# pod y tarda en enterarse; quien conecta a la IP vieja se queda en SYN ~127 s (medido en P2·6:
# un C4 que el pageserver resolvió en 24 s parecía de 155 s). Un Service ClusterIP POR POD no
# cambia nunca de IP: es lo que se registra en el controller, lo que anuncian los safekeepers
# y lo que usa el cómputo. (El selector por pod-name vale en un Service, no en una NetworkPolicy:
# Cilium no la usa para identidades.)
apiVersion: v1
kind: Service
metadata: { name: pageserver-0, namespace: ore-pg }
spec:
  selector: { statefulset.kubernetes.io/pod-name: pageserver-0 }
  ports: [{ name: pg, port: 6400 }, { name: http, port: 9898 }]
---
apiVersion: v1
kind: Service
metadata: { name: safekeeper-0, namespace: ore-pg }
spec:
  selector: { statefulset.kubernetes.io/pod-name: safekeeper-0 }
  ports: [{ name: pg, port: 5454 }, { name: http, port: 7676 }]
---
apiVersion: v1
kind: Service
metadata: { name: safekeeper-1, namespace: ore-pg }
spec:
  selector: { statefulset.kubernetes.io/pod-name: safekeeper-1 }
  ports: [{ name: pg, port: 5454 }, { name: http, port: 7676 }]
---
apiVersion: v1
kind: Service
metadata: { name: safekeeper-2, namespace: ore-pg }
spec:
  selector: { statefulset.kubernetes.io/pod-name: safekeeper-2 }
  ports: [{ name: pg, port: 5454 }, { name: http, port: 7676 }]
---
# ── El scrubber (P2·5) ─────────────────────────────────────────────────────
# Lo que el pageserver deja atrás en GCS: índices de generaciones viejas y capas que ya
# no referencia nadie. Dos pasos, a diario:
#   scan-metadata --post        recorre los índices y le cuenta al controller la salud de
#                               cada tenant (/control/v1/metadata_health)
#   pageserver-physical-gc full borra lo que ningún índice vivo referencia, con más de 24 h
# `find-garbage` (tenants que el plano de control ya no conoce) necesita la API de
# administración de Neon: no la tenemos; lo cubre que borrar un tenant por el controller
# vacía su prefijo (medido en P2·5).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: scrubber
  namespace: ore-pg
  labels: { ore.dev/tenant: system, ore.dev/rol: mantenimiento }
spec:
  schedule: "30 12 * * *"            # tras la copia de las 12:00, con el clúster despierto
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata: { labels: { ore.dev/rol: mantenimiento, ore.dev/tenant: system } }
        spec:
          restartPolicy: Never
          serviceAccountName: neon
          nodeSelector: { ore.dev/pool: neon }
          tolerations: [{ key: ore.dev/neon, operator: Equal, value: "true", effect: NoSchedule }]
          containers:
            - name: scrubber
              image: europe-west1-docker.pkg.dev/project-8853a180-450d-47be-b83/ore/neon:8269bece3fd934fd0a9746794b5e7b6c3aaf1d6b
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  cd /tmp
                  S="storage_scrubber --exit-code --controller-api http://storage-controller.ore-pg.svc.cluster.local:1234 --controller-jwt $(cat /jwt/scrubber)"
                  echo "── scan-metadata"
                  # un bucket sin timelines (aún no hay clientes) no es un fallo: el scrubber lo da por error
                  if ! $S scan-metadata --node-kind pageserver --post > /tmp/scan.log 2>&1; then
                    cat /tmp/scan.log
                    grep -q "No timelines found" /tmp/scan.log && { echo "bucket sin timelines: nada que hacer"; exit 0; }
                    exit 1
                  fi
                  cat /tmp/scan.log
                  echo "── pageserver-physical-gc (${MODO})"; $S pageserver-physical-gc --min-age 24h --mode ${MODO}
              env:
                - { name: MODO, value: full }
                - { name: PAGESERVER_DISABLE_FILE_LOGGING, value: "1" }
                - name: REMOTE_STORAGE_CONFIG
                  value: |
                    bucket_name = 'ore-pg-almacen-euw1'
                    prefix_in_bucket = 'pageserver/'
              volumeMounts: [{ name: jwt, mountPath: /jwt, readOnly: true }]
              resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 1Gi } }
          volumes:
            - name: jwt
              secret: { secretName: almacen-jwt, items: [{ key: scrubber, path: scrubber }] }

