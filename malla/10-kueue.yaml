# ── El sabor: QUE nodos sirven para un Job ──────────────────────────────────
#
# Se describe por ETIQUETA, no por nombre de pool ni por tipo de maquina. Es la
# practica de Rubix —la politica se escribe contra la etiqueta— y aqui compra
# algo concreto: el dia que el pool `jobs` pase de on-demand a Spot, esto NO
# cambia. Cambia el pool; el sabor sigue diciendo lo mismo.
#
# Y la tolerancia es lo que hace posible el «escala a cero»: el pool lleva un
# taint para que ningun pod de sistema aterrice y lo mantenga encendido, asi
# que solo entra quien lo tolera — y quien lo tolera lo inyecta Kueue aqui.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: jobs
spec:
  nodeLabels:
    ore.dev/pool: jobs
  tolerations:
    - key: ore.dev/jobs
      operator: Equal
      value: "true"
      effect: NoSchedule
---
# ── La cola del tenant, dentro de un COHORTE ────────────────────────────────
#
# El cohorte es la pieza que hoy no se ve y manana lo es todo: las colas de un
# mismo cohorte se PRESTAN la cuota que no usan. Con un tenant no hace nada;
# con dos, el segundo se declara y el reparto justo ya existe — no hay que
# rediseñar la cola, hay que escribir un manifiesto.
#
# La cuota nominal sale de lo que el pool puede dar de VERDAD: 3 nodos
# e2-standard-4 son 12 vCPU y 48 Gi en bruto, y GKE reserva por nodo. Se
# declara 10 y 36Gi, que es conservador a proposito: una cuota que promete mas
# de lo que hay convierte una espera en un pod que no arranca nunca.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: cq-demo
spec:
  namespaceSelector: {}
  cohortName: ore
  resourceGroups:
    - coveredResources: ["cpu", "memory"]
      flavors:
        - name: jobs
          resources:
            - name: cpu
              nominalQuota: 10
              borrowingLimit: 0
            - name: memory
              nominalQuota: 36Gi
              borrowingLimit: 0
  preemption:
    reclaimWithinCohort: Any
    withinClusterQueue: LowerPriority
---
apiVersion: v1
kind: Namespace
metadata:
  name: t-demo
  labels:
    ore.dev/tenant: demo
    ore.dev/rol: cargas
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: cola
  namespace: t-demo
spec:
  clusterQueue: cq-demo
---
# La misma base que `ore-system`: se niega por defecto, se abre despues.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-ingress
  namespace: t-demo
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-egress
  namespace: t-demo
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
# El techo DURO del namespace, por encima de la cola. Kueue decide CUANDO
# arranca un Job; esto decide cuanto puede pedir en total. Son dos preguntas y
# hacen falta las dos: sin la cuota, un Job mal escrito pide 40 CPU y Kueue lo
# deja esperando para siempre en vez de rechazarlo.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: cuota
  namespace: t-demo
spec:
  hard:
    requests.cpu: "10"
    requests.memory: 36Gi
    count/jobs.batch: "50"
