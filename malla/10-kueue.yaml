# ── El sabor: QUE nodos sirven para un Job ──────────────────────────────────
#
# Se describe por ETIQUETA, no por nombre de pool ni por tipo de maquina. Es la
# practica de Rubix —la politica se escribe contra la etiqueta— y aqui compra
# algo concreto: el dia que el pool `jobs` pase de on-demand a Spot, esto NO
# cambia. Cambia el pool; el sabor sigue diciendo lo mismo.
#
# Y la tolerancia es lo que hace posible el «escala a cero»: el pool lleva un
# taint para que ningun pod de sistema aterrice y lo mantenga encendido, asi
# que solo entra quien lo tolera — y quien lo tolera lo inyecta Kueue aqui.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: jobs
spec:
  nodeLabels:
    ore.dev/pool: jobs
  tolerations:
    - key: ore.dev/jobs
      operator: Equal
      value: "true"
      effect: NoSchedule
---
# ⛔ LO DEMÁS SE FUE A `11-el-inquilino.yaml` el 2026-09-09.
#
# Aquí vivían el `Namespace` de `t-demo`, su `ClusterQueue`, su `LocalQueue`, sus
# dos `deny-all` y su `ResourceQuota`. Es decir: **el inquilino entero estaba
# dentro del manifiesto de la cola**.
#
# Con uno daba igual. Con `ore-serve` por organización, dar de alta al segundo no
# puede significar reaplicar la configuración de Kueue — son dos cosas con dos
# ritmos, y una de ellas la va a escribir una máquina.
#
# ⇒ Lo que se queda aquí es lo que es del CLÚSTER: el sabor, que describe qué
#   nodos sirven para un Job. Eso no se multiplica por inquilino.
