# `ore-iam servir` — la cara HTTP del plano de identidad.
#
# ── Lo que esta cara puede y la de línea de órdenes no ──────────────────────
#
# Todo menos `fundar`. Y al revés: `fundar` no está aquí porque no habría con
# qué autenticarlo — la primera organización se crea cuando aún no existe
# ninguna persona con potestad.
#
#   invitar    emite un vale · exige `administrador` · no por encima de uno mismo
#   admitir    redime un vale · el correo del token tiene que ser el del vale
#   conceder   un rol DE RECURSO · `lector` si; `owner` todavia no
#   revocar    y NO borra
#
# ── ⭐ La guarda que no es obvia ────────────────────────────────────────────
#
# **Nadie puede otorgar un rol más alto que el suyo.** Sin ella, `invitar` es
# una escalada de privilegio con forma de cortesía: un administrador invita a un
# cómplice como dueño y tiene por un rodeo lo que no se le da de frente. El
# motivo es suyo —`021-la-invitacion.sql`— y la cicatriz también.
#
# ⛔ Y desde la `011` esa guarda es SÓLO del plano de arriba. Abajo no hay
# altura que comparar —`owner` no implica `lector`— y lo que gobierna es ser
# owner del ámbito: una travesía del árbol que todavía no existe, así que
# `conceder` niega `owner` y dice por qué.
apiVersion: v1
kind: Service
metadata:
  name: ore-iam
  namespace: identidad
spec:
  selector:
    ore.dev/rol: iam-servidor
  ports:
    - name: http
      port: 8090
      targetPort: 8090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ore-iam
  namespace: identidad
spec:
  replicas: 1
  selector:
    matchLabels:
      ore.dev/rol: iam-servidor
  template:
    metadata:
      labels:
        ore.dev/rol: iam-servidor
        ore.dev/tenant: system
    spec:
      serviceAccountName: ore-iam
      nodeSelector:
        ore.dev/pool: system
      volumes:
        # Las llaves del realm, del mismo ConfigMap que refresca el CronJob.
        # ⚠️ Vive en `t-demo` y esto en `identidad`: un ConfigMap no cruza
        #   namespaces, así que hay una copia. Se dice porque una copia que
        #   nadie refresca es una llave vieja esperando a caducar — el refresco
        #   tiene que escribir en los dos, y hoy escribe en uno.
        - name: llaves
          configMap:
            name: jwks
      containers:
        - name: ore-iam
          image: europe-west1-docker.pkg.dev/project-8853a180-450d-47be-b83/ore/ore-iam:main
          imagePullPolicy: Always
          args:
            - servir
            - --bind
            - 0.0.0.0:8090
            - --identidad
            - oidc
            # El emisor de DESARROLLO: es contra el que entra la consola local,
            # y es donde vive `luna`.
            - --emisor
            - https://login.paladio.io/realms/rubix
            - --audiencia
            - ore-serve
            - --jwks
            - /llaves/jwks.json
          env:
            - name: IAM_URL
              valueFrom: { secretKeyRef: { name: iam-url, key: url } }
            # ⭐ La celda de plataforma (0025 E6): la misma que el Job de `fundar`
            #   (66) lleva, porque `POST /organizaciones` y `POST …/celdas` son
            #   fundar por HTTP. Los cinco o ninguno; sin ellos el servidor no
            #   da celdas y lo dice al arrancar.
            - { name: ORE_CELDA,           value: ore-mesh }
            - { name: ORE_CELDA_TIER,      value: compartido }
            - { name: ORE_CELDA_PROVEEDOR, value: gcp }
            - { name: ORE_CELDA_REGION,    value: europe-west1-b }
            - { name: ORE_CELDA_PUERTA,    value: ore-mesh.ore.paladio.io }
          volumeMounts:
            - name: llaves
              mountPath: /llaves
              readOnly: true
          ports:
            - containerPort: 8090
          readinessProbe:
            httpGet: { path: /salud, port: 8090 }
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests: {cpu: "50m", memory: 64Mi}
            limits:   {cpu: "300m", memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
# ── ⭐⭐ LA PUERTA DE `ore-iam`: `iam.ore.paladio.io` (2026-09-14) ─────────────
#
# Decia aqui «publicarlo es otra decision — administra personas». La decision
# llego el dia que alguien entro en la consola de produccion: `RUBIX_ADMIN_URL`
# apuntaba a `admin.paladio.io`, una IP de OTRO proyecto que contesta 503
# («unconditional drop overload»), asi que la consola nunca habia hablado con
# este `ore-iam` — solo la local, por un tunel. Sin puerta no hay organizaciones
# ni celdas en pantalla, y con la 0025 E6 tampoco habria forma de pedir nada.
#
# Lo que la puerta expone es lo mismo que ya expone cada `ore-serve`: verbos
# que exigen un token del realm y contestan 401 sin el. Lo que administra
# personas lo hace con potestades (014), no con la red. El nombre va bajo
# `*.ore.paladio.io` porque es la zona que ES nuestra (Cloud DNS + comodin +
# certificado): `admin.paladio.io` vive en el registrador y no lo escribe nadie
# de aqui.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: iam
  namespace: identidad
  labels:
    ore.dev/tenant: system
    ore.dev/rol: iam-servidor
spec:
  parentRefs:
    - name: puerta
      namespace: ore-system
      sectionName: https
  hostnames:
    - iam.ore.paladio.io
  rules:
    - backendRefs:
        - name: ore-iam
          port: 8090
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: salud-de-iam
  namespace: identidad
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck:
        requestPath: /salud
        portSpecification: USE_SERVING_PORT
  targetRef:
    group: ""
    kind: Service
    name: ore-iam
---
# El balanceador entra desde los rangos de Google, como en `43-la-entrada.yaml`.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: entrada-del-balanceador-a-iam
  namespace: identidad
spec:
  podSelector:
    matchLabels:
      ore.dev/rol: iam-servidor
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: { cidr: 130.211.0.0/22 }
        - ipBlock: { cidr: 35.191.0.0/16 }
      ports:
        - protocol: TCP
          port: 8090
---
# Quién más puede hablar con él por dentro: `identidad`, el inquilino modelo, y
# el aprovisionador (0025 E5: dos verbos, y `ore-iam` sabe cuáles por el claim
# del token, no por la red).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: entrada-a-ore-iam
  namespace: identidad
spec:
  podSelector:
    matchLabels:
      ore.dev/rol: iam-servidor
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              ore.dev/rol: identidad
        - namespaceSelector:
            matchLabels:
              ore.dev/tenant: demo
        # El pod del aprovisionador (16), y solo el: registra el agente de cada
        # celda y la da por aprovisionada.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ore-system
          podSelector:
            matchLabels:
              ore.dev/rol: aprovisionador
      ports:
        - protocol: TCP
          port: 8090
