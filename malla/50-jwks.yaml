# El juego de llaves del realm, traído por quien SÍ va a buscarlo.
#
# ── Por qué el servidor no se las baja él ───────────────────────────────────
#
# Es la cuarta vez que este árbol reparte lo mismo:
#
#   leer un origen        `ore-read-<tipo>`, no `ore`
#   subir un artefacto    `ore-store-<tipo>`, no `ore`
#   atender a un cliente  `ore-serve`, no `ore`
#   **traer el JWKS**     **esto, no `ore-serve`**
#
# Compra que el plano de control no tenga que salir a ningún sitio —su
# `NetworkPolicy` abre la forja y el DNS y nada más—, que su arranque no dependa
# de que el IdP esté vivo, y que rotar una llave sea un despliegue visible en
# vez de un temporizador que un día falla en silencio.
#
# ⚠️ El precio: **si esto no corre, una rotación del realm deja fuera a todo el
# mundo.** Por eso existe y por eso su fallo tiene que verse — `backoffLimit: 0`
# y sin reintentos, para que quede un Job fallido y no un bucle callado.
#
# ── ⭐ DOS DIRECCIONES, Y ÉSA ES LA IDEA ────────────────────────────────────
#
#   EMISOR      lo que el IdP tiene que AFIRMAR ser: `https://login.paladio.io`
#   DIRECCION   por dónde se le alcanza HOY: el Service del clúster
#
# No son lo mismo y no tienen por qué serlo. El emisor es una identidad
# publicada —va en el `iss` de cada token, y su propio CR dice que «se renombra
# una vez, y es la última»— y la dirección es una carretera. Mientras el DNS de
# fuera siga apuntando al clúster viejo, aquí se llega por la de dentro.
#
# ⛔ Y por eso el primer paso NO es traerse las llaves: es **pedir el
# descubrimiento por la dirección interna y comprobar que declara el emisor que
# esperamos**. Llegar por otra carretera está bien; hablar con otro emisor, no.
# Sin esa comprobación, apuntar `DIRECCION` a cualquier Keycloak metería sus
# llaves en el fichero y `ore-serve` aceptaría sus tokens sin una queja.
#
# ── ⛔⛔ REFRESCAR EL FICHERO NO REFRESCA AL PROCESO ──────────────────
#
# `ore-serve` lee `/llaves/jwks.json` **una vez, al arrancar**. Este Job escribe
# el ConfigMap y el kubelet lo propaga al disco del pod — y el proceso sigue con
# el juego que cargó. O sea que tras una rotación hace falta un `rollout restart`
# que hoy no dispara nadie.
#
# ⚠️ Y el síntoma manda al sitio equivocado, medido el 2026-09-09:
#
#     no hay llave `YUj1sLA0…` en el juego cargado. Si el realm rotó, el
#     fichero de llaves está viejo — se refresca fuera de este proceso
#
#   El mensaje es correcto y el fichero **ya tenía esa llave**: `cat` dentro del
#   pod la enseñaba. Lo viejo era la copia en memoria. Un mensaje que nombra el
#   fichero cuando el fichero está bien cuesta la media hora que ahorra el resto.
#
# ⇒ Lo que falta: o el proceso relee cuando el `kid` no está —y entonces el
#   plano de control vuelve a salir a la red, que es justo lo que este fichero
#   existe para evitar—, o el Job reinicia el Deployment al escribir. La segunda
#   respeta la frontera; ninguna de las dos está escrita todavía.

apiVersion: v1
kind: ConfigMap
metadata:
  name: jwks
  namespace: t-demo
  labels:
    ore.dev/tenant: demo
  annotations:
    # ── ⭐⭐ EL ÚNICO OBJETO QUE FLUX NO PUEDE RECONCILIAR ────────────────
    #
    # `IfNotPresent`: Flux lo CREA si no está y **no lo toca nunca más**. Sin
    # esto, el agente devolvería `{"keys":[]}` cada pocos minutos —es lo que dice
    # este manifiesto— y `ore-serve` dejaría de validar tokens en su siguiente
    # arranque, sin que nada fallara mientras tanto.
    #
    # ⇒ Lo encontró la E2 de la `0022` comparando lo declarado con lo vivo, antes
    #   de que hubiera ningún agente que lo rompiera. La documentación de Flux
    #   nombra este caso con estas palabras: *«Flux crea los recursos con campos
    #   que otros controladores mutan después»*.
    #
    # ⚠️ Y es la primera aparición de una clase entera: **objetos que un
    #   manifiesto SIEMBRA y un proceso posee en tiempo de ejecución.** La semilla
    #   sigue teniendo sentido —`ore-serve` se niega a arrancar con un juego
    #   vacío y lo dice—; lo que no lo tiene es reimponerla.
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
data:
  # La semilla: un juego vacío. `ore-serve` se NIEGA a arrancar con esto —
  # `Llaves::leer` exige al menos una llave RSA de firma utilizable— y eso es
  # correcto: un plano de control que arrancara con un juego vacío aceptaría
  # cero tokens y lo diría como si fuera culpa de quien llama.
  jwks.json: |
    {"keys":[]}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: refresco-jwks
  namespace: t-demo
---
# Lo MÍNIMO: escribir un ConfigMap, y sólo ése.
#
# `resourceNames` no es adorno. Sin él este `Role` deja escribir cualquier
# ConfigMap del namespace, incluido el de las respuestas de `review` — y un
# trabajo que trae una llave de fuera no tiene por qué poder tocar decisiones
# de gobierno.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: escribe-jwks
  namespace: t-demo
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [jwks]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: escribe-jwks
  namespace: t-demo
subjects:
  - kind: ServiceAccount
    name: refresco-jwks
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: escribe-jwks
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: refresco-jwks
  namespace: t-demo
spec:
  # Cada seis horas. Keycloak no rota a menudo y publica las dos llaves durante
  # un tiempo, así que la ventana sobra.
  schedule: "17 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            # Un rol PROPIO, y no `driver`. Un driver lee el origen de un
            # cliente; esto trae una llave pública de un IdP. Compartir la
            # etiqueta habría compartido la política, y entonces «quién puede
            # salir» dejaría de contestarse mirando el rol.
            ore.dev/rol: mantenimiento
            ore.dev/tenant: demo
        spec:
          restartPolicy: Never
          serviceAccountName: refresco-jwks
          containers:
            - name: refresco
              image: europe-west1-docker.pkg.dev/project-8853a180-450d-47be-b83/ore/ore-drivers:main
              env:
                - { name: HOME, value: /tmp }
                # Lo que tiene que AFIRMAR ser.
                #
                # ⭐ Y lleva el realm dentro. El `hostname` del CR es
                # `https://login.paladio.io`, pero el `iss` que Keycloak emite
                # —y el que va en cada token— es `<hostname>/realms/<realm>`.
                # La comprobacion de abajo lo cazó al primer intento, que es
                # exactamente para lo que está.
                # ✏️ 2026-09-09 · el realm de DESARROLLO, el mismo que `ore-serve`.
                #   Las llaves que se copian aquí son las que valida él: si los dos
                #   no nombran el MISMO realm, un token bueno se rechaza por venir
                #   firmado por otro emisor — y el síntoma es un 401 sin motivo.
                - { name: EMISOR, value: "https://login.paladio.io/realms/rubix-dev" }
                # Y por dónde se le alcanza hoy.
                - { name: DIRECCION, value: "http://idp-service.identidad.svc.cluster.local:8080" }
                - { name: REALM, value: "rubix-dev" }
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  API=https://kubernetes.default.svc
                  SA=/var/run/secrets/kubernetes.io/serviceaccount

                  # 1 · ¿con quien estamos hablando? ESTO PRIMERO.
                  curl -sSf "$DIRECCION/realms/$REALM/.well-known/openid-configuration" \
                    -o /tmp/desc.json
                  DICE=$(tr ',' '\n' < /tmp/desc.json | grep '"issuer"' | cut -d'"' -f4)
                  echo "se alcanza por  $DIRECCION"
                  echo "y dice ser      $DICE"
                  if [ "$DICE" != "$EMISOR" ]; then
                    echo "NO es el emisor que esperabamos ($EMISOR). No se toca nada."
                    exit 1
                  fi

                  # 2 · y ahora si, las llaves. Por la direccion interna: el
                  #     `jwks_uri` que el descubrimiento publica es el de FUERA,
                  #     y desde aqui no se alcanza.
                  curl -sSf "$DIRECCION/realms/$REALM/protocol/openid-connect/certs" \
                    -o /tmp/jwks.json
                  grep -q '"kty"' /tmp/jwks.json || { echo "lo que llego no es un JWKS"; exit 1; }
                  echo "llaves          $(tr ',' '\n' < /tmp/jwks.json | grep -c '\"kid\"')"

                  # 3 · al ConfigMap, con el token del pod, sobre `data` y nada
                  #     mas: no se toca ninguna otra clave del objeto.
                  python3 -c 'import json;print(json.dumps({"data":{"jwks.json":open("/tmp/jwks.json").read()}}))' \
                    > /tmp/parche.json
                  curl -sSf -X PATCH \
                    -H "Authorization: Bearer $(cat $SA/token)" \
                    -H "Content-Type: application/strategic-merge-patch+json" \
                    --cacert "$SA/ca.crt" \
                    --data-binary @/tmp/parche.json \
                    "$API/api/v1/namespaces/t-demo/configmaps/jwks" > /dev/null
                  echo "ok · el juego de llaves esta al dia"
              resources:
                requests: {cpu: "50m", memory: 128Mi}
                limits:   {cpu: "300m", memory: 256Mi}
---
# ── Por dónde sale el mantenimiento ─────────────────────────────────────────
#
# Tres destinos, y ni uno más. **Ninguno es internet**: desde que el IdP vive
# aquí dentro, este trabajo no tiene nada que buscar fuera.
#
# ⭐ El de la API costó tres sondas y merece quedar escrito: **no basta con
# permitir la ClusterIP del servicio `kubernetes`**. Con Dataplane V2 la
# petición sale del pod hacia el NODO, que es quien la lleva al maestro — así
# que permitir `10.30.0.1/32` sola da tiempo de espera, y lo que la desbloquea
# es la subred de nodos, `10.10.0.0/20`.
#
# Se midió con `egress: - {}` para separar «no llega por política» de «no llega
# por ruta»: con todo abierto contestaba `200`, así que era la política.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: salida-del-mantenimiento
  namespace: t-demo
spec:
  podSelector:
    matchLabels:
      ore.dev/rol: mantenimiento
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - ipBlock: { cidr: 10.30.0.1/32 }
        - ipBlock: { cidr: 10.10.0.0/20 }
      ports: [{protocol: TCP, port: 443}]
    - to:
        - namespaceSelector:
            matchLabels:
              ore.dev/rol: identidad
      ports: [{protocol: TCP, port: 8080}]
