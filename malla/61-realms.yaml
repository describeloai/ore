# LOS REALMS — GENERADOS. No se editan aqui.
#
#   node identidad/ore.mjs
#
# Salen de `identidad/realm.mjs` (la definicion: flujos, passkeys, factores,
# correo, clientes) y de `identidad/ore.mjs` (lo que ORE anade). Desde el
# 2026-09-30 los dos viven en ORE (ADR 0048): antes el primero estaba en la
# plataforma, escribiendo para un cluster donde ya no vive el IdP.
#
# ── Los dos, y ninguno sobra ────────────────────────────────────────────────
#
#   rubix          produccion, y el UNICO con gente (el 2026-09-14 `rubix-dev`
#                  se renombro a `rubix`, 034). Registro abierto; la consola en
#                  local (`localhost:3000`) entra tambien por aqui
#   rubix-interno  sin clientes propios
#
# ✏️ `rubix-dev` ya no sale (0048): no existe en vivo, `ore-iam` rechaza su
#   emisor, y el reconciliador lo CREARIA al no encontrarlo.
#
# ── Lo que ORE anade, en LOS TRES ───────────────────────────────────────────
#
#   ore-serve    una AUDIENCIA. Todos los flujos apagados: no inicia sesion de
#                nadie. Existe para poder decir que un token es PARA nosotros
#   ore-agente   una cuenta de servicio que pide tokens para esa audiencia
#   y en `rubix-consola`, el mapeador que mete `ore-serve` en el `aud`
#
# Todo lo demas viaja tal cual: la politica de clave, los cinco flujos propios,
# las passkeys y las organizaciones.
#
# ── ⭐ AAL2 en las dos puertas ───────────────────────────────────────────────
#
# `EXIGIR_SEGUNDO_FACTOR = true` (saldada el 2026-09-30): la entrada y la
# reposicion piden passkey o TOTP. `pruebas-de-fuego/el-segundo-factor.sh` lo
# vigila sobre este fichero.
#
# ── ⚠️ Lo que un `KeycloakRealmImport` NO hace ──────────────────────────────
#
# Mantener: se salta un realm que ya existe y dice `Done: True` igualmente. Por
# eso este fichero NO esta en `malla/kustomization.yaml`, y el realm vivo lo
# concilia `identidad/aplicar.mjs` desde ESTOS mismos realms.

{
  "apiVersion": "k8s.keycloak.org/v2alpha1",
  "kind": "KeycloakRealmImport",
  "metadata": {
    "name": "rubix-interno",
    "namespace": "identidad",
    "labels": {
      "ore.dev/tenant": "system",
      "ore.dev/rol": "identidad"
    }
  },
  "spec": {
    "keycloakCRName": "idp",
    "realm": {
      "realm": "rubix-interno",
      "id": "rubix-interno",
      "enabled": true,
      "displayName": "Rubix · interno",
      "organizationsEnabled": false,
      "registrationAllowed": false,
      "bruteForceProtected": true,
      "permanentLockout": false,
      "maxFailureWaitSeconds": 900,
      "failureFactor": 5,
      "passwordPolicy": "length(12) and notUsername(undefined) and passwordHistory(3) and forceExpiredPasswordChange(365)",
      "otpPolicyType": "totp",
      "otpPolicyAlgorithm": "HmacSHA256",
      "smtpServer": {
        "host": "smtp-relay.gmail.com",
        "port": "587",
        "starttls": "true",
        "ssl": "false",
        "auth": "false",
        "from": "no-reply@paladio.io",
        "fromDisplayName": "Rubix · interno",
        "replyTo": "victor@paladio.io",
        "replyToDisplayName": "Rubix · interno"
      },
      "emailTheme": "rubix",
      "internationalizationEnabled": true,
      "defaultLocale": "es",
      "supportedLocales": [
        "es",
        "en"
      ],
      "authenticationFlows": [
        {
          "alias": "browser-rubix",
          "description": "AAL2 · NIST SP 800-63B-4 — dos factores, sin condicional",
          "providerId": "basic-flow",
          "topLevel": true,
          "builtIn": false,
          "authenticationExecutions": [
            {
              "authenticator": "auth-cookie",
              "requirement": "ALTERNATIVE",
              "priority": 10,
              "autheticatorFlow": false,
              "userSetupAllowed": false
            },
            {
              "authenticator": "identity-provider-redirector",
              "requirement": "ALTERNATIVE",
              "priority": 20,
              "autheticatorFlow": false,
              "userSetupAllowed": false
            },
            {
              "flowAlias": "browser-rubix-formularios",
              "requirement": "ALTERNATIVE",
              "priority": 30,
              "autheticatorFlow": true,
              "userSetupAllowed": false
            }
          ]
        },
        {
          "alias": "browser-rubix-formularios",
          "description": "contraseña y SEGUNDO FACTOR",
          "providerId": "basic-flow",
          "topLevel": false,
          "builtIn": false,
          "authenticationExecutions": [
            {
              "authenticator": "auth-username-password-form",
              "requirement": "REQUIRED",
              "priority": 10,
              "autheticatorFlow": false,
              "userSetupAllowed": false
            },
            {
              "flowAlias": "browser-rubix-segundo-factor",
              "requirement": "REQUIRED",
              "priority": 20,
              "autheticatorFlow": true,
              "userSetupAllowed": false
            }
          ]
        },
        {
          "alias": "browser-rubix-segundo-factor",
          "description": "passkey primero, TOTP de recuperación",
          "providerId": "basic-flow",
          "topLevel": false,
          "builtIn": false,
          "authenticationExecutions": [
            {
              "authenticator": "webauthn-authenticator",
              "requirement": "ALTERNATIVE",
              "priority": 10,
              "autheticatorFlow": false,
              "userSetupAllowed": false
            },
            {
              "authenticator": "auth-otp-form",
              "requirement": "ALTERNATIVE",
              "priority": 20,
              "autheticatorFlow": false,
              "userSetupAllowed": false
            }
          ]
        },
        {
          "alias": "reposicion-rubix",
          "description": "Reposición de credenciales — sin rebajar el AAL de la entrada",
          "providerId": "basic-flow",
          "topLevel": true,
          "builtIn": false,
          "authenticationExecutions": [
            {
              "authenticator": "reset-credentials-choose-user",
              "requirement": "REQUIRED",
              "priority": 10,
              "autheticatorFlow": false,
              "userSetupAllowed": false
            },
            {
              "authenticator": "reset-credential-email",
              "requirement": "REQUIRED",
              "priority": 20,
              "autheticatorFlow": false,
              "userSetupAllowed": false
            },
            {
              "flowAlias": "reposicion-rubix-segundo-factor",
              "requirement": "REQUIRED",
              "priority": 30,
              "autheticatorFlow": true,
              "userSetupAllowed": false
            },
            {
              "authenticator": "reset-password",
              "requirement": "REQUIRED",
              "priority": 40,
              "autheticatorFlow": false,
              "userSetupAllowed": false
            }
          ]
        },
        {
          "alias": "reposicion-rubix-segundo-factor",
          "description": "segundo factor VALIDADO — nunca borrado",
          "providerId": "basic-flow",
          "topLevel": false,
          "builtIn": false,
          "authenticationExecutions": [
            {
              "authenticator": "webauthn-authenticator",
              "requirement": "ALTERNATIVE",
              "priority": 10,
              "autheticatorFlow": false,
              "userSetupAllowed": false
            },
            {
              "authenticator": "auth-otp-form",
              "requirement": "ALTERNATIVE",
              "priority": 20,
              "autheticatorFlow": false,
              "userSetupAllowed": false
            }
          ]
        }
      ],
      "browserFlow": "browser-rubix",
      "resetCredentialsFlow": "reposicion-rubix",
      "webAuthnPolicyRpEntityName": "Rubix · interno",
      "webAuthnPolicyRpId": "",
      "webAuthnPolicySignatureAlgorithms": [
        "ES256",
        "RS256"
      ],
      "webAuthnPolicyUserVerificationRequirement": "required",
      "webAuthnPolicyAttestationConveyancePreference": "not specified",
      "webAuthnPolicyAuthenticatorAttachment": "not specified",
      "webAuthnPolicyRequireResidentKey": "not specified",
      "webAuthnPolicyCreateTimeout": 0,
      "webAuthnPolicyAvoidSameAuthenticatorRegister": true,
      "webAuthnPolicyAcceptableAaguids": [],
      "attributes": {
        "rubix.aal": "AAL2",
        "rubix.aal.norma": "NIST SP 800-63B-4",
        "rubix.fal": "FAL1",
        "rubix.fal.norma": "NIST SP 800-63C-4",
        "rubix.fal.falta-para-fal2": "cifrar la aserción a la clave pública del RP",
        "actionTokenGeneratedByUserLifespan.reset-credentials": "1800"
      },
      "accessTokenLifespan": 300,
      "ssoSessionIdleTimeout": 900,
      "ssoSessionMaxLifespan": 28800,
      "revokeRefreshToken": true,
      "refreshTokenMaxReuse": 0,
      "defaultSignatureAlgorithm": "RS256",
      "clients": [
        {
          "clientId": "ore-serve",
          "name": "ORE · el plano de control",
          "description": "Audiencia. No inicia sesion: existe para poder decir que un token es PARA nosotros.",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "implicitFlowEnabled": false
        },
        {
          "clientId": "ore-agente",
          "name": "ORE · agente",
          "description": "Cuenta de servicio: pide tokens para `ore-serve`. Es un agente, no una persona.",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": true,
          "implicitFlowEnabled": false,
          "attributes": {
            "access.token.lifespan": "300"
          },
          "protocolMappers": [
            {
              "name": "audiencia-ore-serve",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "consentRequired": false,
              "config": {
                "included.client.audience": "ore-serve",
                "id.token.claim": "false",
                "access.token.claim": "true"
              }
            },
            {
              "name": "audiencia-modelos",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "consentRequired": false,
              "config": {
                "included.custom.audience": "modelos",
                "id.token.claim": "false",
                "access.token.claim": "true"
              }
            },
