# LOS REALMS — GENERADOS. No se editan aqui.
#
#   python malla/gen-realm.py
#
# Salen de `C:\\Rubix\\deploy\\identidad\\salida\\*.json`, que a su vez emite
# `deploy/identidad/realm.mjs`. Su cabecera dice por que es un generador y no un
# JSON de ejemplo: «un fichero copiado es un fichero que diverge; al tercer
# cliente, uno tendra PKCE y otro no, y eso no dara error nunca».
#
# ── Los tres, y ninguno sobra ───────────────────────────────────────────────
#
#   rubix          produccion. `redirectUris` -> https://app.paladio.io
#   rubix-dev      desarrollo. `redirectUris` -> http://localhost:3000
#   rubix-interno  sin clientes propios
#
# ⭐ El de desarrollo NO es un duplicado, y no importarlo costo un `HTTP 500`:
# la consola en local declara `RUBIX_IDP_EMISOR=.../realms/rubix-dev`, y con ese
# realm ausente el descubrimiento daba `404`, que `lib/auth/oidc.ts` convierte en
# una excepcion y Next en un 500 sin mas texto.
#
# ── Lo que ORE anade, y SOLO en `rubix` ─────────────────────────────────────
#
#   ore-serve    una AUDIENCIA. Todos los flujos apagados: no inicia sesion de
#                nadie. Existe para poder decir que un token es PARA nosotros
#   ore-agente   una cuenta de servicio que pide tokens para esa audiencia
#   y en `rubix-consola`, el mapeador que mete `ore-serve` en el `aud`
#
# Todo lo demas viaja tal cual: AAL2 contra NIST SP 800-63B-4, la politica de
# clave, los cinco flujos propios, las passkeys y las organizaciones.
#
# ── ⚠️ Lo que un `KeycloakRealmImport` NO hace ──────────────────────────────
#
# Mantener. Medido por ellos: **se salta un realm que ya existe y se declara
# `Done: True` igualmente**. Esto sirve para CREAR un realm, no para cambiarlo.
{
  "apiVersion": "k8s.keycloak.org/v2alpha1",
  "kind": "KeycloakRealmImport",
  "metadata": {
    "name": "rubix-dev",
    "namespace": "identidad",
    "labels": {
      "ore.dev/tenant": "system",
      "ore.dev/rol": "identidad"
    }
  },
  "spec": {
    "keycloakCRName": "idp",
    "realm": {
      "realm": "rubix-dev",
      "id": "rubix-dev",
      "enabled": true,
      "displayName": "Rubix (desarrollo)",
      "organizationsEnabled": true,
      "organizations": [
        {
          "alias": "o_01J9ZKCP4N7QR2S5T8V0W3X6Y9",
          "name": "o_01J9ZKCP4N7QR2S5T8V0W3X6Y9",
          "enabled": true,
          "domains": [
            {
              "name": "o-01j9zkcp4n7qr2s5t8v0w3x6y9.rubix.interno",
              "verified": false
            }
          ]
        }
      ],
      "registrationAllowed": false,
      "resetPasswordAllowed": true,
      "rememberMe": false,
      "verifyEmail": true,
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "bruteForceProtected": true,
      "permanentLockout": false,
      "maxFailureWaitSeconds": 900,
      "failureFactor": 5,
      "passwordPolicy": "length(12) and notUsername(undefined) and passwordHistory(3) and forceExpiredPasswordChange(365)",
      "otpPolicyType": "totp",
      "otpPolicyAlgorithm": "HmacSHA256",
      "smtpServer": {
        "host": "smtp-relay.gmail.com",
        "port": "587",
        "starttls": "true",
        "ssl": "false",
        "auth": "false",
        "from": "no-reply@paladio.io",
        "fromDisplayName": "Rubix (desarrollo)",
        "replyTo": "victor@paladio.io",
        "replyToDisplayName": "Rubix (desarrollo)"
      },
      "emailTheme": "rubix",
      "internationalizationEnabled": true,
      "defaultLocale": "es",
      "supportedLocales": [
        "es",
        "en"
      ],
      "authenticationFlows": [
        {
          "alias": "browser-rubix",
          "description": "AAL2 · NIST SP 800-63B-4 — dos factores, sin condicional",
          "providerId": "basic-flow",
          "topLevel": true,
          "builtIn": false,
          "authenticationExecutions": [
            {
              "authenticator": "auth-cookie",
              "requirement": "ALTERNATIVE",
              "priority": 10,
              "autheticatorFlow": false,
              "userSetupAllowed": false
            },
            {
              "authenticator": "identity-provider-redirector",
              "requirement": "ALTERNATIVE",
              "priority": 20,
              "autheticatorFlow": false,
              "userSetupAllowed": false
            },
            {
              "flowAlias": "browser-rubix-formularios",
              "requirement": "ALTERNATIVE",
              "priority": 30,
              "autheticatorFlow": true,
              "userSetupAllowed": false
            }
          ]
        },
        {
          "alias": "browser-rubix-formularios",
          "description": "contraseña y SEGUNDO FACTOR",
          "providerId": "basic-flow",
          "topLevel": false,
          "builtIn": false,
          "authenticationExecutions": [
            {
              "authenticator": "auth-username-password-form",
              "requirement": "REQUIRED",
              "priority": 10,
              "autheticatorFlow": false,
              "userSetupAllowed": false
            },
            {
              "flowAlias": "browser-rubix-segundo-factor",
              "requirement": "CONDITIONAL",
              "priority": 20,
              "autheticatorFlow": true,
              "userSetupAllowed": false
            }
          ]
        },
        {
          "alias": "browser-rubix-segundo-factor",
          "description": "passkey primero, TOTP de recuperación",
          "providerId": "basic-flow",
          "topLevel": false,
          "builtIn": false,
          "authenticationExecutions": [
            {
              "authenticator": "webauthn-authenticator",
              "requirement": "ALTERNATIVE",
              "priority": 10,
              "autheticatorFlow": false,
              "userSetupAllowed": false
            },
            {
              "authenticator": "auth-otp-form",
              "requirement": "ALTERNATIVE",
              "priority": 20,
              "autheticatorFlow": false,
              "userSetupAllowed": false
            }
          ]
        },
        {
          "alias": "reposicion-rubix",
          "description": "Reposición de credenciales — sin rebajar el AAL de la entrada",
          "providerId": "basic-flow",
          "topLevel": true,
          "builtIn": false,
          "authenticationExecutions": [
            {
              "authenticator": "reset-credentials-choose-user",
              "requirement": "REQUIRED",
              "priority": 10,
              "autheticatorFlow": false,
              "userSetupAllowed": false
            },
            {
              "authenticator": "reset-credential-email",
              "requirement": "REQUIRED",
              "priority": 20,
              "autheticatorFlow": false,
              "userSetupAllowed": false
            },
            {
              "flowAlias": "reposicion-rubix-segundo-factor",
              "requirement": "CONDITIONAL",
              "priority": 30,
              "autheticatorFlow": true,
              "userSetupAllowed": false
            },
            {
              "authenticator": "reset-password",
              "requirement": "REQUIRED",
              "priority": 40,
              "autheticatorFlow": false,
              "userSetupAllowed": false
            }
          ]
        },
        {
          "alias": "reposicion-rubix-segundo-factor",
          "description": "segundo factor VALIDADO — nunca borrado",
          "providerId": "basic-flow",
          "topLevel": false,
          "builtIn": false,
          "authenticationExecutions": [
            {
              "authenticator": "webauthn-authenticator",
              "requirement": "ALTERNATIVE",
              "priority": 10,
              "autheticatorFlow": false,
              "userSetupAllowed": false
            },
            {
              "authenticator": "auth-otp-form",
              "requirement": "ALTERNATIVE",
              "priority": 20,
              "autheticatorFlow": false,
              "userSetupAllowed": false
            }
          ]
        }
      ],
      "browserFlow": "browser-rubix",
      "resetCredentialsFlow": "reposicion-rubix",
      "webAuthnPolicyRpEntityName": "Rubix",
      "webAuthnPolicyRpId": "",
      "webAuthnPolicySignatureAlgorithms": [
        "ES256",
        "RS256"
      ],
      "webAuthnPolicyUserVerificationRequirement": "required",
      "webAuthnPolicyAttestationConveyancePreference": "not specified",
      "webAuthnPolicyAuthenticatorAttachment": "not specified",
      "webAuthnPolicyRequireResidentKey": "not specified",
      "webAuthnPolicyCreateTimeout": 0,
      "webAuthnPolicyAvoidSameAuthenticatorRegister": true,
      "webAuthnPolicyAcceptableAaguids": [],
      "attributes": {
        "rubix.aal": "AAL2",
        "rubix.aal.norma": "NIST SP 800-63B-4",
        "rubix.fal": "FAL1",
        "rubix.fal.norma": "NIST SP 800-63C-4",
        "rubix.fal.falta-para-fal2": "cifrar la aserción a la clave pública del RP",
        "actionTokenGeneratedByUserLifespan.reset-credentials": "1800"
      },
      "accessTokenLifespan": 300,
      "ssoSessionIdleTimeout": 1800,
      "ssoSessionMaxLifespan": 36000,
      "revokeRefreshToken": true,
      "refreshTokenMaxReuse": 0,
      "defaultSignatureAlgorithm": "RS256",
      "clients": [
        {
          "clientId": "rubix-api",
          "name": "Rubix API",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "implicitFlowEnabled": false
        },
        {
          "clientId": "rubix-consola",
          "name": "Rubix · consola",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": true,
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": false,
          "implicitFlowEnabled": false,
          "serviceAccountsEnabled": false,
          "redirectUris": [
            "http://localhost:3000/auth/callback"
          ],
          "webOrigins": [
            "http://localhost:3000"
          ],
          "attributes": {
            "pkce.code.challenge.method": "S256",
            "post.logout.redirect.uris": "http://localhost:3000/"
          },
          "defaultClientScopes": [
            "organization",
            "profile",
            "email",
            "roles",
            "web-origins"
          ],
          "protocolMappers": [
            {
              "name": "rubix-tipo-persona",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-hardcoded-claim-mapper",
              "consentRequired": false,
              "config": {
                "claim.name": "rubix_tipo",
                "claim.value": "persona",
                "jsonType.label": "String",
                "access.token.claim": "true",
                "id.token.claim": "false",
                "userinfo.token.claim": "false",
                "access.tokenResponse.claim": "false"
              }
            },
            {
              "name": "rubix-audiencia",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "consentRequired": false,
              "config": {
                "included.client.audience": "rubix-api",
                "access.token.claim": "true",
                "id.token.claim": "false"
              }
            },
            {
              "name": "organizacion",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-organization-membership-mapper",
              "config": {
                "claim.name": "organization",
                "jsonType.label": "JSON",
                "multivalued": "true",
                "addOrganizationId": "true",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "introspection.token.claim": "true"
              }
            }
          ]
        },
        {
          "clientId": "rubix-consola-lector",
          "name": "Rubix · consola (lectura)",
          "description": "Cuenta de servicio de SÓLO LECTURA con la que la consola consulta el IdP.",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "serviceAccountsEnabled": true,
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "implicitFlowEnabled": false,
          "attributes": {
            "access.token.lifespan": "300"
          }
        }
      ]
    }
  }
}
