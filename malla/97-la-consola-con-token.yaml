# La cadena entera con un token de VERDAD, y sin una sola afirmación.
#
# Hasta aquí el sujeto lo escribía quien llamaba: una cabecera `x-ore-sujeto`
# con lo que quisiera poner. Esto es lo mismo hecho como toca —pedir un token al
# realm y presentarlo— y lo que fija es que **el plano de control ya no se cree
# a nadie**:
#
#   1. sin token                      401
#   2. con un token del realm         pasa, y el sujeto sale del `sub`
#   3. una escritura                  el AUTOR del commit es ese `sub`
#
# El 3 es el que cierra el círculo que empezó hace tres commits: la historia de
# la forja deja de decir «lo hizo quien dijo ser» y pasa a decir «lo hizo quien
# el realm firmó que era».
#
# ⚠️ El `sub` de una cuenta de servicio es un UUID, no un IRI bonito. Se deja
# como está a propósito: `ore-serve` toma el `sub` VERBATIM y no lo interpreta —
# cómo se nombra un sujeto es del plano de identidad, no del plano de control, y
# meterle forma aquí sería la primera grieta de esa frontera.
apiVersion: batch/v1
kind: Job
metadata:
  name: consola-con-token
  namespace: t-demo
  labels:
    ore.dev/tenant: demo
spec:
  completions: 1
  backoffLimit: 0
  template:
    metadata:
      labels:
        # ⛔ `driver` y no `cliente`: la etiqueta es lo que decide QUE politica de
        #   egreso se aplica. Con `cliente` no habia ninguna que dejara llegar al
        #   servidor de metadatos, y `gcloud` no sabia ni el proyecto — el init
        #   moria con «Failed to find attribute [project]». Una NetworkPolicy no
        #   rechaza: tira el paquete, y el sintoma es lo que sea que venga despues.
        ore.dev/rol: driver
        ore.dev/tenant: demo
    spec:
      restartPolicy: Never
      serviceAccountName: driver
      volumes:
        - name: puesto
          emptyDir: { medium: Memory }
      # El agente, del almacen: es el cliente de Keycloak de ESTE inquilino, que
      # el aprovisionador crea en su paso ⑦. Mismo init que `44-el-catalogo`.
      initContainers:
        - name: traer-el-agente
          image: europe-west1-docker.pkg.dev/project-8853a180-450d-47be-b83/ore/ore-drivers:main
          env:
            - { name: HOME, value: /tmp }
            - { name: CLOUDSDK_CONFIG, value: /tmp/.gcloud }
          volumeMounts: [{ name: puesto, mountPath: /puesto }]
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              for p in cliente secreto; do
                gcloud secrets versions access latest \
                  --secret=t-demo-agente-$p --out-file=/puesto/agente-$p
                chmod 0400 /puesto/agente-$p
              done
              echo "agente puesto · $(cat /puesto/agente-cliente)"
          resources:
            requests: {cpu: "50m", memory: 128Mi}
            limits:   {cpu: "500m", memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
      containers:
        - name: consola
          image: europe-west1-docker.pkg.dev/project-8853a180-450d-47be-b83/ore/ore-drivers:main
          env:
            - { name: HOME, value: /tmp }
            - { name: BASE, value: "http://ore-serve.t-demo.svc.cluster.local:8080" }
            - { name: IDP, value: "http://idp-service.identidad.svc.cluster.local:8080" }
            # ✏️ 2026-09-09 · sigue a `ore-serve`, que pasó a `rubix`. Una
            #   prueba de extremo a extremo que pide el token a OTRO realm no
            #   prueba la cadena: prueba que dos realms distintos no se hablan.
            #   ⚠️ `ore-agente` no estaba en `rubix` — el operador importa un
            #   realm al CREARLO, y `61-realms.yaml` ya lo declaraba en los tres.
            #   Se creó con `kcadm`; desde el 2026-09-13 el agente es por inquilino
            #   y vive en el almacén (paso ⑦ del aprovisionador).
            - { name: REALM, value: "rubix" }
            # ⛔ Ya no hay `Secret` `idp-agente`: el agente vive en el almacen por
            #   inquilino (aprovisionador, paso ⑦). Este Job de medida lo lee
            #   como el de catalogo, con un init. Ver `44-el-catalogo.yaml`.
          volumeMounts: [{ name: puesto, mountPath: /puesto, readOnly: true }]
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "### 0 · pedir un token al realm"
              CLIENTE=$(cat /puesto/agente-cliente); SECRETO=$(cat /puesto/agente-secreto)
              curl -sSf -X POST "$IDP/realms/$REALM/protocol/openid-connect/token" \
                -d grant_type=client_credentials -d "client_id=$CLIENTE" \
                -d "client_secret=$SECRETO" -o /tmp/t.json
              TOKEN=$(python3 -c 'import json;print(json.load(open("/tmp/t.json"))["access_token"])')
              # Lo que el token dice de si mismo. Se imprime el `sub` y el `aud`
              # y NO el token: un registro con un token dentro es una credencial
              # publicada.
              python3 - "$TOKEN" <<'PY'
              import base64, json, sys
              c = sys.argv[1].split(".")[1]
              c += "=" * (-len(c) % 4)
              d = json.loads(base64.urlsafe_b64decode(c))
              print("  iss  ", d.get("iss"))
              print("  aud  ", d.get("aud"))
              print("  sub  ", d.get("sub"))
              print("  tipo ", d.get("rubix_tipo"))
              open("/tmp/sub", "w").write(d.get("sub", ""))
              PY

              echo
              echo "### 1 · sin token"
              curl -s -o /dev/null -w '  http %{http_code}\n' "$BASE/fuentes"

              echo
              echo "### 2 · con el token"
              curl -sSf -H "Authorization: Bearer $TOKEN" "$BASE/fuentes" \
                | head -c 200; echo

              echo
              echo "### 3 · una escritura, y quien la firma"
              curl -s -o /tmp/alta.json -w '  http %{http_code}\n' -X POST \
                -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
                -d '{"name":"rio","url":"bigquery://project-8853a180-450d-47be-b83/rio"}' \
                "$BASE/fuentes"
              python3 -c 'import json;d=json.load(open("/tmp/alta.json"));print("  commit ", d.get("commit") or d.get("error"))'
              echo "  sub del token: $(cat /tmp/sub)"
          resources:
            requests: {cpu: "100m", memory: 256Mi}
            limits:   {cpu: "500m", memory: 512Mi}
---
# ✓ `salida-al-emisor` SE FUE A `11-el-inquilino.yaml` el 2026-09-09.
#
# Vivia aqui, en un fichero de PRUEBAS, y `t-demo` la tenia solo porque alguien
# habia corrido este test. El segundo inquilino nacio sin ella y su refresco de
# JWKS no pudo hablar con el emisor — el sintoma fue un `curl` agotado a los
# 134 segundos, que manda a mirar el IdP y no una politica que no existe.
#
# ⇒ Una regla que un inquilino NECESITA no puede vivir en su prueba. Es el
#   mismo movimiento que `salida-a-la-forja` ya hizo saliendo de `30-forja.yaml`.
