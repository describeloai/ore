# La entrada pública del IdP.
#
# ── ⛔⛔ Esto es una decisión de seguridad, no de infraestructura ────────────
#
# El IdP es **la única superficie de toda la casa que ve una contraseña**. Su
# propia plataforma lo escribió al hacer esto mismo, y añadió por qué es
# inevitable: *«un emisor al que el navegador de quien entra no puede llegar no
# es un emisor. La alternativa no era más seguro: era que cada persona editara
# su fichero `hosts` como administrador para poder entrar»*.
#
# ── Lo que se publica, y lo que NO ──────────────────────────────────────────
#
# Sólo `login.paladio.io`, que es el emisor. **La consola de administración no
# sale**: se llega a ella por `kubectl port-forward`, que es un camino que exige
# credenciales del clúster y no deja una puerta en internet. El día que haga
# falta publicarla será otro fichero y otra decisión.
#
# ── Por dónde entra, desde ORE 0060 C2 (2026-10-11) ─────────────────────────
#
#   navegador → Cloudflare (TLS; `login.paladio.io` es un *custom hostname* de
#   `ontoforge.org`, y en GoDaddy un CNAME a `entrada.ontoforge.org`) → el túnel
#   (`19-el-tunel.yaml`) → Envoy, listener `login` (`19-la-puerta-del-tunel.yaml`)
#   → la `HTTPRoute` de abajo → este `Service`.
#
# Antes era un `Ingress` de GKE con su IP (`ore-idp`), su `ManagedCertificate`, su
# `FrontendConfig` (http → https) y su `BackendConfig` (la salud en
# `/realms/rubix`): un balanceador global que cobraba con la malla dormida. Se
# retiró en C2·5. Lo que hacían esas piezas lo hacen ahora: Cloudflare (el
# certificado y «Always Use HTTPS» en la zona) y Envoy (sólo manda a pods listos).

# ── Nuestro Service, no el del operador ─────────────────────────────────────
#
# `idp-service` lo genera y lo reconcilia el operador de Keycloak: anotarlo
# funciona hasta que el operador decide que no. Éste es nuestro, selecciona los
# mismos pods, y es el destino de la ruta del túnel.
apiVersion: v1
kind: Service
metadata:
  name: idp-publico
  namespace: identidad
  labels:
    ore.dev/tenant: system
    ore.dev/rol: identidad
spec:
  type: ClusterIP
  selector:
    app: keycloak
    app.kubernetes.io/instance: idp
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
# ── Y la puerta del túnel (ORE 0060 C2) ─────────────────────────────────────
#
# El emisor como una ruta más, colgada del listener `login` de
# `19-la-puerta-del-tunel.yaml`, que sólo admite a `identidad`. La salud que
# miraba el `BackendConfig` (`/realms/rubix`) no tiene equivalente aquí: Envoy
# manda sólo a los pods listos, y la readiness la pone el operador.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: login
  namespace: identidad
  labels:
    ore.dev/tenant: system
    ore.dev/rol: identidad
spec:
  parentRefs:
    - name: puerta-tunel
      namespace: ore-system
      sectionName: login
  hostnames:
    - login.paladio.io
  rules:
    # ⛔ Keycloak decide `Secure` y `SameSite=None` en sus cookies por el esquema que le
    #   llega en `X-Forwarded-Proto`, y a Envoy le llega HTTP desde `cloudflared`: lo
    #   reescribe a `http` y las cookies salían SIN `Secure` y con `SameSite=Lax` (medido en
    #   C2·3; por el balanceador de Google, `Secure; SameSite=None`). Afirmar `https` no
    #   miente: Cloudflare redirige todo `http://` a `https://` (Always Use HTTPS, en la zona)
    #   y del borde al pod el camino es el túnel.
    - filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - { name: X-Forwarded-Proto, value: https }
      backendRefs:
        - name: idp-publico
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: entrada-de-la-puerta-del-tunel
  namespace: identidad
spec:
  podSelector:
    matchLabels:
      app: keycloak
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: envoy-gateway-system }
          podSelector:
            matchLabels: { app.kubernetes.io/name: envoy }
      ports:
        - protocol: TCP
          port: 8080
