# ═══════════════════════════════════════════════════════════════════════════
# EL INQUILINO `demo`, RECONCILIADO DESDE SU REPOSITORIO
#
# E3 de la `0022`. Estas dos piezas son las que convierten «hay un repositorio
# que describe el compartimento» en «el clúster ES ese repositorio».
#
#   GitRepository   de dónde se trae, y con qué credencial
#   Kustomization   qué se aplica de lo traído, y qué pasa si algo sobra
#
# ── ⭐ Por qué esto vive en `malla/` y no en el repositorio del inquilino ──
#
# Porque es la parte que decide QUÉ SE OBEDECE. Si viviera dentro del
# repositorio que se obedece, quien pudiera escribir ahí podría cambiar a qué
# apunta el agente — y la revisión que protege el compartimento no protegería la
# regla que dice de dónde sale el compartimento.
#
# ⇒ La plantilla y el enganche son nuestros; el contenido reconciliado es del
#   inquilino. Es el mismo corte que la `0022` traza entre plantilla e instancia.
#
# ── ⭐⭐ EL COMPARTIMENTO VIVE EN LA FORJA, Y ESO CAMBIÓ TRES COSAS ────────
#
# Vivía en GitHub, con una clave de despliegue POR INQUILINO. Y esa clave era el
# último permiso de clúster del que el aprovisionador no podía librarse:
# `source-controller` la lee de etcd, así que crearla exige `create secret` en
# `flux-system` — y eso convertía cada alta en una sesión de operador.
#
# Con el compartimento aquí dentro:
#
#   la identidad   el cliente entra con la que ya tiene. Forgejo habla OIDC
#                  contra el mismo IdP, así que deja de haber dos censos
#   la revisión    protección de rama, incluida. En GitHub era
#                  `403 · Upgrade to GitHub Pro`, y de ahí colgaba el ③ entero
#                  de la `0022`
#   el alta        ni un token de GitHub, ni un `create secret`: dar de alta un
#                  inquilino es crear un repositorio y añadir un colaborador,
#                  las dos por API
#
# ── ⛔ Y lo que se PIERDE, que no es poco ─────────────────────────────────
#
# La `0022` cerraba su ③ con una salida: *«si un cliente exige la propiedad, se
# le transfiere el repositorio»*. Aquí eso deja de existir — transferirle un
# repositorio dentro de NUESTRO servidor no le da la propiedad de nada, porque
# sigue dependiendo de que le dejemos entrar.
#
# ⇒ Se acepta a sabiendas: el cliente que ponga un pliego encima de la mesa
#   pedirá su repositorio fuera, y ese día habrá que darle uno. Se resuelve
#   cuando pase, no antes — pero queda escrito para que no sorprenda.
#
# ── ⛔ El testigo: de SOLO LECTURA, y colaborador uno a uno ────────────────
#
# `flux` es un usuario de la forja con `read:repository` y NADA más, y se le
# hace colaborador —con permiso `read`— de cada compartimento, uno a uno. Lo que
# lo ata no es el ámbito del token: es **de quién es y de qué es colaborador**.
# Misma disciplina que `serve-<inquilino>`, que dio 404 sobre el árbol ajeno.
#
# ⚠️ El `Secret` sigue sin poder estar en este árbol, y ahora se crea UNA VEZ en
# vez de una por cliente. Es la diferencia entre un paso del alta y un paso del
# montaje.
#
# ── ⛔⛔ Y DESDE HOY, `t-demo` NO SE APLICA A MANO ─────────────────────────
#
# Los objetos del inquilino los posee `kustomize-controller`. Un
# `kubectl apply -f malla/11-el-inquilino.yaml` seguiría funcionando —el
# contenido es el mismo— pero se pelearía por la propiedad de los campos, y lo
# que valga acabaría dependiendo de quién escribió el último.
#
# ⇒ Para cambiar el compartimento de un inquilino: se cambia la PLANTILLA, se
#   renderiza, y se empuja a su repositorio. El resto de `malla/` —la forja, el
#   IdP, Kueue, este mismo fichero— se sigue aplicando a mano, porque nadie lo
#   reconcilia todavía.
#
# ⭐ Probado el 2026-09-09: se subió `ore-serve` a 3 réplicas a mano y la primera
#   reconciliación lo devolvió a 1. La deriva dejó de ser invisible **y dejó de
#   durar**.
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: inquilino-demo
  namespace: flux-system
  labels:
    ore.dev/tenant: demo
    ore.dev/rol: agente
spec:
  # Cinco minutos. No es una carrera: lo que esto persigue no es aplicar rápido
  # un commit —eso se puede forzar— sino que la deriva no viva mucho tiempo.
  interval: 5m
  # ⛔ Y no empeora el aislamiento, que es lo que había que justificar: los
  #   compartimentos son NUESTROS —lo decide la `0022` ②— y Flux ya era
  #   `cluster-admin` sobre todos ellos. Una credencial por repositorio protegía
  #   de algo que ya no estaba protegido.
  #
  # ⚠️ Lo que SÍ cambia: si ese testigo se filtra, se leen los manifiestos de
  #   todos los inquilinos en vez de los de uno. No hay ni un valor secreto
  #   dentro —para eso está el almacén— pero sí la forma de la infraestructura
  #   de cada cliente.
  url: http://forja.forja.svc.cluster.local:3000/t-demo/compartimento.git
  ref:
    branch: main
  secretRef:
    name: compartimento-llave
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: inquilino-demo
  namespace: flux-system
  labels:
    ore.dev/tenant: demo
    ore.dev/rol: agente
spec:
  interval: 10m
  path: ./
  sourceRef:
    kind: GitRepository
    name: inquilino-demo

  # ⭐⭐ `prune: true` ES LO QUE HACE QUE ESTO SEA GITOPS Y NO UN DESPLIEGUE.
  #
  # Quitar un objeto del repositorio lo BORRA del clúster. Sin esto, el
  # repositorio diría lo que hay que crear pero no lo que hay que tener, y un
  # recurso retirado de la plantilla seguiría vivo para siempre — que es la
  # deriva que esto viene a matar.
  #
  # ⛔ Y hay que mirar el filo: un commit que borre un fichero por error borra
  # esos objetos. Ésa es exactamente la razón de que la `0022` ponga el
  # repositorio bajo revisión y de que deshacer sea un `revert` — el peligro no
  # se quita, se pone donde se ve y se puede revisar.
  prune: true

  # Espera a que lo aplicado esté LISTO, no sólo aceptado. Sin esto, un
  # `Deployment` que no arranca deja la reconciliación en verde y el fallo
  # aparece cuando alguien mira los pods.
  wait: true
  timeout: 3m

  # ⚠️ Y NO se le da `serviceAccountName`, todavía. Eso haría que esta
  # reconciliación se ejecutara con una cuenta acotada al inquilino en vez de con
  # el `cluster-admin` del controlador — que es lo que convierte «un agente
  # omnipotente» en «un agente que sólo puede tocar lo suyo». No se hace hoy
  # porque este manifiesto CREA su propio `Namespace`, que es un recurso de
  # clúster y no cabe en una cuenta acotada al namespace. Va con la E7, y está
  # dicho aquí para que no se descubra tarde.
---
# ═══════════════════════════════════════════════════════════════════════════
# EL INQUILINO `prueba` — el primero que nació entero por el conducto
#
# `demo` es de antes: se fundó a mano, su árbol se sembró a mano desde un demo
# ajeno —por eso se llama `ventas` y arrastra once fuentes de prueba— y su
# compartimento se escribió a mano.
#
# ⇒ `prueba` no. Su fila la escribió `fundar`, y TODO lo demás —la llave, las
#   tres cuentas de Google, el repositorio, su usuario, su testigo, el secreto
#   del almacén, el compartimento y el árbol— salió del aprovisionador corriendo
#   como un Job sin ni un permiso de RBAC.
#
# ⛔ Y esto sigue siendo un COMMIT NUESTRO, que es lo único que un alta no puede
#   hacer sola. Es la parte que decide QUÉ SE OBEDECE: si viviera dentro de lo
#   que se obedece, quien escribiera ahí cambiaría a qué apunta el agente.
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: inquilino-prueba
  namespace: flux-system
  labels:
    ore.dev/tenant: prueba
    # ⭐ Esta etiqueta es la que lo mete en el receptor compartido. No hay que
    #   tocar `17-el-aviso.yaml`: nombra una CLASE, no objetos.
    ore.dev/rol: agente
spec:
  interval: 5m
  url: http://forja.forja.svc.cluster.local:3000/t-prueba/compartimento.git
  ref:
    branch: main
  secretRef:
    name: compartimento-llave
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: inquilino-prueba
  namespace: flux-system
  labels:
    ore.dev/tenant: prueba
    ore.dev/rol: agente
spec:
  interval: 10m
  path: ./
  prune: true
  wait: true
  timeout: 3m
  sourceRef:
    kind: GitRepository
    name: inquilino-prueba
---
# ═══════════════════════════════════════════════════════════════════════════
# LA COLA DE TRABAJO DE `demo` — lo que está POR HACER, y quién puede hacerlo
#
# ⭐⭐ POR QUÉ ESTO ES UN SEGUNDO REPOSITORIO Y NO UN DIRECTORIO
#
# El compartimento dice CÓMO ES el inquilino. Esto dice QUÉ HAY QUE HACER: un
# Job de catálogo por fuente pendiente. Y la diferencia no es de orden — es de
# QUIÉN ESCRIBE.
#
# Medido el 2026-09-10: un alta a las 19:24 no tenía su Job hasta las 20:17,
# porque quien lo rinde es la convergencia y sólo la llama el cron. Lo obvio
# —que `ore-serve` lo rindiera en el mismo acto— exigía darle escritura sobre el
# compartimento, que contiene 14 `NetworkPolicy`, 4 `ServiceAccount`, 2
# `Deployment`, un `Role` y un `RoleBinding`. Entre ellos, el suyo.
#
# ⇒ Eso no es un permiso de más: es **el gobernado escribiendo su gobierno**.
#   Con dos repositorios, `serve-<inquilino>` escribe la cola y nada más.
#
# ── ⛔⛔ Y PARTIR EL REPOSITORIO NO BASTA ─────────────────────────────────
#
# Un `Kustomization` sin `serviceAccountName` aplica con el **cluster-admin del
# controlador**. Así que una cola sin acotar dejaría a `ore-serve` escribiendo
# manifiestos que Flux aplica como cluster-admin: un `Deployment`, un
# `RoleBinding`, lo que fuera. La escalada volvería por la otra puerta.
#
# ⇒ Por eso la cuenta de abajo, y por eso `spec.serviceAccountName`. **Sin eso
#   esto no es un arreglo de seguridad: es el mismo agujero con dos sitios.**
#
# ⚠️ Y el límite lo pone LA CUENTA, no el repositorio. Quitarle el
#   `serviceAccountName` «para depurar» devuelve la escalada entera y en
#   silencio — no falla nada, simplemente vuelve a poder todo.
#
# ── ⭐⭐ Y ESTE ES EL PRIMER `Kustomization` DE ESTE ÁRBOL QUE PUEDE ACOTARSE
#
# El ④ de la `0022` —el `cluster-admin` de Flux— lleva abierto desde el
# principio, y su motivo escrito es concreto: *«este manifiesto CREA su propio
# `Namespace`, que es un recurso de clúster y no cabe en una cuenta acotada al
# namespace»*.
#
# Eso vale para el compartimento. **No vale para la cola**, que sólo crea `Job`
# dentro de un namespace que ya existe. Así que aquí el ④ no se aplaza: se
# cierra.
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: ServiceAccount
metadata:
  # ⛔ En `flux-system` y NO en el namespace del inquilino: Flux impersona
  #   `system:serviceaccount:<namespace del Kustomization>:<nombre>`, y el
  #   `Kustomization` vive aquí. Ponerla en `t-demo` no daría un error — daría
  #   una impersonación que no existe y una reconciliación que falla al aplicar.
  name: cola-demo
  namespace: flux-system
  labels:
    ore.dev/tenant: demo
    ore.dev/rol: cola
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: encolar
  namespace: t-demo
  labels:
    ore.dev/tenant: demo
    ore.dev/rol: cola
rules:
  # ⛔⛔ `batch/jobs` Y NADA MÁS. Ni `pods`, ni `secrets`, ni `deployments`.
  #   Lo que se concede es exactamente «encolar trabajo», y se lee de un vistazo.
  #
  # ⚠️ `delete` está porque `prune: true` lo necesita: sin él, un Job retirado de
  #   la cola quedaría vivo para siempre y la poda fallaría en silencio.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  # Y leer el namespace, que es lo que `kustomize-controller` hace antes de
  # aplicar nada dentro de él.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: encolar
  namespace: t-demo
  labels:
    ore.dev/tenant: demo
    ore.dev/rol: cola
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: encolar
subjects:
  - kind: ServiceAccount
    name: cola-demo
    namespace: flux-system
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: trabajo-demo
  namespace: flux-system
  labels:
    ore.dev/tenant: demo
    # ⭐ La MISMA etiqueta que el compartimento, y eso es lo que hace instantáneo
    #   el disparo sin tocar nada: el `Receiver` de `17-…` nombra una CLASE
    #   —`ore.dev/rol: agente`— y este repositorio entra en él por llevarla. El
    #   webhook de la forja es de ORGANIZACIÓN y ya cubre «los que todavía no
    #   existen», así que tampoco hay que tocarlo.
    ore.dev/rol: agente
spec:
  # ⚠️ Cinco minutos como el compartimento, y es el RESPALDO, no el camino: lo
  #   normal es que el webhook llegue en segundos. Esto es lo que queda si el
  #   aviso se pierde.
  interval: 5m
  url: http://forja.forja.svc.cluster.local:3000/t-demo/trabajo.git
  ref:
    branch: main
  secretRef:
    name: compartimento-llave
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: trabajo-demo
  namespace: flux-system
  labels:
    ore.dev/tenant: demo
    ore.dev/rol: agente
spec:
  interval: 10m
  path: ./
  sourceRef:
    kind: GitRepository
    name: trabajo-demo
  # ⛔⛔ LA PIEZA QUE HACE QUE ESTO NO SEA UNA ESCALADA. Ver la cabecera.
  serviceAccountName: cola-demo

  # ⚠️ `prune: true`, y hay que saber lo que arrastra: un fichero que desaparece
  #   de la cola BORRA su Job. Para uno terminado da igual; para uno corriendo,
  #   lo mata.
  #
  # ⇒ Se acepta a sabiendas, porque la alternativa es peor: sin poda, el Job de
  #   una fuente retirada del árbol seguiría ahí para siempre, y la cola dejaría
  #   de significar «lo que está por hacer» para significar «lo que alguna vez
  #   hubo que hacer».
  prune: true

  # ⛔ Y `wait: false`, al revés que el compartimento. Un Job de catálogo tarda
  #   lo que tarde el origen del cliente en contestar —minutos, si contesta— y
  #   esperar a que esté LISTO dejaría la reconciliación colgada en cada alta.
  #   Lo que importa aquí es que el Job EXISTA, no que haya terminado.
  wait: false
---
