# ═══════════════════════════════════════════════════════════════════════════
# LA COPIA — el ciclo del almacén, dentro de la celda (0027 P1 I3)
#
# ⭐⭐ Es la misma figura que `44-el-catalogo.yaml` y cambia el verbo: en vez de
#   `ore source catalog` + `ore discover`, `ore materialize` — los seis pasos del
#   ADR 0015 sobre los datasets MANTENIDOS (`kind: Dataset` con `from`, 0033: la
#   decisión de la base estándar o de `POST /paquetes/{n}/copia`). Lee el origen con la credencial del
#   cofre, sella el DATASET en el bucket del inquilino —una tabla Iceberg, con
#   su historia (W3.6a, 0031 §10)— con `ore-store-gcs` y el token de su cuenta
#   —sin clave estática—, y deja en el árbol el PUNTERO de cada dataset
#   (`datasets/<paquete>_<dataset>.json`: qué `metadata.json` es el vigente,
#   con qué cabecera, hasta qué testigo, cuántas filas).
#
# ⭐ El árbol es el catálogo. El puntero es el estado (0031 §10): `ore` lo lee
#   antes de leer una fila, y lo mueve al terminar. El `git push` de abajo es el
#   *swap* del puntero, y la forja, al rechazar lo que no avanza en línea recta,
#   es el *compare-and-set*: una pasada que perdiera la carrera dejaría un
#   snapshot que ningún puntero nombra, y `--recoger` lo retira en la siguiente.
#
# ── Se rinde UNA VEZ POR ÁRBOL CON COPIAS, con el resumen de su lista ──────
#
#   `VISTAS` lleva las vistas que declaran copia, y el nombre del Job el resumen
#   del contenido: una decisión nueva cambia la lista, cambia el nombre, y Flux
#   crea otro Job. Rehacer la copia sin que cambie nada (el refresco periódico)
#   es de la pasada siguiente: un CronJob sobre esta misma plantilla.
#
# ⚠️ `--recoger` va puesto: los snapshots superados se expiran y lo que ningún
#   snapshot nombra se retira en cada pasada. Es explícito en el CLI y aquí lo
#   decide el operador, que es este fichero: un almacén que crece con los
#   refrescos no es acotado (R5). `ORE_RECOGER_EDAD` conserva la historia
#   reciente (siete días): es lo que hace que la copia tenga pasado —un
#   snapshot anterior se lee por su id— sin que el bucket crezca sin límite.
#   La política de retención como tal es de W3.6b (el CronJob de mantenimiento).
#
# ── ⭐ LA COPIA DE UNA VISTA SQL (ADR 0040 paso 4c) ─────────────────────────
#
#   Una vista v1alpha14 es una consulta, y quien la ejecuta es DuckDB, que vive
#   en la imagen del PUESTO y no en `ore-drivers`. Por eso la pasada tiene tres
#   contenedores en fila, sobre el mismo clon del árbol (`/trabajo/arbol`):
#
#     preparar  (ore-drivers)  `ore materialize --preparar`: la consulta servida
#                              y los datasets que lee, en Arrow, en
#                              /trabajo/calculo. Sólo las que no están al día.
#     calcular  (puesto)       `python -m ore.calcular`: DuckDB la ejecuta sobre
#                              esos ficheros y deja salida.arrow. NO monta el
#                              testigo ni lee el bucket: lo que lee ya está en
#                              el disco, y DuckDB se cierra al exterior antes de
#                              ejecutarla.
#     copiar    (ore-drivers)  la pasada de siempre, con `--calculado`: sella
#                              también esas, y empuja el puntero.
#
#   Es la misma identidad, el mismo commit (el swap) y el mismo recolector que
#   cualquier copia: la copia de una vista SQL tiene UN escritor, esta pasada
#   —`write()` sobre un mantenido sigue negado—. Sin nada que calcular, los dos
#   primeros pasos no hacen nada y tardan lo que tarda un clon.
#
# ── ⛔ Lo que este Job NO decide ────────────────────────────────────────────
#
# Qué vistas tienen copia (el verbo, con la firma de quien decide), con qué clave
# (`changes.key` de la tabla raíz), ni qué gana si el origen y la copia se
# contradicen (F5). Copia lo declarado, o dice por qué no pudo.
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: batch/v1
kind: Job
metadata:
  # ── ⭐⭐ EL NOMBRE LLEVA EL CONTENIDO DENTRO ─────────────────────────────
  #
  # Los ocho digitos son el resumen del resto de este fichero ya renderizado, y
  # el `00000000` de aqui es el de la plantilla — el renderizador lo sustituye.
  #
  # ⛔ Esto sustituye a `kustomize.toolkit.fluxcd.io/ssa: IfNotPresent`, que
  #   estaba aqui porque un Job es inmutable: si el nombre no cambia y el
  #   contenido si, el apply falla con «field is immutable», y la anotacion lo
  #   evitaba diciendole a Flux que NO tocara el que ya existe.
  #
  # ⇒ Y evitaba el error tapando dos cosas de verdad:
  #
  #     · un Job que FALLO se quedaba fallado para siempre. `catalogo-bq` de
  #       `prueba` llevaba once horas en `Failed`, y converger no podia
  #       arreglarlo por mucho que la plantilla mejorara;
  #     · y una plantilla nueva NO llegaba al Job existente — justo lo que
  #       converger viene a resolver.
  #
  # ⭐ Con el nombre derivado del contenido, dos objetos que se llaman igual
  #   tienen el mismo contenido SIEMPRE, asi que el conflicto de inmutabilidad
  #   no puede darse. Cambiar la plantilla da un nombre nuevo: Flux crea el Job
  #   nuevo y `prune: true` se lleva el viejo. La inmutabilidad deja de ser un
  #   problema que hay que esquivar y pasa a ser gratis.
  #
  # ⚠️ Lo que NO se reintenta solo: un fallo con la plantilla IGUAL. Repetir
  #   trabajo identico de forma identica es un bucle, no un reintento. Para
  #   volver a intentarlo se borra el Job —`kubectl delete job catalogo-…`— y
  #   Flux lo recrea en la siguiente reconciliacion, porque sigue en el origen.
  #   Es un acto de una persona, y esta bien que lo sea.
  name: copiar-00000000
  namespace: t-demo
  labels:
    # ⛔ La cola de Kueue, y no es opcional: es lo que hace que este pod aterrice
    #   en el pool privado. Sin esta etiqueta el Job no pasa por Kueue —
    #   `manageJobsWithoutQueueName` está en falso— y aterriza donde caiga, con
    #   una `NetworkPolicy` que abre el 443 a todo internet.
    kueue.x-k8s.io/queue-name: cola
    ore.dev/tenant: demo
    ore.dev/rol: driver
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  # ── ⛔⛔ Y UN PLAZO, PORQUE ESTO SE CUELGA SIN EL ────────────────────────
  #
  # Medido dos veces el 2026-09-10: un origen cuya URL no trae credencial deja a
  # `ore-read-postgres` esperando, y el Job se quedo OCHO MINUTOS imprimiendo
  #
  #     ### leyendo el origen `postgresql_20260910_1305`
  #
  # y nada mas. Sin plazo eso no acaba nunca: `backoffLimit` cuenta INTENTOS
  # FALLIDOS, y un pod que no termina no ha fallado — asi que ni reintenta ni se
  # rinde, y mantiene vivo un nodo del pool privado indefinidamente.
  #
  # ⭐ Diez minutos. Un catalogo tarda segundos contra un origen que contesta;
  #   lo que pasa de ahi no es lentitud, es que no va a llegar. Y fallar por
  #   plazo deja el registro y el motivo, que es lo que un cuelgue no deja.
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        ore.dev/rol: driver
        ore.dev/tenant: demo
    spec:
      # `Never`, y por lo que costó averiguarlo en el aprovisionador: con
      # `OnFailure` el pod se borra al agotar los reintentos, con su registro
      # dentro. Un catálogo que falla y no dice por qué obliga a repetirlo.
      restartPolicy: Never
      serviceAccountName: driver
      volumes:
        - name: puesto
          emptyDir: { medium: Memory }
        - name: trabajo
          emptyDir: {}
      initContainers:
        - name: traer-el-testigo
          image: europe-west1-docker.pkg.dev/project-8853a180-450d-47be-b83/ore/ore-drivers:main
          env:
            - { name: HOME, value: /tmp }
            - { name: CLOUDSDK_CONFIG, value: /tmp/.gcloud }
          volumeMounts: [{ name: puesto, mountPath: /puesto }]
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              gcloud secrets versions access latest \
                --secret=t-demo-forja-token --out-file=/puesto/forja
              chmod 0400 /puesto/forja
              echo "testigo puesto · $(wc -c < /puesto/forja) bytes"
              # ⭐⭐ Y EL AGENTE, por el mismo camino. Hasta el 2026-09-13 venia de
              #   un `Secret` `idp-agente` puesto a mano y copiado entre
              #   inquilinos; ahora es el cliente de Keycloak de ESTE inquilino,
              #   que el aprovisionador crea en su paso ⑦ y deja en el almacen.
              for p in cliente secreto; do
                gcloud secrets versions access latest \
                  --secret=t-demo-agente-$p --out-file=/puesto/agente-$p
                chmod 0400 /puesto/agente-$p
              done
              echo "agente puesto · $(cat /puesto/agente-cliente)"
          resources:
            requests: {cpu: "50m", memory: 128Mi}
            limits:   {cpu: "500m", memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
        # ── ⭐ Paso 4c: el clon del árbol, y lo que la copia de una vista SQL
        #   necesita para calcularse (la consulta y lo que lee, en Arrow).
        #   Sin copias por consulta que no estén al día, sólo el clon.
        - name: preparar
          image: europe-west1-docker.pkg.dev/project-8853a180-450d-47be-b83/ore/ore-drivers:main
          imagePullPolicy: Always
          env:
            - { name: HOME, value: /tmp }
            - { name: GIT_TERMINAL_PROMPT, value: "0" }
            - { name: GIT_CONFIG_COUNT, value: "2" }
            - { name: GIT_CONFIG_KEY_0, value: "http.extraheader" }
            - { name: GIT_CONFIG_KEY_1, value: "safe.directory" }
            - { name: GIT_CONFIG_VALUE_1, value: "*" }
            - { name: VISTAS, value: "olist.customers" }
            - { name: REHACER, value: "" }
            - { name: ORE_STORE, value: "gcs" }
            - { name: ORE_GCS_BUCKET, value: "project-8853a180-450d-47be-b83-t-demo-copia" }
          volumeMounts:
            - { name: puesto, mountPath: /puesto, readOnly: true }
            - { name: trabajo, mountPath: /trabajo }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              export GIT_CONFIG_VALUE_0="Authorization: token $(cat /puesto/forja)"
              cd /trabajo
              git clone --quiet \
                http://forja.t-demo.svc.cluster.local:3000/t-demo/ontologia.git arbol
              cd arbol
              mkdir -p /trabajo/calculo
              if [ -n "$REHACER" ]; then
                SOLO=""; for v in $(echo "$VISTAS" | tr ',' ' '); do SOLO="$SOLO --vista $v"; done
                # shellcheck disable=SC2086
                ore materialize . --preparar /trabajo/calculo --rehacer $SOLO \
                  || echo "⚠️ alguna copia por consulta no se preparó: su informe lo dirá"
              else
                ore materialize . --preparar /trabajo/calculo \
                  || echo "⚠️ alguna copia por consulta no se preparó: su informe lo dirá"
              fi
          resources:
            requests: {cpu: "200m", memory: 512Mi}
            limits:   {cpu: "2000m", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
        # ── ⭐ Paso 4c: DuckDB ejecuta cada consulta sobre lo preparado. La
        #   imagen del puesto, SIN el volumen del testigo: no hay credencial
        #   que leer, y lo que la consulta lee ya está en /trabajo/calculo.
        #   Una consulta que falla deja `error.txt` y las demás siguen.
        - name: calcular
          image: europe-west1-docker.pkg.dev/project-8853a180-450d-47be-b83/ore/puesto-python:1
          imagePullPolicy: Always
          env:
            - { name: HOME, value: /tmp }
            # Lo que DuckDB se puede quedar (la mitad) y dónde derrama el resto.
            - { name: ORE_MEMORIA_MB, value: "2048" }
          volumeMounts:
            - { name: trabajo, mountPath: /trabajo }
          workingDir: /opt/ore
          command: ["python3", "-m", "ore.calcular", "/trabajo/calculo"]
          resources:
            requests: {cpu: "500m", memory: 1Gi}
            limits:   {cpu: "2000m", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile: { type: RuntimeDefault }
            capabilities: { drop: [ALL] }
      containers:
        - name: copiar
          image: europe-west1-docker.pkg.dev/project-8853a180-450d-47be-b83/ore/ore-drivers:main
          imagePullPolicy: Always
          env:
            - { name: HOME, value: /tmp }
            - { name: CLOUDSDK_CONFIG, value: /tmp/.gcloud }
            - { name: GIT_TERMINAL_PROMPT, value: "0" }
            - { name: GIT_CONFIG_COUNT, value: "2" }
            - { name: GIT_CONFIG_KEY_0, value: "http.extraheader" }
            - { name: GIT_CONFIG_KEY_1, value: "safe.directory" }
            - { name: GIT_CONFIG_VALUE_1, value: "*" }
            # ⚠️ LOS DATASETS MANTENIDOS. Es lo que distingue una pasada de otra,
            #   y viene del árbol (`kind: Dataset` con `from`) — no de aquí. Y el
            #   almacén: el bucket del inquilino (aprovisionador ③b), por
            #   `ore-store-gcs` con el token de esta cuenta.
            - { name: VISTAS, value: "olist.customers" }
            # ⭐ REHACER (0030 W1): vacio es la copia de siempre —el recibo
            #   manda—. Con un instante dentro, la pasada es un «rehacer»
            #   pedido a mano (`POST /paquetes/{n}/copia/rehacer`): no hace caso
            #   al puntero, lee el origen entero SOLO para `VISTAS`, y sobrescribe
            #   el dataset (un snapshot nuevo). Dos peticiones son dos Jobs.
            - { name: REHACER, value: "" }
            - { name: ORE_STORE, value: "gcs" }
            # Cuánta historia conserva `--recoger` (segundos): siete días.
            - { name: ORE_RECOGER_EDAD, value: "604800" }
            - { name: ORE_GCS_BUCKET, value: "project-8853a180-450d-47be-b83-t-demo-copia" }
            # El lago del inquilino como fuente (donde viven los datasets, 0033):
            # la raíz de su bucket. No es un secreto.
            - { name: LAGO_URL, value: "gs://project-8853a180-450d-47be-b83-t-demo-copia" }
            # ⛔ La organizacion, y como VARIABLE y no dentro de la URL: asi la
            #   sustituye el renderizador con la misma regla que el resto, y la
            #   comprobacion ② puede cazarla si algun dia se cae.
            - { name: ORGANIZACION, value: "demo" }
            # ── ⭐⭐ DOS COSAS, Y ES LA QUINTA VEZ QUE HAY QUE SEPARARLAS ──
            #
            #   EMISOR     lo que el IdP tiene que AFIRMAR ser
            #   DIRECCION  por donde se le alcanza HOY
            #
            # ⛔ Aqui habia solo `EMISOR`, y se usaba de las dos cosas: se le
            #   pedia el testigo a `https://login.paladio.io`. Sintoma medido:
            #
            #     curl: (28) Failed to connect to login.paladio.io:443
            #     after 132807 ms
            #
            #   Ciento treinta y dos segundos, o sea el cuelgue de siempre: una
            #   `NetworkPolicy` no rechaza, TIRA EL PAQUETE. Un pod de inquilino
            #   no sale a internet — es lo que le da su aislamiento— asi que el
            #   nombre publico de su propio IdP es inalcanzable desde dentro.
            #
            # ⭐ `50-jwks.yaml` ya lo tenia resuelto y con estas dos palabras:
            #   *«la ruta por la que se alcanza al IdP y el nombre que el IdP
            #   afirma son dos cosas independientes»*. Es la misma figura que
            #   `arbol` (017), `kek` (019) y `entrada` (022): el nombre va en la
            #   fila y es unico; por donde se llega es configuracion.
            - { name: EMISOR, value: "https://login.paladio.io" }
            - { name: DIRECCION, value: "http://idp-service.identidad.svc.cluster.local:8080" }
            - { name: REALM, value: "rubix" }
          volumeMounts:
            - { name: puesto, mountPath: /puesto, readOnly: true }
            - { name: trabajo, mountPath: /trabajo }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              # ⛔ El testigo por `GIT_CONFIG_*` y no en la URL: un
              #   `http://usuario:token@host/…` lo lee cualquier proceso de la
              #   máquina. Misma disciplina que `ore-serve/git.rs`.
              export GIT_CONFIG_VALUE_0="Authorization: token $(cat /puesto/forja)"
              # El clon lo hizo `preparar`, en el mismo commit que lo calculado.
              cd /trabajo/arbol
              echo "### los datasets con copia: $VISTAS"
              # Las fuentes que hay que abrir: las de las TABLAS RAÍZ de esos
              # datasets. Lo dice `ore view .` en la línea `raíz` de cada uno
              # (la cadena entera, dataset → vista → tabla, la sigue el motor y
              # no un awk sobre los documentos), y cada fuente pide su
              # credencial al cofre. Una raíz en `lago` (un dataset sobre lo
              # que `write()` dejó) no pide nada: el bucket es del inquilino.
              ore view . > /trabajo/vista.txt 2>&1 || { echo "✗ el árbol no compila:"; tail -5 /trabajo/vista.txt; exit 1; }
              FUENTES=""
              for QV in $(echo "$VISTAS" | tr ',' ' '); do
                F=$(awk -v n="$QV" '$0==n{m=1;next} m&&/^  ra/{s=$0;sub(/^  [^ ]+ +/,"",s);sub(/ .*/,"",s);print s;exit}' /trabajo/vista.txt)
                [ -n "$F" ] || { echo "✗ \`$QV\` no dice su raíz en \`ore view\`"; exit 1; }
                [ "$F" = lago ] && continue
                case ",$FUENTES," in *",$F,"*) ;; *) FUENTES="${FUENTES:+$FUENTES,}$F" ;; esac
              done
              echo "### fuentes que hay que abrir: $FUENTES"
              DICE=$(curl -sSf "$DIRECCION/realms/$REALM/.well-known/openid-configuration" | python3 -c 'import json,sys;print(json.load(sys.stdin)["issuer"])')
              [ "$DICE" = "$EMISOR/realms/$REALM" ] || { echo "✗ en $DIRECCION contesta \`$DICE\` y esperabamos \`$EMISOR/realms/$REALM\`. No se toca nada."; exit 1; }
              CLIENTE=$(cat /puesto/agente-cliente); SECRETO=$(cat /puesto/agente-secreto)
              TOK=$(curl -sSf -X POST "$DIRECCION/realms/$REALM/protocol/openid-connect/token" \
                -d grant_type=client_credentials -d "client_id=$CLIENTE" \
                -d "client_secret=$SECRETO" | python3 -c 'import json,sys;print(json.load(sys.stdin)["access_token"])')
              for F in $(echo "$FUENTES" | tr ',' ' '); do
                VAR=$(awk -v n="$F" '/^datasources:/{d=1;next} d&&/^[^ ]/{exit} d{if(match($0,/name: *[A-Za-z0-9_]+/)){s=substr($0,RSTART,RLENGTH);sub(/name: */,"",s);c=s} if(match($0,/connectionEnv: *[A-Za-z0-9_]+/)&&c==n){v=substr($0,RSTART,RLENGTH);sub(/connectionEnv: */,"",v);print v;exit}}' ontology.config.yaml)
                [ -n "$VAR" ] || { echo "✗ el manifiesto no dice el \`connectionEnv\` de \`$F\`"; exit 1; }
                C=$(curl -s -o /trabajo/s.json -w '%{http_code}' \
                  -H "authorization: Bearer $TOK" \
                  "http://ore-cofre.t-demo.svc.cluster.local:8095/organizaciones/$ORGANIZACION/secretos/fuente-$F")
                # ⚠️ Sin credencial NO se para la pasada (2026-09-18): en un inquilino
                #   el paquete de ejemplo `ventas` (`VENTAS_URL`, nunca en el
                #   custodio) tumbaba CADA pasada, y la base estándar recién
                #   creada nunca llegó a copiarse. Las vistas de esa fuente
                #   fallarán una a una en `materialize`, y su informe lo dirá.
                if [ "$C" != "200" ]; then
                  echo "  ⚠️ el custodio contesto $C para \`fuente-$F\`: sus vistas no se copiarán en esta pasada — $(head -c 160 /trabajo/s.json)"
                  rm -f /trabajo/s.json
                  continue
                fi
                export "$VAR"="$(python3 -c 'import json;print(json.load(open("/trabajo/s.json"))["valor"])')"
                rm -f /trabajo/s.json
                echo "  ✓ credencial de \`$F\` puesta en \`$VAR\` — y no toca el disco"
              done

              # ⭐ El ciclo. `ore` no abre sockets: canaliza `ore-read-<tipo>` a
              #   `ore-store-gcs`, que escribe la tabla con el token de esta
              #   cuenta. El puntero por dataset va a `datasets/` en el árbol.
              # ⚠️ Y una vista que falla NO tumba la pasada: `materialize` deja
              #   el puntero de cada una (copiada, al día, o error con su motivo
              #   —sin perder el dataset que había—) y es ESO lo que hay que
              #   empujar. Con `set -e` y el código de salida, un fallo en una
              #   vista perdía los informes de las que sí se copiaron, y el Job
              #   se reintentaba tres veces leyendo los orígenes enteros otra
              #   vez. La pasada termina bien si informó; lo que no se copió lo
              #   dice su puntero.
              if [ -n "$REHACER" ]; then
                echo "### rehaciendo $VISTAS (pedido $REHACER; almacén: $ORE_STORE, bucket: $ORE_GCS_BUCKET)"
                SOLO=""; for v in $(echo "$VISTAS" | tr ',' ' '); do SOLO="$SOLO --vista $v"; done
                # shellcheck disable=SC2086
                ore materialize . --rehacer $SOLO --recoger --informe datasets --calculado /trabajo/calculo \
                  || echo "⚠️ algún dataset no se rehizo: su informe en datasets/ lo dice"
              else
                echo "### materializando (almacén: $ORE_STORE, bucket: $ORE_GCS_BUCKET)"
                ore materialize . --recoger --informe datasets --calculado /trabajo/calculo \
                  || echo "⚠️ algún dataset no se copió: su informe en datasets/ lo dice"
              fi

              git add -A datasets
              if git diff --cached --quiet; then
                echo "· la copia no cambió: nada que empujar"
                exit 0
              fi
              git -c user.name=copiador -c user.email=copiador@invalido \
                commit -q -m "Copia: $VISTAS"
              git push -q origin HEAD:main
              echo "✓ copia empujada · $(git rev-parse --short HEAD)"
          resources:
            requests: {cpu: "200m", memory: 512Mi}
            limits:   {cpu: "2000m", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
