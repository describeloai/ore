# ═══════════════════════════════════════════════════════════════════════════
# ORE-CONSULTA · los trabajadores DuckDB de Query (Query Q4, `docs/query.md` §3.2)
# ═══════════════════════════════════════════════════════════════════════════
#
# Lo que la consola Query corre, en una capacidad de la celda caliente y
# compartida, y no en el puesto de cada persona: `ore-serve` admite cada consulta
# (L o G: su memoria y sus hilos), resuelve sus nombres en nombre de quien
# pregunta y presta las credenciales de SUS datasets; el trabajador la corre en su
# propia instancia de DuckDB, cerrada (`puesto/python/ore_consulta.py`). El mismo
# Python, DuckDB y SDK que la sesión (la imagen `puesto-python`).
#
# ⭐ NO ACEPTA CONEXIONES, como el puesto: pide trabajo a `ore-serve` por espera
#   larga (`GET /consultas/trabajo`), diciendo lo que le cabe, y devuelve lo que
#   corrió. Por eso no hay Service, y por eso varios trabajadores se reparten
#   la carga solos: cada uno pide lo que le cabe.
#
# ⭐ SIN IDENTIDAD PROPIA SOBRE EL LAGO (§3.5, capa 2):
#     · su cuenta (`consulta`) no tiene Workload Identity ni monta el token de la
#       API; lo único que monta es el token de SU pod con la audiencia
#       `ore-serve/puestos/ore-consulta/1`, que `ore-entrada` sólo acepta con
#       esta cuenta (y esta cuenta, sólo con esa audiencia);
#     · `ore-serve` sólo le deja pedir trabajo y entregar resultados;
#     · sale sólo al DNS, a Google por la vía privada (199.36.153.8/30:443, el
#       lago, con la credencial de cada consulta) y a `ore-serve` (la regla
#       común `salida-al-control`). Ni metadatos, ni el cofre, ni el emisor, ni
#       la forja (fuera en `11-el-inquilino.yaml` y `41-el-cofre.yaml`), ni
#       internet. Nadie le entra (`deny-all-ingress`).
#
# ⭐ UN TRABAJADOR = UN NODO `pesado` (n2-highmem-8): 7 CPU y 48 GiB pedidos, el 80 %
#   de la memoria repartido entre consultas (lo que la admisión supone,
#   `Umbrales::trabajador_mb` × `reparto_pct`) y 240 GiB de derrame en la SSD.
#   Va a `cola-pesada` (DQ3: la cola propia se decide al medir).
#
# ⛔ `replicas: 0` A PROPÓSITO, hasta Q4·4. Un trabajador encendido toma la cuota
#   pesada entera de la celda (7 CPU / 48 GiB / 250 GiB) y un nodo de 08 a 00: un
#   Build pesado de esa celda iría al nodo prestado de la otra (cohorte), y con
#   un Build elástico a la vez la cuota del namespace (20 CPU) no llega. Encender
#   el suelo caliente (DQ2) es una decisión con su cuota (DQ3), y el *flag*
#   `ore-serve --consultas`, el último paso: binario, malla, *flag*.
#
# ⭐ `maxSurge: 0`: la cuota pesada es de un pod; uno nuevo antes de quitar el
#   viejo esperaría en Kueue para siempre. Al pararlo (SIGTERM), lo que corre
#   termina y se entrega (`terminationGracePeriodSeconds`).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: consulta
  namespace: t-demo
  labels:
    ore.dev/tenant: demo
    ore.dev/pieza: consulta
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ore-consulta
  namespace: t-demo
  labels:
    ore.dev/tenant: demo
    ore.dev/rol: consulta
    ore.dev/pieza: consulta
    kueue.x-k8s.io/queue-name: cola-pesada
spec:
  replicas: 0
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 1, maxSurge: 0 }
  selector:
    matchLabels:
      ore.dev/pieza: consulta
  template:
    metadata:
      labels:
        ore.dev/tenant: demo
        ore.dev/rol: consulta
        ore.dev/pieza: consulta
        kueue.x-k8s.io/queue-name: cola-pesada
    spec:
      serviceAccountName: consulta
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 300
      # Lo que el sabor `pesado` de Kueue pone (`10-kueue.yaml`), escrito también
      # aquí: un trabajador nunca cae en el nodo del sistema.
      nodeSelector:
        ore.dev/pool: pesado
      tolerations:
        - { key: ore.dev/pesado, operator: Equal, value: "true", effect: NoSchedule }
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 1Gi }
        # El derrame de las consultas, en la SSD local del nodo; cada una el suyo
        # en `/trabajo/consulta-<id>`, con su tope (`ORE_CONSULTA_DISCO_MB`).
        - name: trabajo
          emptyDir: { sizeLimit: 240Gi }
        - name: token-del-pod
          projected:
            sources:
              - serviceAccountToken:
                  audience: ore-serve/puestos/ore-consulta/1
                  expirationSeconds: 3600
                  path: token
      containers:
        - name: ore-consulta
          image: europe-west1-docker.pkg.dev/project-8853a180-450d-47be-b83/ore/puesto-python:1
          imagePullPolicy: Always
          command: ["python", "/opt/ore/ore_consulta.py"]
          env:
            - { name: ORE_SERVE, value: "http://ore-serve.t-demo.svc.cluster.local:8080" }
            - { name: ORE_TOKEN_DEL_POD, value: /var/run/ore/pod/token }
            - { name: ORE_TRABAJO, value: /trabajo }
            - { name: HOME, value: /tmp }
            - { name: TMPDIR, value: /tmp }
            # 80 % de 48 GiB, en MiB: lo que la admisión reparte.
            - { name: ORE_CONSULTA_MEMORIA_MB, value: "39321" }
            - { name: ORE_CONSULTA_HILOS, value: "8" }
            # El `sizeLimit` de `/trabajo` menos holgura, en MiB.
            - { name: ORE_CONSULTA_DISCO_MB, value: "235520" }
            - { name: ORE_CONSULTA_PREPARADAS, value: "4" }
            - { name: PYTHONUNBUFFERED, value: "1" }
          # No escucha: vive mientras pide (escribe la hora en cada vuelta, y una
          # vuelta dura como mucho la espera larga de `ore-serve`, 25 s).
          livenessProbe:
            exec:
              command: ["python", "-c", "import os,sys,time; sys.exit(time.time() - os.path.getmtime('/tmp/ore-consulta-vivo') > 120)"]
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests: {cpu: "7", memory: 48Gi, ephemeral-storage: 240Gi}
            limits:   {memory: 48Gi, ephemeral-storage: 245Gi}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: trabajo, mountPath: /trabajo }
            - { name: token-del-pod, mountPath: /var/run/ore/pod, readOnly: true }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
# Y sale sólo al lago (Google por la vía privada). El DNS es de `deny-all-egress`
# y `ore-serve`, de `salida-al-control`.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: salida-de-la-consulta
  namespace: t-demo
  labels:
    ore.dev/tenant: demo
    ore.dev/pieza: consulta
spec:
  podSelector:
    matchLabels:
      ore.dev/pieza: consulta
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: { cidr: 199.36.153.8/30 }
      ports: [{protocol: TCP, port: 443}]
