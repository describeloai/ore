# La puerta. Nada entra en `main` sin cruzarla, y `release.yml` la vuelve a
# cruzar antes de publicar nada — porque una puerta que se comprueba en un sitio
# distinto del que se atraviesa no es una puerta.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Un empujón nuevo cancela el anterior sobre la misma rama: lo que importa es el
# veredicto de la punta, no el de un commit que ya nadie va a mirar.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  RUSTFLAGS: -D warnings

jobs:
  suite:
    runs-on: ubuntu-24.04
    steps:
      # `vendor/oos` NO es opcional: los casos de conformidad viven ahí, y sin
      # ellos esta puerta comprobaría que compila, no que cumple.
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: toolchain
        run: rustup show   # `rust-toolchain.toml` manda; esto solo lo materializa

      - uses: Swatinem/rust-cache@v2

      - name: formato
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # `--workspace` y no el build por defecto: los drivers y el ejecutor están
      # FUERA de `default-members` a propósito —el build por defecto de este
      # repositorio es el compilador hermético— pero la puerta los cruza igual.
      # Ahí dentro va la prueba de fuego de Cedar, que enfrenta las políticas de
      # un paquete al esquema que ese mismo paquete proyecta.
      #
      # Sin números: una cuenta escrita a mano en un fichero de CI envejece, y
      # hoy se ha medido lo que eso cuesta en otro sitio del repositorio.
      - name: suite
        run: cargo test --workspace --all-targets

      # El binario tiene que arrancar, no solo enlazar. Un `--version` que falla
      # es un artefacto que no sirve, y sale más barato saberlo aquí.
      - name: arranca
        run: cargo run --quiet -- --version

  # ── Las pruebas de fuego ───────────────────────────────────────────────────
  #
  # Enfrentan lo que emitimos a la implementación de referencia AJENA, y lo que
  # planificamos a una fuente de verdad. Viven fuera de `cargo test` porque
  # necesitan cosas que el compilador no puede necesitar —Node, un servidor— y
  # entran aquí porque **una prueba que no corre tiene exactamente el mismo
  # aspecto que una que pasa**.

  graphql:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # La implementación de referencia, no la nuestra. Encontró defectos que
      # llevaban versiones ahí y que no se veían leyendo: un esquema puede estar
      # bien escrito y ser inválido, y solo lo dice quien lo tiene que consumir.
      - name: graphql-js
        run: |
          npm install --no-save graphql
          bash pruebas-de-fuego/graphql.sh

  # El eslabon vivo de `discover`. Estaba cubierto por un lado y por el otro no:
  # once pruebas sobre `--from` y NINGUNA sobre `--source`, que es el que resuelve
  # el driver en el PATH, le pasa la URL por stdin y analiza lo que devuelve. Los
  # tres se podian romper en silencio, y con base de datos propia porque cada
  # prueba de fuego tiene que ser dueña de su terreno: el lector lee TODOS los
  # esquemas, asi que las tablas de otra prueba serian entidades de esta.
  descubrimiento:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: x
          POSTGRES_DB: descubrimiento
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - run: rustup show
      - uses: Swatinem/rust-cache@v2

      - name: init → source add → discover --source → review → validate
        env:
          PG_URL: postgres://postgres:x@localhost:5432/descubrimiento
        run: |
          cargo build --quiet
          cargo build --quiet -p ore-read-postgres
          export PATH="$PWD/target/debug:$PATH"
          bash pruebas-de-fuego/descubrimiento.sh

  # El plano de control, contra un servidor de VERDAD. Las 14 pruebas del crate
  # miran funciones; ninguna puede decir si la puerta es una puerta, porque una
  # puerta se comprueba empujandola. Esto levanta `ore-serve` en un puerto y le
  # habla con `curl`.
  #
  # Y hay un hecho que solo se puede afirmar aqui: que SIN proveedor de identidad
  # las rutas de datos no estan. Un defecto permisivo en ese punto no rompe
  # ninguna prueba unitaria — sirve de mas, en silencio.
  plano-de-control:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - run: rustup show
      - uses: Swatinem/rust-cache@v2

      # ⛔ La deuda del segundo factor, con su despertador. Hoy AVISA: el realm
      # opera a UN factor a proposito y con fecha. El 2026-09-30 este paso se
      # pone rojo solo, que es la diferencia entre una deuda y un olvido.
      - name: y el segundo factor sigue teniendo plazo
        run: bash pruebas-de-fuego/el-segundo-factor.sh

      - name: el servidor atiende, y lo que toca el mundo sigue fuera
        run: |
          cargo build --quiet -p ore-cli -p ore-serve
          bash pruebas-de-fuego/servidor.sh

      # Y el modo forja, contra una forja de verdad puesta aqui mismo. Lo que
      # cambia no es una bandera: el arbol deja de ser un directorio y pasa a
      # ser un repositorio, y con el llegan el autor de cada commit y el
      # rechazo del segundo que empuja.
      - name: y con el arbol en una forja
        run: bash pruebas-de-fuego/servidor-forja.sh

      # Y la puerta OIDC, con tokens acunados en el momento. Lo que fija que no
      # fijan las pruebas del crate es el CABLEADO: que el sujeto sale de la
      # cabecera `Authorization` y que un token bien firmado del MISMO realm
      # para otro servicio no entra.
      - name: y la puerta pide un token de verdad
        run: bash pruebas-de-fuego/servidor-oidc.sh

      # ⭐ LA MUDANZA. Corremos una plataforma gestionada, y esto convierte
      # «el cliente puede irse» de promesa en puerta: un arbol producido como
      # lo produce la plataforma tiene que compilar con `env -i` — ni una
      # variable— y sin nombrar nuestra infraestructura ni llevar un secreto.
      #
      # El dia que `ore validate` necesite nuestra base, este paso se pone rojo
      # antes de que nadie lo note en produccion.
      - name: y el cliente puede irse
        run: bash pruebas-de-fuego/la-mudanza.sh

  # ⭐ LOS VERBOS DEL PLANO DE IDENTIDAD. Lo mismo que fija
  # `malla/98-los-cuatro-verbos.yaml`, pero SIN un cluster que alguien tenga que
  # tener en pie: un control que solo se ejerce cuando alguien se acuerda no es
  # un control, es una costumbre.
  #
  # Y fija una cosa que el Job del cluster NO puede: alli el sujeto es `dueno`,
  # asi que la guarda del rodeo nunca llega a morder. Aqui hay un administrador
  # de verdad intentando otorgar por encima de si mismo.
  los-verbos:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: x
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - run: rustup show
      - uses: Swatinem/rust-cache@v2

      - name: los cuatro verbos, sus negativas y el rodeo
        env:
          PG_URL: postgres://postgres:x@localhost:5432
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: x
        run: |
          cargo build --quiet -p ore-iam
          bash pruebas-de-fuego/los-verbos.sh

  fuentes-reales:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: x
          POSTGRES_DB: hr
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - run: rustup show
      - uses: Swatinem/rust-cache@v2

      # Seis escenarios que se midieron A MANO al construir L2: el driver, el
      # solo-lectura, el índice determinista, el refresco que sustituye en vez de
      # sumar, una consulta que cruza dos familias de fuente y el estado
      # degradado. Cada uno era un `echo` en una terminal; aquí es una aserción.
      - name: contra un PostgreSQL de verdad
        env:
          PG_URL: postgres://postgres:x@localhost:5432/hr
        run: |
          cargo build --quiet -p ore-read-postgres -p ore-read-jsonl
          export PATH="$PWD/target/debug:$PATH"
          bash pruebas-de-fuego/fuentes-reales.sh

  # ══════════════════════════════════════════════════════════════════════════
  # LA IMAGEN — construir y desplegar deja de ser una costumbre
  #
  # ── ⛔ Qué pasaba antes ────────────────────────────────────────────────────
  #
  #   CI no construía imágenes. Cada `:main` la subía alguien a mano, así que
  #   entre un `git push` verde y lo que estaba corriendo podía haber
  #   cualquier cosa — y el 2026-09-08 hubo **un pánico desplegado veinte
  #   minutos**, construido de un árbol que aún no había pasado por aquí.
  #
  # ── ⭐⭐ Y el orden es la mitad del arreglo ───────────────────────────────
  #
  #   `needs` con TODOS los trabajos de prueba. Construir antes de que pasen
  #   sería exactamente lo de antes con más pasos: lo que hace que esto sirva
  #   no es que CI construya, es que **no pueda construir algo rojo**.
  #
  # ── ⛔ Sin llaves de larga vida ───────────────────────────────────────────
  #
  #   Federación con el OIDC de GitHub: `google-github-actions/auth` cambia el
  #   token del `job` por uno de Google. El proveedor tiene una condición
  #   —`assertion.repository == 'describeloai/ore'`— y la cuenta de servicio
  #   está atada al `principalSet` de ESE repositorio. No hay ningún JSON de
  #   credenciales en ningún secreto, y por eso no hay nada que rotar ni que
  #   se pueda filtrar en un log.
  #
  # ⚠️ `id-token: write` es lo que permite pedir ese token. Sin ese permiso el
  #   paso falla con un mensaje que no menciona OIDC.
  # ══════════════════════════════════════════════════════════════════════════
  imagen:
    # ⛔ Sólo `main`, y sólo empujando. Un PR de un fork no despliega nada.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # ⛔ TODOS. Esperar a tres de seis seria elegir cuales pueden estar rojos.
    needs: [suite, graphql, descubrimiento, plano-de-control, los-verbos, fuentes-reales]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: google-github-actions/auth@v2
        with:
          project_id: project-8853a180-450d-47be-b83
          workload_identity_provider: projects/339497864493/locations/global/workloadIdentityPools/github/providers/describeloai
          service_account: ore-ci@project-8853a180-450d-47be-b83.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      # Las cuatro, en una sola construcción: comparten la etapa `build`.
      - name: construir las cuatro imagenes
        run: |
          # ⛔ `--service-account` a proposito: sin el, Cloud Build corre como la
          #   cuenta de COMPUTO, y para eso `ore-ci` necesitaria poder suplantarla
          #   — y esa cuenta tiene medio proyecto. Corriendo como si misma, la
          #   construccion tiene los cinco permisos que se le dieron y ni uno mas.
          #
          # ⚠️ Y con cuenta propia, Cloud Build EXIGE decir donde van los logs.
          #   `logging: CLOUD_LOGGING_ONLY` ya esta en `cloudbuild.yaml`; sin el
          #   falla con un mensaje que no menciona la cuenta.
          gcloud builds submit --config cloudbuild.yaml \
            --service-account=projects/project-8853a180-450d-47be-b83/serviceAccounts/ore-ci@project-8853a180-450d-47be-b83.iam.gserviceaccount.com \
            --substitutions _SHA=${GITHUB_SHA::12} .

      # ⭐⭐ Y el DESPLIEGUE no cambia la etiqueta del manifiesto. Sigue siendo
      #   `:main` con `imagePullPolicy: Always`, para que `kubectl apply -f
      #   malla/…` a mano siga diciendo la verdad. Lo que se escribe es una
      #   ANOTACIÓN con el commit: provoca el relevo **y** deja escrito de qué
      #   árbol salió lo que está corriendo, que es lo que hoy no se podía
      #   averiguar mirando un pod.
      - name: desplegar, y dejar dicho de que commit
        run: |
          gcloud container clusters get-credentials ore-mesh \
            --zone europe-west1-b --project project-8853a180-450d-47be-b83
          for D in identidad/ore-iam t-demo/ore-serve; do
            NS="${D%%/*}"; NOMBRE="${D##*/}"
            kubectl -n "$NS" patch deployment "$NOMBRE" --type=merge -p \
              "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"ore.dev/commit\":\"$GITHUB_SHA\"}}}}}"
            kubectl -n "$NS" rollout status "deployment/$NOMBRE" --timeout=300s
          done

      # ⛔ Y se COMPRUEBA que lo que quedó arriba es lo que se acaba de empujar.
      #   Un `rollout status` verde dice que hay pods listos, no que sean los
      #   nuestros: si el `patch` no hubiera cambiado nada —porque la anotación
      #   ya estuviera— no habría relevo y esto pasaría igual.
      - name: y comprobar que corre ESTE commit
        run: |
          for D in identidad/ore-iam t-demo/ore-serve; do
            NS="${D%%/*}"; NOMBRE="${D##*/}"
            VISTO=$(kubectl -n "$NS" get deployment "$NOMBRE" \
              -o jsonpath='{.spec.template.metadata.annotations.ore\.dev/commit}')
            [ "$VISTO" = "$GITHUB_SHA" ] \
              || { echo "✗ $NOMBRE corre «$VISTO» y esperabamos «$GITHUB_SHA»"; exit 1; }
            echo "  · $NOMBRE · $VISTO"
          done
