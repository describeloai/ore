# La puerta. Nada entra en `main` sin cruzarla, y `release.yml` la vuelve a
# cruzar antes de publicar nada — porque una puerta que se comprueba en un sitio
# distinto del que se atraviesa no es una puerta.
name: ci

# ⭐ G1 (ADR 0060, 2026-10-08): un commit que es SOLO PAPEL no corre nada.
#   Documentos, notas y las pruebas que se lanzan a mano contra prod (las de
#   0058 y las `b<N>`/`medida-*`): ninguna la cruza esta puerta, y cada corrida
#   que construye cuesta Cloud Build y Artifact Registry. El 8 de octubre fueron
#   17 de 64 commits (87 de 427 desde el 1).
#
# ⚠️ La misma lista va en `SOLO_PAPEL`, abajo, y `ci/solo-papel.py` comprueba
#   que dicen lo mismo: con ella el commit de código que queda delante de uno
#   de papel sigue siendo «la punta» y se despliega. Sin ella, nada lo haría.
on:
  # El ensayo de `construir` en una rama (ADR 0060 B2): `gh workflow run ci --ref <rama>
  # -f ensayo=true`. Sólo corre `construir`, y no etiqueta ni despliega nada.
  workflow_dispatch:
    inputs:
      ensayo:
        type: boolean
        default: true
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'pruebas-de-fuego/ore-postgres/**'
      - 'pruebas-de-fuego/b[0-9]*/**'
      - 'pruebas-de-fuego/medida-*'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'pruebas-de-fuego/ore-postgres/**'
      - 'pruebas-de-fuego/b[0-9]*/**'
      - 'pruebas-de-fuego/medida-*'

# En un PR, un empujón nuevo cancela el anterior: lo que importa es el
# veredicto de la punta, no el de un commit que ya nadie va a mirar.
#
# ⭐ En `main` NO (2026-09-30): cada commit es su propio grupo. Cancelar ahí
#   tiraba a la basura media construcción cada vez que otra sesión empujaba
#   (cinco veces en un día, medido), y el reloj volvía a cero. Quien decide
#   qué se despliega es el trabajo `imagen`: sólo la punta, uno a la vez.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  RUSTFLAGS: -D warnings
  # ADR 0065 PG1 · el Postgres de los servicios de la CI no habla TLS, y el
  # driver niega el texto plano salvo en el laboratorio. Nunca en producción.
  ORE_PG_LABORATORIO: "1"
  # Las globs de `paths-ignore` en las de `case`, donde `*` sí cruza `/`.
  SOLO_PAPEL: >-
    docs/*
    *.md
    pruebas-de-fuego/ore-postgres/*
    pruebas-de-fuego/b[0-9]*/*
    pruebas-de-fuego/medida-*

jobs:
  suite:
    if: ${{ !inputs.ensayo }}
    runs-on: ubuntu-24.04
    steps:
      # `vendor/oos` NO es opcional: los casos de conformidad viven ahí, y sin
      # ellos esta puerta comprobaría que compila, no que cumple.
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: lo que es solo papel, lo mismo en los tres sitios
        run: python3 ci/solo-papel.py

      - name: toolchain
        run: rustup show   # `rust-toolchain.toml` manda; esto solo lo materializa

      - uses: Swatinem/rust-cache@v2

      - name: formato
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # `--workspace` y no el build por defecto: los drivers y el ejecutor están
      # FUERA de `default-members` a propósito —el build por defecto de este
      # repositorio es el compilador hermético— pero la puerta los cruza igual.
      # Ahí dentro va la prueba de fuego de Cedar, que enfrenta las políticas de
      # un paquete al esquema que ese mismo paquete proyecta.
      #
      # Sin números: una cuenta escrita a mano en un fichero de CI envejece, y
      # hoy se ha medido lo que eso cuesta en otro sitio del repositorio.
      - name: suite
        run: cargo test --workspace --all-targets

      # El binario tiene que arrancar, no solo enlazar. Un `--version` que falla
      # es un artefacto que no sirve, y sale más barato saberlo aquí.
      - name: arranca
        run: cargo run --quiet -- --version

  # ── Las pruebas de fuego ───────────────────────────────────────────────────
  #
  # Enfrentan lo que emitimos a la implementación de referencia AJENA, y lo que
  # planificamos a una fuente de verdad. Viven fuera de `cargo test` porque
  # necesitan cosas que el compilador no puede necesitar —Node, un servidor— y
  # entran aquí porque **una prueba que no corre tiene exactamente el mismo
  # aspecto que una que pasa**.

  # ADR 0072 N6: Kerberos (SASL/GSSAPI) contra un HBase con Kerberos de verdad, en sus tres protecciones. Un KDC de MIT
  # y un HBase en Docker; la prueba corre DENTRO de la red `krb`, con el binario compilado con `--features kerberos`
  # (`pruebas-de-fuego/hbase/kerberos/`). Tarda: cada proteccion recrea el laboratorio.
  hbase-kerberos:
    if: ${{ !inputs.ensayo }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: HBase con Kerberos, en las tres protecciones
        run: ESPEJO=https://archive.apache.org/dist ORE_RAIZ="$PWD" bash pruebas-de-fuego/hbase/kerberos/probar_capas.sh integrity authentication privacy

  graphql:
    if: ${{ !inputs.ensayo }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # La implementación de referencia, no la nuestra. Encontró defectos que
      # llevaban versiones ahí y que no se veían leyendo: un esquema puede estar
      # bien escrito y ser inválido, y solo lo dice quien lo tiene que consumir.
      - name: graphql-js
        run: |
          npm install --no-save graphql
          bash pruebas-de-fuego/graphql.sh

  # El eslabon vivo de `discover`. Estaba cubierto por un lado y por el otro no:
  # once pruebas sobre `--from` y NINGUNA sobre `--source`, que es el que resuelve
  # el driver en el PATH, le pasa la URL por stdin y analiza lo que devuelve. Los
  # tres se podian romper en silencio, y con base de datos propia porque cada
  # prueba de fuego tiene que ser dueña de su terreno: el lector lee TODOS los
  # esquemas, asi que las tablas de otra prueba serian entidades de esta.
  descubrimiento:
    if: ${{ !inputs.ensayo }}
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: x
          POSTGRES_DB: descubrimiento
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - run: rustup show
      - uses: Swatinem/rust-cache@v2

      - name: init → source add → discover --source → review → validate
        env:
          PG_URL: postgres://postgres:x@localhost:5432/descubrimiento
        run: |
          cargo build --quiet
          cargo build --quiet -p ore-read-postgres
          export PATH="$PWD/target/debug:$PATH"
          bash pruebas-de-fuego/descubrimiento.sh

  # El plano de control, contra un servidor de VERDAD. Las 14 pruebas del crate
  # miran funciones; ninguna puede decir si la puerta es una puerta, porque una
  # puerta se comprueba empujandola. Esto levanta `ore-serve` en un puerto y le
  # habla con `curl`.
  #
  # Y hay un hecho que solo se puede afirmar aqui: que SIN proveedor de identidad
  # las rutas de datos no estan. Un defecto permisivo en ese punto no rompe
  # ninguna prueba unitaria — sirve de mas, en silencio.
  #
  # ⭐ En TRES trabajos a la vez (2026-10-03): eran 5,3 min en fila —el puesto
  #   124 s, el lago 72 s, el resto ~2 min— y el despliegue espera al más lento.
  #   Mismas pruebas, en paralelo: `plano-de-control` (el servidor y lo que
  #   vive en él), `plano-el-lago` y `plano-el-puesto`. Comparten la caché de
  #   cargo (la guarda éste, que compila también `ore-store`).
  plano-de-control:
    if: ${{ !inputs.ensayo }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: plano

      # ⛔ La deuda del segundo factor, con su despertador. Hoy AVISA: el realm
      # opera a UN factor a proposito y con fecha. El 2026-09-30 este paso se
      # pone rojo solo, que es la diferencia entre una deuda y un olvido.
      - name: y el segundo factor sigue teniendo plazo
        run: bash pruebas-de-fuego/el-segundo-factor.sh

      - name: el servidor atiende, y lo que toca el mundo sigue fuera
        run: |
          cargo build --quiet -p ore-cli -p ore-serve
          bash pruebas-de-fuego/servidor.sh

      # Y el modo forja, contra una forja de verdad puesta aqui mismo. Lo que
      # cambia no es una bandera: el arbol deja de ser un directorio y pasa a
      # ser un repositorio, y con el llegan el autor de cada commit y el
      # rechazo del segundo que empuja.
      - name: y con el arbol en una forja
        run: bash pruebas-de-fuego/servidor-forja.sh

      # (El lago y el puesto, en sus trabajos: `plano-el-lago`, `plano-el-puesto`.
      # `ore-store` se compila aquí también, para que la caché compartida lo traiga.)
      - name: y ore-store, para la cache de los otros dos
        run: cargo build --quiet -p ore-store

      # S3 · El código que ORE genera casa con el SDK: `cargo test` vuelca cada
      # forma (y comprueba sus imports y que no lleva nombres de antes), y aquí
      # cada llamada se coteja con la firma real de la función del SDK.
      - name: y el codigo que ORE genera casa con la firma del SDK
        run: |
          ORE_CELDAS_GENERADAS="$PWD/target/celdas-generadas" cargo test --quiet -p ore-serve --bin ore-serve -- \
            el_codigo_generado_casa_con_el_sdk el_arnes_no_interpola_codigo el_arnes_del_build_no_interpola_codigo \
            el_arnes_del_preview_es_el_del_build_y_no_escribe
          PYTHONUTF8=1 python3 pruebas-de-fuego/el-codigo-generado-casa-con-el-sdk.py target/celdas-generadas

      # Los tres verbos del modelo (0027 E1): el documento en el arbol y la
      # suscripcion en el gateway EN EL MISMO ACTO, o nada. El gateway es el de
      # banco (el contrato del plano de control de Bastion B3).
      - name: y el modelo entra en el arbol con su suscripcion, o no entra
        run: bash pruebas-de-fuego/los-modelos.sh

      # La decision de la copia (0027 P1 I2): `materialized` en la vista, la
      # clave en su tabla y el conducto autorizado, en un acto o nada.
      - name: y la copia de una vista se decide, o no se decide
        run: bash pruebas-de-fuego/la-copia-se-decide.sh

      # Los documentos del arbol por kind (Ontology Forge I1): `Entity` entera
      # —labels, relations, todo—, y escribirla con la misma figura: compilar
      # antes de empujar, el commit del sujeto, 409 cuando el arbol se movio.
      - name: y la entidad se lee entera y se escribe como un commit
        run: bash pruebas-de-fuego/los-documentos.sh

      # Los schemas de una base (0038 P6): crear es su `schema.yaml` en un
      # commit; renombrar mueve la carpeta, reapunta lo que la nombra en tres
      # partes, mueve los punteros, anuncia el `moved` y deja la regla en el
      # alcance — y la siguiente induccion no lo deshace.
      - name: y un schema se crea y se renombra en el arbol
        run: bash pruebas-de-fuego/los-schemas.sh

      # Proponer (0030 W2): rama por persona, propuesta en la forja, el diff y
      # los diagnosticos de la rama, la revision de OTRA persona y el merge —
      # contra la API de la forja de mentira sobre un repositorio pelado.
      - name: y una propuesta la revisa otra persona antes de llegar a main
        run: bash pruebas-de-fuego/la-propuesta.sh

      # 0058 P4·6 · Postgres por la celda: `/v1/postgres` en ore-serve contra un
      # ore-iam y un ore-postgres de mentira — el dueño lo pone ORE, el dueño o
      # postgres:gestionar, los roles con postgres:usar, nada desde un puesto, y
      # 503 sin quien decida o sin plano.
      - name: y Postgres se pide por la celda con la potestad o siendo su dueño
        run: bash pruebas-de-fuego/postgres-por-la-celda.sh

      # Y la puerta OIDC, con tokens acunados en el momento. Lo que fija que no
      # fijan las pruebas del crate es el CABLEADO: que el sujeto sale de la
      # cabecera `Authorization` y que un token bien firmado del MISMO realm
      # para otro servicio no entra.
      - name: y la puerta pide un token de verdad
        run: bash pruebas-de-fuego/servidor-oidc.sh

      # ⭐ LA MUDANZA. Corremos una plataforma gestionada, y esto convierte
      # «el cliente puede irse» de promesa en puerta: un arbol producido como
      # lo produce la plataforma tiene que compilar con `env -i` — ni una
      # variable— y sin nombrar nuestra infraestructura ni llevar un secreto.
      #
      # El dia que `ore validate` necesite nuestra base, este paso se pone rojo
      # antes de que nadie lo note en produccion.
      - name: y el cliente puede irse
        run: bash pruebas-de-fuego/la-mudanza.sh

      # ⭐ E1 de la `0022`. La plantilla del inquilino es una INSTANCIA VALIDA
      # —lleva `demo` dentro— y de ahi salen dos comprobaciones que valen mas
      # que un renderizador con marcadores: renderizar `demo` devuelve el
      # fichero byte a byte, y renderizar OTRO nombre no puede dejar ni una
      # mencion del modelo.
      #
      # ⛔ El fallo que caza es el que no se ve al aplicar: un `t-demo` olvidado
      # en un manifiesto de otro cliente no da error — da un `ore-serve` de
      # `acme` clonando el arbol de `demo`. Y ya encontro tres ficheros que
      # llevaban al inquilino dentro sin que nadie lo supiera.
      - name: y la plantilla del inquilino se puede renderizar sin dejar rastro
        run: python3 malla/gen-inquilino.py --comprobar

      # ADR 0060 B1·1: la huella de cada imagen cuadra con el Dockerfile, y cada cambio
      # mueve la de las imágenes que lo llevan y sólo esas.
      - name: y la huella de cada imagen sigue al Dockerfile
        run: |
          python3 ci/huella-de-la-imagen.py --comprobar
          python3 ci/prueba-huella-de-la-imagen.py

      # ADR 0060 B2: la de cada binario ve todo lo que su código lee, y cada cambio mueve
      # la de los binarios que lo llevan y sólo esos.
      - name: y la huella de cada binario sigue a su codigo
        run: |
          python3 ci/huella-de-los-binarios.py --comprobar
          python3 ci/prueba-huella-de-los-binarios.py

      # ADR 0060 A2: cada imagen que la malla cita la protege la regla de limpieza del
      # registro POR SÍ MISMA (etiqueta, paquete o digest), no por dónde esté `main`.
      # El 2026-10-10 eso borró `idp@sha256:39bc…` y tumbó el login.
      - name: y la limpieza del registro protege lo que la malla cita
        run: python3 malla/simular-limpieza.py --comprobar-reglas malla/registro-limpieza.json malla

  # El lago, aparte del plano de control para que corra a la vez (ver arriba).
  plano-el-lago:
    if: ${{ !inputs.ensayo }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: plano
          save-if: false
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-plano-${{ runner.os }}-v1
      - run: cargo build --quiet -p ore-cli -p ore-serve -p ore-store
      # El lago (0031 §10, W3.6b): el swap del puntero por ore-serve con su
      # compare-and-set (semantico y de la forja), el `datasource: lago`, la
      # ficha con la historia de la tabla, y el mantenimiento sobre punteros.
      # Forja pelada, S3 de mentira y ore-store-r2 de escritor.
      - name: el lago
        run: |
          cargo build --quiet -p ore-store
          # ⛔ DuckDB, la de la imagen (`puesto/python/provisto.txt`), no la última:
          #   la 2.0.0 (2026-10-21) cambió los mensajes del parser y el GetView, y
          #   tumbó el lago y el servidor de SQL sin que nada de ORE cambiara.
          python3 -m pip install --quiet pyarrow "$(grep -ix 'duckdb==.*' puesto/python/provisto.txt)" "pyiceberg[pyarrow]"
          bash pruebas-de-fuego/el-lago.sh

  # El puesto con sus tres agentes, aparte para que corra a la vez (ver arriba).
  plano-el-puesto:
    if: ${{ !inputs.ensayo }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: plano
          save-if: false
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-plano-${{ runner.os }}-v1
      - run: cargo build --quiet -p ore-cli -p ore-serve -p ore-store
      # El puesto (0031 W3.1–W3.4): la sesion viva de una persona, con los
      # agentes de verdad al lado (`puesto/python/agente.py`, `puesto/node/
      # agente.mjs`, `puesto/jvm/ore/Agente.java`) y una copia ORECOPY1 en un
      # directorio. pyarrow y pandas escriben esa copia; duckdb (en Python, en
      # Node y por JDBC) es lo que `over()`/`sql()` usan para leerla; en el
      # cluster van dentro de `puesto-python:1`, `puesto-node:1` y `puesto-jvm:1`.
      # Node 24 y un JDK 21: los mismos que las imagenes.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Y write() (W3.6c): desde las tres, por ore-store-r2 contra el S3 de
      # mentira, con el commit por el catalogo REST de ore-serve.
      - name: y una sesion Python, una TS y una Java leen la copia con over() y sql(), y escriben con write()
        run: |
          cargo build --quiet -p ore-store
          python3 -m pip install --quiet pyarrow pandas "$(grep -ix 'duckdb==.*' puesto/python/provisto.txt)" "pyiceberg[pyarrow]" pytest==9.1.1
          bash pruebas-de-fuego/el-puesto.sh
      # 0049 JM5: la media en la JVM, contra el banco de la media: la suite de
      # `conformidad/media` entera (51 casos) y las pruebas del SDK (leer, dentro
      # de un @Transform, escribir, apply() en ficheros y en filas, la galeria),
      # con las tres celdas que genera builds.rs corridas por el kernel del agente.
      # Con el JDK 21 de arriba y los jars de puesto/jvm/jars.txt (JM_LOCAL): en el
      # laboratorio, lo mismo dentro de la imagen puesto-jvm:1 de prod.
      - name: y la media en la JVM pasa la suite de conformidad entera y las del SDK
        env:
          JM_LOCAL: "1"
        run: PYTHONUTF8=1 python3 pruebas-de-fuego/la-media-en-java.py
      # 2026-10-12: el build de Java compila el fichero del build y lo que usa —un
      # snippet de JShell que nadie usa no lo tumba—, con los jars de arriba.
      - name: y el build de Java compila solo lo que el transform usa
        run: PYTHONUTF8=1 python3 pruebas-de-fuego/el-build-de-java.py
      # 0053 F6·2: sql() lee el origen en vivo, contra un ore-serve de mentira.
      - name: y sql() lee en vivo lo que el reparto decide
        run: PYTHONUTF8=1 python3 pruebas-de-fuego/la-lectura-en-vivo-en-python.py
      # 0057 B4·3·1: ore-motor, el motor SQL de la celda sin puesto: calcula lo
      # que ore-serve le da (fuentes decididas, Arrow en vivo), solo lee.
      - name: y ore-motor calcula lo que le dan, sin identidad
        run: PYTHONUTF8=1 python3 pruebas-de-fuego/el-motor.py


  # ⭐ LOS VERBOS DEL PLANO DE IDENTIDAD. Lo mismo que fijaba el Job
  # `malla/98-los-cuatro-verbos.yaml` (retirado en 0048 con `iam-agente`), pero SIN un cluster que alguien tenga que
  # tener en pie: un control que solo se ejerce cuando alguien se acuerda no es
  # un control, es una costumbre.
  #
  # Y fija una cosa que el Job del cluster NO puede: alli el sujeto es `dueno`,
  # asi que la guarda del rodeo nunca llega a morder. Aqui hay un administrador
  # de verdad intentando otorgar por encima de si mismo.
  los-verbos:
    if: ${{ !inputs.ensayo }}
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: x
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - run: rustup show
      - uses: Swatinem/rust-cache@v2

      # ⛔ ANTES que los verbos: si una migracion no sobrevive a una base con
      #   filas, lo que hagan los verbos encima da igual. Y es el unico paso
      #   que corre las migraciones sobre datos — el resto nace de una base
      #   vacia, que es como se colaron dos fallos de orden el 2026-09-08.
      # ⭐ 0054 I1: lo que converge solo no confunde «no lo sé» con «no existe».
      #   Sin red ni base: la forma prohibida y las tres respuestas.
      - name: converger sin romper
        run: bash pruebas-de-fuego/converger-sin-romper.sh

      - name: y las migraciones aguantan una base con datos
        env:
          PG_URL: postgres://postgres:x@localhost:5432
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: x
        run: bash pruebas-de-fuego/las-migraciones.sh

      - name: los cuatro verbos, sus negativas y el rodeo
        env:
          PG_URL: postgres://postgres:x@localhost:5432
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: x
        run: |
          cargo build --quiet -p ore-iam
          bash pruebas-de-fuego/los-verbos.sh

      # 0058 P4·1: el plano de control de Postgres, con su base de verdad. Una
      #   organización no ve lo de otra; un id por organización; una operación en
      #   curso por proyecto la cierra la base.
      - name: y el plano de control de Postgres separa las organizaciones
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: x
          ORE_POSTGRES_PRUEBA_URL: postgres://postgres:x@localhost:5432/ore_postgres_prueba
        run: |
          psql -qc "create database ore_postgres_prueba"
          cargo test --quiet -p ore-postgres --test contrato

      # ⭐ EL CUSTODIO. Con un cliente de KMS de mentira, y se dice por que no
      # debilita nada: el cerrojo de la llave —que un inquilino no pueda usar la
      # de otro— esta probado contra Google en `malla/99-el-cerrojo-de-la-llave`,
      # con IAM de verdad. Repetirlo aqui exigiria credenciales de nube en CI.
      #
      # Lo que esto fija es TODO LO DEMAS: quien emite, quien resuelve, que «no
      # existe» y «no es tuyo» den el mismo error, que el valor no salga por
      # ninguna otra puerta, y que abrir deje huella sin el valor dentro.
      - name: y el custodio guarda, abre a quien puede, y no filtra el valor
        env:
          PG_URL: postgres://postgres:x@localhost:5432
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: x
        run: |
          cargo build --quiet -p ore-cofre
          bash pruebas-de-fuego/el-cofre.sh

  fuentes-reales:
    if: ${{ !inputs.ensayo }}
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: x
          POSTGRES_DB: hr
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - run: rustup show
      - uses: Swatinem/rust-cache@v2

      # Seis escenarios que se midieron A MANO al construir L2: el driver, el
      # solo-lectura, el índice determinista, el refresco que sustituye en vez de
      # sumar, una consulta que cruza dos familias de fuente y el estado
      # degradado. Cada uno era un `echo` en una terminal; aquí es una aserción.
      - name: contra un PostgreSQL de verdad
        env:
          PG_URL: postgres://postgres:x@localhost:5432/hr
        run: |
          cargo build --quiet -p ore-read-postgres -p ore-read-jsonl
          export PATH="$PWD/target/debug:$PATH"
          bash pruebas-de-fuego/fuentes-reales.sh

      # La invocacion (0029 F4a I1+I2): la copia se relee por su nombre, cada
      # fila va al modelo por `ore-invoke`, el resultado se sella en el mismo
      # almacen y el informe queda en el arbol. Sin red de verdad: un S3 y un
      # vLLM de mentira en Python.
      - name: y una funcion de lectura lee la copia, llama al modelo y devuelve
        run: |
          cargo build --quiet -p ore-cli -p ore-store -p ore-invoke
          bash pruebas-de-fuego/la-invocacion-se-decide.sh
      # W1 (0030): `ore ask` contesta la pregunta de una vista sobre la copia,
      # en la celda y sin abrir el origen: el View Matcher decide que copia
      # sirve (la suya, o una vecina con compensacion), `ore-store-r2 leer` la
      # trae, la hoja la tipa y el recomputo la ejecuta. Contra el mismo S3 de
      # mentira.
      - name: y una vista se contesta sobre la copia, sin abrir el origen (y servida)
        run: |
          cargo build --quiet -p ore-serve
          bash pruebas-de-fuego/la-pregunta-se-contesta.sh

  # ⭐ EL KIT DE CONFORMIDAD DE LOS CONECTORES (ADR 0053 F2·1): los 14 casos de
  # `docs/federation.md` §2 contra cada conector, sobre una semilla que el kit
  # carga en un Postgres de verdad y en el S3 de mentira.
  #
  # Un conector v2 lleva `--exige todos`: si deja de cumplir el contrato, el
  # trabajo falla y, como está en las `needs` de `imagen`, no se despliega.
  # Uno que aún no es v2 corre en línea de base: dice cómo está (en el
  # resumen del trabajo) y no falla.
  #
  # BigQuery, de la cinta que grabó la pasada de verdad (F2·3).
  conectores:
    if: ${{ !inputs.ensayo }}
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: x
          POSTGRES_DB: kit
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # ADR 0069 M3: un MongoDB suelto, con su banco `kit` y la vista lenta (un
      # `$function` de JS: el servidor tiene que tener el JS encendido, que es lo
      # que trae la imagen).
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # ADR 0070 M3: un Cassandra suelto, sin autenticación, con su banco `kit`. Tarda
      # ~40 s en aceptar conexiones (de ahí el `--health-start-period`) y pide ~1,7 GB:
      # el montón se acota para que quepa en el runner junto al banco que lo carga.
      cassandra:
        image: cassandra:5
        env:
          MAX_HEAP_SIZE: 1G
          HEAP_NEWSIZE: 256M
        ports: ['9042:9042']
        options: >-
          --health-cmd "cqlsh -e 'select now() from system.local'"
          --health-start-period 60s
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --quiet -p ore-conector-kit -p ore-read-postgres -p ore-read-s3 -p ore-read-gcs -p ore-read-azure -p ore-read-sftp -p ore-read-sharepoint -p ore-federation

      - name: el conector de Postgres
        env:
          PG_URL: postgres://postgres:x@localhost:5432/kit
        run: |
          echo "### ore-read-postgres" >> "$GITHUB_STEP_SUMMARY"
          target/debug/ore-kit --conector target/debug/ore-read-postgres --banco postgres \
            --exige todos | tee -a "$GITHUB_STEP_SUMMARY"

      # ⭐ 0053 F3·2: la pasarela de verdad delante del conector —el mismo
      #   flujo, caliente, el presupuesto, la cola, cancelar, la credencial, el
      #   ocioso y los errores—. Contra Postgres, que tiene algo lento que
      #   cortar y sesiones que contar.
      - name: la pasarela, con Postgres detrás
        env:
          PG_URL: postgres://postgres:x@localhost:5432/kit
        run: |
          echo "### ore-federation · postgres" >> "$GITHUB_STEP_SUMMARY"
          target/debug/ore-kit --conector target/debug/ore-read-postgres --banco postgres \
            --pasarela target/debug/ore-federation --exige todos | tee -a "$GITHUB_STEP_SUMMARY"

      # ⭐ 0053 F4: el coordinador. El plan sale del árbol (`ore federate`, sin
      #   red) y la lectura de punta a punta: `ore-serve` decide, la pasarela
      #   lee, Postgres detrás; el interruptor de la fuente en main, el coste,
      #   el empuje, la anotación sin valores y la clave que no sale.
      - name: el coordinador, de punta a punta
        env:
          PG_URL: postgres://postgres:x@localhost:5432
        run: |
          cargo build --quiet -p ore-cli -p ore-serve
          ORE=target/debug/ore bash pruebas-de-fuego/el-plan-federado.sh
          SERVE=target/debug/ore-serve ORE=target/debug/ore FED=target/debug/ore-federation \
            bash pruebas-de-fuego/el-coordinador.sh

      # ⭐ 0053 F7·2: la copia de una vista que lee del origen. El Job lee cada
      #   tabla con lo que el reparto empuja (un rango, sin tope en vivo) y
      #   DuckDB la calcula; casa con lo que dice Postgres.
      - name: la copia desde el origen
        env:
          PG_URL: postgres://postgres:x@localhost:5432
        run: |
          python3 -m pip install --quiet "$(grep -ix 'duckdb==.*' puesto/python/provisto.txt)" pyarrow
          # 0053 F9·1: el listado de un ObjectTable, en vivo por la pasarela.
          FED=target/debug/ore-federation ORE=target/debug/ore bash pruebas-de-fuego/el-listado-en-vivo.sh
          # 0053 F8·3: la pasarela (ya construida) y el almacén, para leer por ella.
          cargo build --quiet -p ore-store
          ORE=target/debug/ore bash pruebas-de-fuego/la-copia-desde-el-origen.sh
          # 0057 B4·1: una foreign database se lee desde Python —celdas y `.sql`—
          #   con el rango entero (T/M/G), y lo que no se puede se niega bien.
          python3 -m pip install --quiet pyyaml pandas "pyiceberg[pyarrow]"
          ORE_BIN=target/debug bash pruebas-de-fuego/la-foranea-se-lee.sh

      # ADR 0069 M3: MongoDB. Los tipos de la tabla viajan en la petición (`tipos`)
      #   porque BSON no los lleva: un `Date` es un instante en milisegundos. El 9 y
      #   el 14 no aplican (no hay SQL que escriba; `estimar` no se declara). El 10
      #   —`SIGTERM` corta la operación en el servidor, con `killOp`— está medido por
      #   `servir` y falta correrlo aquí: se añade a `--exige` al verlo en verde.
      - name: el conector de MongoDB
        env:
          MONGO_KIT_URL: mongodb://localhost:27017/?directConnection=true
        run: |
          cargo build --quiet -p ore-conector-kit --features mongodb -p ore-read-mongodb
          echo "### ore-read-mongodb" >> "$GITHUB_STEP_SUMMARY"
          target/debug/ore-kit --conector target/debug/ore-read-mongodb --banco mongodb             --exige 1,2,3,4,5,6,7,8,11,12,13 | tee -a "$GITHUB_STEP_SUMMARY"

      # …y la pasarela de verdad delante (medido en local: 8 pasan, 2 no aplican).
      - name: la pasarela, con MongoDB detrás
        env:
          MONGO_KIT_URL: mongodb://localhost:27017/?directConnection=true
        run: |
          cargo build --quiet -p ore-federation
          echo "### ore-federation · mongodb" >> "$GITHUB_STEP_SUMMARY"
          target/debug/ore-kit --conector target/debug/ore-read-mongodb --banco mongodb             --pasarela target/debug/ore-federation --exige todos | tee -a "$GITHUB_STEP_SUMMARY"

      # ADR 0070 M3: Cassandra. Sin autenticación (los casos 11 y 12 no tienen una
      #   segunda credencial ni una mala: salen sin ellas) y con `contacto=solo`: el nodo
      #   anuncia la dirección de su contenedor, y el driver usaría esa. La semilla son
      #   10⁶ filas: tarda unos minutos la primera vez y la segunda la encuentra hecha. El
      #   9 y el 14 no aplican (no hay SQL que escriba; `estimar` no se declara) y el 10
      #   tampoco (no hay `killOp` ni nada lento que cancelar).
      - name: el conector de Cassandra
        env:
          CASSANDRA_KIT_URL: cassandra://localhost:9042/kit?contacto=solo
        run: |
          cargo build --quiet -p ore-conector-kit -p ore-read-cassandra --features ore-conector-kit/cassandra
          echo "### ore-read-cassandra" >> "$GITHUB_STEP_SUMMARY"
          target/debug/ore-kit --conector target/debug/ore-read-cassandra --banco cassandra \
            --exige 1,2,3,4,5,6,7,8,11,12,13 | tee -a "$GITHUB_STEP_SUMMARY"

      # …y la pasarela de verdad delante (medido en local: 9 pasan, 1 no aplica).
      - name: la pasarela, con Cassandra detrás
        env:
          CASSANDRA_KIT_URL: cassandra://localhost:9042/kit?contacto=solo
        run: |
          echo "### ore-federation · cassandra" >> "$GITHUB_STEP_SUMMARY"
          target/debug/ore-kit --conector target/debug/ore-read-cassandra --banco cassandra \
            --pasarela target/debug/ore-federation --exige todos | tee -a "$GITHUB_STEP_SUMMARY"

      # ADR 0071 M4: Phoenix. No hay imagen oficial con el Phoenix Query Server: el laboratorio se
      #   construye de los binarios de Apache (`pruebas-de-fuego/phoenix/Dockerfile`; en el CI, del
      #   archivo de Apache y no del espejo que se usa en local). HBase + Phoenix + PQS tardan ~1 min en
      #   responder. La semilla la carga el propio banco (`ore-kit`, por el PQS): las 10⁶ filas se
      #   duplican dentro de Phoenix (~70 s la primera vez). El 9, el 10 y el 14 no aplican: no hay SQL
      #   que escriba, el PQS no dice sus consultas vivas y `estimar` no se declara (`EXPLAIN` da el
      #   número de la tabla y no el del filtro).
      - name: el laboratorio de Phoenix
        run: |
          docker build -t ore-phoenix-lab --build-arg ESPEJO=https://archive.apache.org/dist pruebas-de-fuego/phoenix
          docker run -d --name phx -p 8765:8765 ore-phoenix-lab
          for i in $(seq 1 90); do
            c=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/x-google-protobuf' --data-binary '' http://127.0.0.1:8765/ || true)
            [ "$c" != "000" ] && break
            sleep 5
          done
          sleep 30

      - name: el conector de Phoenix
        env:
          PHOENIX_KIT_URL: phoenix://localhost:8765
        run: |
          cargo build --quiet -p ore-conector-kit -p ore-read-phoenix --features ore-conector-kit/phoenix
          echo "### ore-read-phoenix" >> "$GITHUB_STEP_SUMMARY"
          target/debug/ore-kit --conector target/debug/ore-read-phoenix --banco phoenix \
            --exige 1,2,3,4,5,6,7,8,11,12,13 | tee -a "$GITHUB_STEP_SUMMARY"

      # …y la pasarela de verdad delante (medido en local: 8 pasan, 2 no aplican).
      - name: la pasarela, con Phoenix detrás
        env:
          PHOENIX_KIT_URL: phoenix://localhost:8765
        run: |
          echo "### ore-federation · phoenix" >> "$GITHUB_STEP_SUMMARY"
          target/debug/ore-kit --conector target/debug/ore-read-phoenix --banco phoenix \
            --pasarela target/debug/ore-federation --exige todos | tee -a "$GITHUB_STEP_SUMMARY"

      # ADR 0072 N7: HBase, por su protocolo nativo (ZooKeeper y el RPC a los RegionServers; sin Phoenix). El
      #   laboratorio es un HBase independiente (`pruebas-de-fuego/hbase/Dockerfile`; en el CI, del archivo de Apache)
      #   que se anuncia como 127.0.0.1 y publica los puertos con el mismo numero. La semilla la carga el propio banco,
      #   por la pasarela REST del laboratorio (10⁶ filas). El 9, el 10 y el 14 no aplican: no hay SQL que escriba, no
      #   hay nada lento que cancelar y `estimar` no se declara. Se para antes el de Phoenix: dos HBase no caben.
      - name: el laboratorio de HBase
        run: |
          docker rm -f phx >/dev/null 2>&1 || true
          docker build -t ore-hbase-lab --build-arg ESPEJO=https://archive.apache.org/dist pruebas-de-fuego/hbase
          docker run -d --name hb -p 2181:2181 -p 16000:16000 -p 16020:16020 -p 16030:16030 -p 8080:8080 -p 9090:9090 ore-hbase-lab
          for i in $(seq 1 60); do
            c=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/version || true)
            [ "$c" = "200" ] && break
            sleep 5
          done
          sleep 20

      - name: el conector de HBase
        env:
          HBASE_KIT_URL: hbase://127.0.0.1:2181?simple=acepto
          HBASE_KIT_REST: http://127.0.0.1:8080
        run: |
          cargo build --quiet -p ore-conector-kit -p ore-read-hbase --features ore-conector-kit/hbase
          echo "### ore-read-hbase" >> "$GITHUB_STEP_SUMMARY"
          target/debug/ore-kit --conector target/debug/ore-read-hbase --banco hbase \
            --exige 1,2,3,4,5,6,7,8,11,12,13 | tee -a "$GITHUB_STEP_SUMMARY"

      # …y la pasarela de verdad delante (medido en local: 8 pasan, 2 no aplican).
      - name: la pasarela, con HBase detrás
        env:
          HBASE_KIT_URL: hbase://127.0.0.1:2181?simple=acepto
          HBASE_KIT_REST: http://127.0.0.1:8080
        run: |
          echo "### ore-federation · hbase" >> "$GITHUB_STEP_SUMMARY"
          target/debug/ore-kit --conector target/debug/ore-read-hbase --banco hbase \
            --pasarela target/debug/ore-federation --exige todos | tee -a "$GITHUB_STEP_SUMMARY"

      - name: el conector de S3
        run: |
          python3 pruebas-de-fuego/de-mentira.py s3 0 > s3.log 2>&1 &
          for i in $(seq 1 50); do grep -q listo s3.log 2>/dev/null && break; sleep 0.2; done
          export S3_KIT_ENDPOINT="http://127.0.0.1:$(awk '{print $2}' s3.log)" \
                 S3_KIT_CLAVE=de S3_KIT_SECRETO=mentira S3_KIT_DE_MENTIRA=1
          echo "### ore-read-s3" >> "$GITHUB_STEP_SUMMARY"
          target/debug/ore-kit --conector target/debug/ore-read-s3 --banco s3 \
            --exige todos | tee -a "$GITHUB_STEP_SUMMARY"
          echo "### ore-federation · s3" >> "$GITHUB_STEP_SUMMARY"
          target/debug/ore-kit --conector target/debug/ore-read-s3 --banco s3 \
            --pasarela target/debug/ore-federation --exige todos | tee -a "$GITHUB_STEP_SUMMARY"

      # ⭐ ADR 0061 O2·3: GCS, contra `fake-gcs-server` (en memoria: sin
      #   `-backend memory` contesta 500). El emulador no comprueba el token
      #   (`ORE_GCP_TOKEN` cualquiera) y no es de Google, así que el conector
      #   sólo le habla con `ORE_GCS_LABORATORIO=1`.
      - name: el conector de GCS
        env:
          ORE_GCP_TOKEN: falso
          ORE_GCS_LABORATORIO: "1"
        run: |
          docker run -d --name kit-gcs -p 4443:4443 \
            fsouza/fake-gcs-server@sha256:d47b4cf8b87006cab8fbbecfa5f06a2a3c5722e464abddc0d107729663d40ec4 \
            -scheme http -port 4443 -public-host 127.0.0.1:4443 -backend memory
          for i in $(seq 1 50); do curl -sf http://127.0.0.1:4443/storage/v1/b >/dev/null && break; sleep 0.2; done
          export GCS_KIT_ENDPOINT=http://127.0.0.1:4443
          echo "### ore-read-gcs" >> "$GITHUB_STEP_SUMMARY"
          target/debug/ore-kit --conector target/debug/ore-read-gcs --banco gcs \
            --exige todos | tee -a "$GITHUB_STEP_SUMMARY"
          echo "### ore-federation · gcs" >> "$GITHUB_STEP_SUMMARY"
          target/debug/ore-kit --conector target/debug/ore-read-gcs --banco gcs \
            --pasarela target/debug/ore-federation --exige todos | tee -a "$GITHUB_STEP_SUMMARY"

      # ⭐ ADR 0061 O3·3: Azure, contra Azurite. Por HTTPS con `--oauth basic`
      #   (un Bearer: Azurite mira emisor, audiencia y fechas, no la firma), con
      #   un certificado de un día en el almacén del sistema; el conector sólo
      #   le habla con `ORE_AZURE_LABORATORIO=1`.
      - name: el conector de Azure
        env:
          ORE_AZURE_LABORATORIO: "1"
        run: |
          C="$RUNNER_TEMP/azurite"; mkdir -p "$C"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$C/k.pem" -out "$C/c.pem" -days 1 \
            -subj /CN=localhost -addext subjectAltName=DNS:localhost 2>/dev/null
          sudo cp "$C/c.pem" /usr/local/share/ca-certificates/azurite.crt && sudo update-ca-certificates >/dev/null
          docker run -d --name kit-azure -p 10000:10000 -v "$C:/c" \
            mcr.microsoft.com/azure-storage/azurite@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5 \
            azurite-blob --blobHost 0.0.0.0 --loose --oauth basic --cert /c/c.pem --key /c/k.pem
          for i in $(seq 1 50); do curl -s -o /dev/null https://localhost:10000/ && break; sleep 0.2; done
          b64() { base64 -w0 | tr '+/' '-_' | tr -d '='; }
          N=$(date +%s)
          export ORE_AZURE_TOKEN="$(printf '{"alg":"RS256","typ":"JWT"}' | b64).$(printf '{"aud":"https://storage.azure.com","iss":"https://sts.windows.net/ab1f708d-50f6-404c-a006-d71b2ac7a606/","iat":%d,"nbf":%d,"exp":%d,"oid":"00000000-0000-0000-0000-000000000001","tid":"ab1f708d-50f6-404c-a006-d71b2ac7a606"}' $((N-60)) $((N-60)) $((N+3600)) | b64).kit"
          export AZURE_KIT_ENDPOINT=https://localhost:10000
          echo "### ore-read-azure" >> "$GITHUB_STEP_SUMMARY"
          target/debug/ore-kit --conector target/debug/ore-read-azure --banco azure \
            --exige todos | tee -a "$GITHUB_STEP_SUMMARY"
          echo "### ore-federation · azure" >> "$GITHUB_STEP_SUMMARY"
          target/debug/ore-kit --conector target/debug/ore-read-azure --banco azure \
            --pasarela target/debug/ore-federation --exige todos | tee -a "$GITHUB_STEP_SUMMARY"

      # ⭐ ADR 0061 O4·3: SFTP, contra `atmoz/sftp` (OpenSSH de verdad), con una
      #   clave Ed25519 de esta corrida autorizada y la huella del host fijada
      #   en la URL (D-O4). El usuario `ore` y su `ore-kit` los crea atmoz.
      - name: el conector de SFTP
        run: |
          C="$RUNNER_TEMP/sftp"; mkdir -p "$C/pub"
          ssh-keygen -q -t ed25519 -N "" -f "$C/id" && cp "$C/id.pub" "$C/pub/"
          docker run -d --name kit-sftp -p 2222:22 -v "$C/pub:/home/ore/.ssh/keys:ro" \
            atmoz/sftp@sha256:0960390462a4441dbb63698d7c185b76a41ffcee7b78ff4adf275f3e66f9c475 \
            ore::1001:100:ore-kit
          for i in $(seq 1 50); do docker exec kit-sftp test -f /etc/ssh/ssh_host_ed25519_key.pub && break; sleep 0.2; done
          sleep 1
          export SFTP_KIT_HUELLA=$(docker exec kit-sftp ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub | awk '{print $2}')
          export SFTP_KIT_HOST=127.0.0.1 SFTP_KIT_PUERTO=2222 ORE_SFTP_CLAVE="$C/id"
          echo "### ore-read-sftp" >> "$GITHUB_STEP_SUMMARY"
          target/debug/ore-kit --conector target/debug/ore-read-sftp --banco sftp \
            --exige todos | tee -a "$GITHUB_STEP_SUMMARY"
          echo "### ore-federation · sftp" >> "$GITHUB_STEP_SUMMARY"
          target/debug/ore-kit --conector target/debug/ore-read-sftp --banco sftp \
            --pasarela target/debug/ore-federation --exige todos | tee -a "$GITHUB_STEP_SUMMARY"

      # ⭐ ADR 0061 O5·3: SharePoint, contra el Graph de mentira
      #   (`pruebas-de-fuego/graph-de-mentira.py`: no hay emulador de Graph), en
      #   páginas de 2 y con un `429` cada 13 peticiones; el conector sólo le
      #   habla con `ORE_SHAREPOINT_LABORATORIO=1`.
      - name: el conector de SharePoint
        env:
          ORE_SHAREPOINT_LABORATORIO: "1"
          ORE_GRAPH_TOKEN: kit
        run: |
          PAGINA=2 CADA_429=13 GRAPH_TOKEN=kit python3 pruebas-de-fuego/graph-de-mentira.py 8790 8791 > "$RUNNER_TEMP/graph.log" 2>&1 &
          for i in $(seq 1 50); do grep -q listo "$RUNNER_TEMP/graph.log" && break; sleep 0.2; done
          export GRAPH_KIT_ENDPOINT=http://127.0.0.1:8790
          echo "### ore-read-sharepoint" >> "$GITHUB_STEP_SUMMARY"
          target/debug/ore-kit --conector target/debug/ore-read-sharepoint --banco sharepoint \
            --exige todos | tee -a "$GITHUB_STEP_SUMMARY"
          echo "### ore-federation · sharepoint" >> "$GITHUB_STEP_SUMMARY"
          target/debug/ore-kit --conector target/debug/ore-read-sharepoint --banco sharepoint \
            --pasarela target/debug/ore-federation --exige todos | tee -a "$GITHUB_STEP_SUMMARY"
          curl -s http://127.0.0.1:8790/_mentira/cuentas | tee -a "$GITHUB_STEP_SUMMARY" | grep -q '"con_token": 0'

      # BigQuery, de su cinta (`crates/ore-conector-kit/cintas/bigquery`):
      # lo que el BigQuery de verdad contestó, sin red ni token ni coste. Por
      # consulta: la Storage Read y el caso 7 (10⁶ filas) se prueban en la
      # pasada de verdad, que es la que graba la cinta (ADR 0053 F2·3).
      - name: el conector de BigQuery
        env:
          BQ_KIT_PROYECTO: project-8853a180-450d-47be-b83
          ORE_BQ_CINTA: crates/ore-conector-kit/cintas/bigquery
          ORE_BQ_CINTA_MODO: reproducir
        run: |
          cargo build --quiet -p ore-read-bigquery
          echo "### ore-read-bigquery (cinta)" >> "$GITHUB_STEP_SUMMARY"
          target/debug/ore-kit --conector target/debug/ore-read-bigquery --banco bigquery \
            --casos 1,2,3,4,5,6,8,9,10,11,12,13,14 --exige todos | tee -a "$GITHUB_STEP_SUMMARY"

  # ══════════════════════════════════════════════════════════════════════════
  # LA IMAGEN — construir y desplegar deja de ser una costumbre
  #
  # ── ⛔ Qué pasaba antes ────────────────────────────────────────────────────
  #
  #   CI no construía imágenes. Cada `:main` la subía alguien a mano, así que
  #   entre un `git push` verde y lo que estaba corriendo podía haber
  #   cualquier cosa — y el 2026-09-08 hubo **un pánico desplegado veinte
  #   minutos**, construido de un árbol que aún no había pasado por aquí.
  #
  # ── ⭐⭐ Y el orden es la mitad del arreglo ───────────────────────────────
  #
  #   `needs` con TODOS los trabajos de prueba. Desplegar antes de que pasen
  #   sería exactamente lo de antes con más pasos: lo que hace que esto sirva
  #   no es que CI construya, es que **nada que un manifiesto nombre pueda
  #   salir de algo rojo**.
  #
  # ── ⭐ Construir sí va en paralelo con las pruebas (2026-09-30) ──────────
  #
  #   `construir` arranca con ellas y deja cada imagen SÓLO con la etiqueta
  #   del commit (`:<sha>`), que ningún manifiesto nombra. Las que se nombran
  #   —`:main`, y `:1` en los puestos— las mueve `imagen`, que sí espera a las
  #   seis pruebas. Una imagen de un commit rojo existe, pero nadie la corre.
  #   Medido: las pruebas eran 4,6 min del camino crítico, en serie antes de
  #   una construcción de ~19.
  #
  # ── ⛔ Sin llaves de larga vida ───────────────────────────────────────────
  #
  #   Federación con el OIDC de GitHub: `google-github-actions/auth` cambia el
  #   token del `job` por uno de Google. El proveedor tiene una condición
  #   —`assertion.repository == 'describeloai/ore'`— y la cuenta de servicio
  #   está atada al `principalSet` de ESE repositorio. No hay ningún JSON de
  #   credenciales en ningún secreto, y por eso no hay nada que rotar ni que
  #   se pueda filtrar en un log.
  #
  # ⚠️ `id-token: write` es lo que permite pedir ese token. Sin ese permiso el
  #   paso falla con un mensaje que no menciona OIDC.
  # ══════════════════════════════════════════════════════════════════════════
  construir:
    # ⛔ Sólo `main`, y sólo empujando. Un PR de un fork no construye nada. Y el
    #   ensayo (`workflow_dispatch`, ADR 0060 B2): construye sin etiquetar ni desplegar.
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || inputs.ensayo
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    # B1 (ADR 0060): el registro, en la MISMA región que el clúster. Aquí sólo
    # se SUBE (gratis) y se pregunta por etiquetas (metadato).
    env:
      REGISTRO: europe-west1-docker.pkg.dev/project-8853a180-450d-47be-b83/ore
    # Lo que corre en los Deployment que CI releva: la huella de SU imagen
    # (ADR 0060 B2; hasta entonces, una clave para todos). Si es la que ya
    # tienen, no se relevan (`imagen`): tocar `ore-serve` no releva `ore-cofre`.
    outputs:
      imagenes: ${{ steps.plan.outputs.imagenes }}
    steps:
      # ⭐ Sólo la punta de `main`. Un commit que ya tiene otro detrás no se
      #   construye ni se despliega: lo hace el de detrás, con lo suyo dentro.
      #   (Si el de detrás sale rojo no se despliega nada, igual que antes,
      #   cuando lo cancelaba.) Y al desplegar se vuelve a preguntar: un
      #   despliegue viejo que llega tarde no pisa uno nuevo.
      - name: y solo si sigue siendo la punta de main
        id: punta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.ensayo == true }}" = true ]; then
            echo "sigue=si" >> "$GITHUB_OUTPUT"; echo "  ensayo de ${GITHUB_REF_NAME}: se construye, no se etiqueta ni se despliega"; exit 0
          fi
          PUNTA=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          SIGUE=no
          if [ "$PUNTA" = "$GITHUB_SHA" ]; then SIGUE=si
          else
            # G1 (0060): si lo que hay detras es solo papel, `paths-ignore` no
            #   lo corre, y la punta que cuenta sigue siendo esta. Si no se
            #   puede saber (mas de 300 ficheros, historia reescrita), no.
            LISTA=$(gh api "repos/${{ github.repository }}/compare/$GITHUB_SHA...$PUNTA" \
              --jq 'select(.status == "ahead" and (.files | length) < 300) | .files[].filename') || LISTA=""
            if [ -n "$LISTA" ]; then
              SIGUE=si
              set -f   # las globs de SOLO_PAPEL son para `case`, no para el disco
              while IFS= read -r F; do
                P=no
                for G in $SOLO_PAPEL; do case "$F" in $G) P=si; break;; esac; done
                if [ "$P" = no ]; then SIGUE=no; break; fi
              done <<< "$LISTA"
              set +f
            fi
          fi
          echo "sigue=$SIGUE" >> "$GITHUB_OUTPUT"
          if [ "$SIGUE" = no ]; then echo "  main ya va por ${PUNTA::12}: lo hace ese"
          elif [ "$PUNTA" != "$GITHUB_SHA" ]; then echo "  hasta ${PUNTA::12} solo hay papel: sigue siendo este"; fi

      - uses: actions/checkout@v5
        if: steps.punta.outputs.sigue == 'si'
        with:
          submodules: true

      - uses: google-github-actions/auth@v2
        if: steps.punta.outputs.sigue == 'si'
        with:
          project_id: project-8853a180-450d-47be-b83
          workload_identity_provider: projects/339497864493/locations/global/workloadIdentityPools/github/providers/describeloai
          service_account: ore-ci@project-8853a180-450d-47be-b83.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2
        if: steps.punta.outputs.sigue == 'si'

      # ⭐ UNA HUELLA POR BINARIO (ADR 0060 B2, `ci/huella-de-los-binarios.py`): la de cada
      #   uno, de su paquete y de los del workspace de los que depende. Con ellas, la de
      #   cada imagen (sólo las de lo que copia) y lo que hay que compilar. `--comprobar`
      #   para aquí si el código incluye algo que la huella no ve.
      - name: la huella de cada binario
        id: huella
        if: steps.punta.outputs.sigue == 'si'
        run: |
          python3 ci/huella-de-los-binarios.py --comprobar
          python3 ci/huella-de-los-binarios.py --mapa > /tmp/binarios.json
          python3 ci/huella-de-los-binarios.py --todas | sed 's/^/  /'

      # ⭐ B1 (ADR 0060, 2026-10-10): UNA IMAGEN POR HUELLA, EN ESTE RUNNER.
      #   Antes, esto era `gcloud builds submit`: catorce imágenes rehechas y
      #   subidas en `E2_HIGHCPU_8` en cada commit (~19 min; ~€85 en ocho días
      #   de octubre). Ahora, por cada imagen (`ci/huella-de-la-imagen.py`):
      #     · si el registro ya tiene `<imagen>:h-<huella>`, se le añade la
      #       etiqueta del commit —mover un puntero, sin una capa—;
      #     · si no, se construye aquí y se sube con las dos.
      #
      # ⛔ NADA SE BAJA DE ARTIFACT REGISTRY: bajar del registro a internet se
      #   cobra, subir no. Lo que se le pregunta —si una etiqueta existe— es
      #   metadato.
      - name: las huellas de las imagenes, y lo que el registro ya tiene
        id: plan
        if: steps.punta.outputs.sigue == 'si'
        run: |
          python3 ci/huella-de-la-imagen.py --binarios /tmp/binarios.json --todas > /tmp/huellas.txt
          : > /tmp/plan.txt
          while read -r ETAPA IMAGEN HUELLA; do
            if gcloud artifacts docker images describe "$REGISTRO/$IMAGEN:h-$HUELLA" --format='value(image_summary.digest)' >/dev/null 2>&1; then
              echo "$ETAPA $IMAGEN $HUELLA reutilizar" >> /tmp/plan.txt
            else
              echo "$ETAPA $IMAGEN $HUELLA construir" >> /tmp/plan.txt
            fi
          done < /tmp/huellas.txt
          sed 's/^/  /' /tmp/plan.txt
          # Los binarios que copian las que se construyen: sólo ésos hacen falta.
          NECESARIOS=$(for E in $(awk '$4=="construir" {print $1}' /tmp/plan.txt); do
                         python3 ci/huella-de-la-imagen.py --copia "$E"; done | tr ' ' '\n' | sort -u | xargs)
          echo "necesarios=$NECESARIOS" >> "$GITHUB_OUTPUT"
          echo "  binarios que hacen falta: ${NECESARIOS:-ninguno}"
          # H4: la huella de cada imagen, para el relevo (`imagen`).
          echo "imagenes=$(awk '{printf "%s%s=%s", (NR>1?",":""), $2, $3}' /tmp/huellas.txt)" >> "$GITHUB_OUTPUT"

      # Lo que el runner trae y aquí no se usa (B1·0: de 86 a 110 GB libres). EN
      # SEGUNDO PLANO (B2): eran 133 s esperando a `rm` antes de empezar nada.
      - name: el disco, en segundo plano (si hacen falta binarios)
        if: steps.plan.outputs.necesarios != ''
        run: |
          df -h / | tail -1 | awk '{print "  libre al empezar: " $4}'
          nohup sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                            /opt/hostedtoolcache/CodeQL /usr/local/share/boost >/dev/null 2>&1 &

      # ⭐ La caché de los binarios es UNA entrada, la más reciente (`restore-keys`), con
      #   un manifiesto (`.huellas.json`) de la huella de cada binario que trae. Se
      #   compila sólo lo que falta o no casa; luego se guarda con lo de ahora.
      - name: los binarios, de la cache de GitHub
        if: steps.plan.outputs.necesarios != ''
        uses: actions/cache/restore@v4
        with:
          path: .binarios
          key: ore-binarios-b2-${{ github.sha }}
          restore-keys: ore-binarios-b2-

      - name: los que faltan
        id: faltan
        if: steps.plan.outputs.necesarios != ''
        run: |
          mkdir -p .binarios
          FALTAN=$(python3 ci/huella-de-los-binarios.py --faltan /tmp/binarios.json .binarios "${{ steps.plan.outputs.necesarios }}")
          echo "faltan=$FALTAN" >> "$GITHUB_OUTPUT"
          echo "  se compilan: ${FALTAN:-ninguno}"

      - name: la receta de las dependencias (si hay que compilar)
        id: deps
        if: steps.faltan.outputs.faltan != ''
        run: |
          docker build -q --target receta -t receta . >/dev/null
          D=$({ docker run --rm receta cat /receta.json
                awk '/^FROM rust:.* AS herramientas$/ {p=1} /^FROM deps AS build$/ {p=0} p' Dockerfile
                cat ci/compilar-binarios.sh rust-toolchain.toml; } | sha256sum | cut -c1-16)
          echo "huella=$D" >> "$GITHUB_OUTPUT"

      - name: las dependencias, de la cache de GitHub
        if: steps.deps.outputs.huella
        uses: actions/cache@v4
        with:
          path: /tmp/deps.tar.zst
          key: ore-deps-${{ steps.deps.outputs.huella }}

      # El guion acaba arrancando cada servidor que compila: uno que muere no se publica.
      - name: los binarios que faltan, compilados
        if: steps.faltan.outputs.faltan != ''
        run: |
          if [ -f /tmp/deps.tar.zst ]; then
            zstd -dc /tmp/deps.tar.zst | docker load -q
          else
            docker build -q --target deps -t ore-deps:local . >/dev/null
            docker save ore-deps:local | zstd -T0 -3 -q -o /tmp/deps.tar.zst
          fi
          rm -rf /tmp/nuevos && mkdir -p /tmp/nuevos
          docker run --rm -v "$PWD:/src" -v /tmp/nuevos:/nuevos -w /src -e SALIDA=/nuevos \
            -e BINARIOS="${{ steps.faltan.outputs.faltan }}" \
            ore-deps:local sh ci/compilar-binarios.sh
          sudo chown -R "$(id -u):$(id -g)" /tmp/nuevos
          cp /tmp/nuevos/* .binarios/
          python3 ci/huella-de-los-binarios.py --apuntar /tmp/binarios.json .binarios "${{ steps.faltan.outputs.faltan }}"
          df -h / | tail -1 | awk '{print "  libre al acabar: " $4}'

      - name: los binarios, a la cache de GitHub
        if: steps.faltan.outputs.faltan != ''
        uses: actions/cache/save@v4
        with:
          path: .binarios
          key: ore-binarios-b2-${{ github.sha }}-${{ github.run_attempt }}

      - name: los binarios, en una imagen para el Dockerfile
        if: steps.plan.outputs.necesarios != ''
        run: printf 'FROM scratch\nCOPY . /b/\n' | docker build -q -t ore-binarios:local -f - .binarios >/dev/null

      # ⭐ 0064: el frontend de notebooks (repo `marimo-frontend`) sólo si hay que
      #   CONSTRUIR `puesto-python-notebooks` (si se reutiliza, ni se mira). El
      #   commit está fijado en `ci/marimo-frontend.ref` —y entra en la huella de
      #   esa imagen—. Se construye como imagen local y `publicar` la nombra con
      #   `--build-arg MARIMO_FRONTEND`, como hace con `ore-binarios:local`.
      #   ⚠️ El repo es privado: `MARIMO_FRONTEND_TOKEN` (un PAT o un deploy
      #   token con lectura de ese repo) tiene que existir en los secretos.
      - name: el frontend de notebooks, si esa imagen se construye
        id: nbfront
        if: steps.punta.outputs.sigue == 'si'
        run: |
          if grep -q '^puesto-python-notebooks .* construir$' /tmp/plan.txt; then
            echo "ref=$(tr -d '[:space:]' < ci/marimo-frontend.ref)" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.nbfront.outputs.ref
        with:
          repository: describeloai/marimo-frontend
          ref: ${{ steps.nbfront.outputs.ref }}
          token: ${{ secrets.MARIMO_FRONTEND_TOKEN }}
          path: .marimo-frontend

      - name: el frontend de notebooks, construido
        if: steps.nbfront.outputs.ref
        run: docker build -q -t marimo-frontend:local .marimo-frontend >/dev/null

      - name: las imagenes, cada una por su huella, con la etiqueta del commit
        if: steps.punta.outputs.sigue == 'si'
        run: |
          # En un ensayo (`workflow_dispatch`), sólo `h-<huella>`: ninguna etiqueta de commit.
          ENSAYO=${{ inputs.ensayo == true }}
          ETIQUETA=${GITHUB_SHA::12}
          gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet >/dev/null 2>&1
          publicar() {
            local ETAPA=$1 IMAGEN=$2 HUELLA=$3 QUE=$4 ARGS=""
            if [ "$QUE" = reutilizar ]; then
              # ⚠️ Por el API del REGISTRO, como el job `imagen`: `artifacts docker
              #   tags add` borra y crea, y `ore-ci` no tiene `tags.delete`.
              [ "$ENSAYO" = true ] || gcloud container images add-tag "$REGISTRO/$IMAGEN:h-$HUELLA" "$REGISTRO/$IMAGEN:$ETIQUETA" --quiet >/dev/null
              echo "  $IMAGEN: reutilizada (h-$HUELLA)"
            else
              # Sólo si hay binarios locales se nombran: si no, ninguna de las que
              # se construyen los copia (lo dijo el plan).
              docker image inspect ore-binarios:local >/dev/null 2>&1 && ARGS="--build-arg BINARIOS=ore-binarios:local"
              [ "$ETAPA" = puesto-python-notebooks ] && docker image inspect marimo-frontend:local >/dev/null 2>&1                 && ARGS="$ARGS --build-arg MARIMO_FRONTEND=marimo-frontend:local"
              docker build -q --target "$ETAPA" $ARGS \
                -t "$REGISTRO/$IMAGEN:h-$HUELLA" -t "$REGISTRO/$IMAGEN:$ETIQUETA" . >/tmp/log-$ETAPA.txt 2>&1 \
                || { tail -30 /tmp/log-$ETAPA.txt; return 1; }
              docker push -q "$REGISTRO/$IMAGEN:h-$HUELLA" >/dev/null
              [ "$ENSAYO" = true ] || docker push -q "$REGISTRO/$IMAGEN:$ETIQUETA" >/dev/null
              echo "  $IMAGEN: construida y subida (h-$HUELLA)"
            fi
          }
          export -f publicar
          export ETIQUETA ENSAYO
          xargs -P 3 -L 1 bash -c 'publicar "$@"' _ < /tmp/plan.txt

  imagen:
    # ⛔ Sólo `main`, y sólo empujando. Un PR de un fork no despliega nada.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # ⛔ TODOS. Esperar a tres de seis seria elegir cuales pueden estar rojos.
    needs: [suite, graphql, descubrimiento, plano-de-control, plano-el-lago, plano-el-puesto, los-verbos, fuentes-reales, conectores, hbase-kerberos, construir]
    # Un despliegue a la vez, y el que espera es el más nuevo: GitHub deja uno
    # corriendo y uno pendiente, y un pendiente nuevo reemplaza al anterior.
    concurrency:
      group: desplegar-main
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      # ⭐ Sólo la punta de `main`. Un commit que ya tiene otro detrás no se
      #   construye ni se despliega: lo hace el de detrás, con lo suyo dentro.
      #   (Si el de detrás sale rojo no se despliega nada, igual que antes,
      #   cuando lo cancelaba.) Y al desplegar se vuelve a preguntar: un
      #   despliegue viejo que llega tarde no pisa uno nuevo.
      - name: y solo si sigue siendo la punta de main
        id: punta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PUNTA=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          SIGUE=no
          if [ "$PUNTA" = "$GITHUB_SHA" ]; then SIGUE=si
          else
            # G1 (0060): si lo que hay detras es solo papel, `paths-ignore` no
            #   lo corre, y la punta que cuenta sigue siendo esta. Si no se
            #   puede saber (mas de 300 ficheros, historia reescrita), no.
            LISTA=$(gh api "repos/${{ github.repository }}/compare/$GITHUB_SHA...$PUNTA" \
              --jq 'select(.status == "ahead" and (.files | length) < 300) | .files[].filename') || LISTA=""
            if [ -n "$LISTA" ]; then
              SIGUE=si
              set -f   # las globs de SOLO_PAPEL son para `case`, no para el disco
              while IFS= read -r F; do
                P=no
                for G in $SOLO_PAPEL; do case "$F" in $G) P=si; break;; esac; done
                if [ "$P" = no ]; then SIGUE=no; break; fi
              done <<< "$LISTA"
              set +f
            fi
          fi
          echo "sigue=$SIGUE" >> "$GITHUB_OUTPUT"
          if [ "$SIGUE" = no ]; then echo "  main ya va por ${PUNTA::12}: lo hace ese"
          elif [ "$PUNTA" != "$GITHUB_SHA" ]; then echo "  hasta ${PUNTA::12} solo hay papel: sigue siendo este"; fi

      - uses: google-github-actions/auth@v2
        if: steps.punta.outputs.sigue == 'si'
        with:
          project_id: project-8853a180-450d-47be-b83
          workload_identity_provider: projects/339497864493/locations/global/workloadIdentityPools/github/providers/describeloai
          service_account: ore-ci@project-8853a180-450d-47be-b83.iam.gserviceaccount.com

      # ⚠️ `kubectl` contra GKE necesita un plugin de credenciales que el runner NO
      #   trae. Sin el, la construccion pasa y el relevo falla con un mensaje que
      #   habla de client-go y no de que falta instalar algo.
      - uses: google-github-actions/setup-gcloud@v2
        if: steps.punta.outputs.sigue == 'si'
        with:
          install_components: gke-gcloud-auth-plugin

      # ⭐ Ahora, y no al construir, las etiquetas que nombran los manifiestos.
      #   Es mover un puntero en el registro: segundos, sin subir una capa.
      #
      # ⚠️ Por el API del REGISTRO (`container images add-tag`: un PUT del
      #   manifiesto, lo mismo que hacía `docker push`), no por el de Artifact
      #   Registry: `artifacts docker tags add` sobre una etiqueta que ya existe
      #   la BORRA y la crea, y `ore-ci` —`artifactregistry.writer`— no tiene
      #   `tags.delete`, ni hace falta dárselo (medido: PERMISSION_DENIED).
      - name: y las etiquetas que nombran los manifiestos, a este commit
        if: steps.punta.outputs.sigue == 'si'
        run: |
          R=europe-west1-docker.pkg.dev/project-8853a180-450d-47be-b83/ore
          PIDS=""
          for IE in ore:main ore-drivers:main ore-serve:main ore-iam:main ore-cofre:main ore-postgres:main \
                    ore-informador:main puesto-python:1 puesto-node:1 puesto-jvm:1 puesto-spark:1 puesto-python-notebooks:1 \
                    capa-jvm:1 capa-node:1 capa-python:1 idp:main; do
            # `en-uso` va con la que se mueve: la limpieza del registro la guarda por ese
            # prefijo (malla/registro-limpieza.json, ADR 0060 A2). `:1` no sirve para eso:
            # la regla casa por prefijo y `1` es también el principio de un commit.
            gcloud container images add-tag "$R/${IE%%:*}:${GITHUB_SHA::12}" "$R/$IE" "$R/${IE%%:*}:en-uso" --quiet & PIDS="$PIDS $!"
          done
          MAL=0
          for P in $PIDS; do wait "$P" || MAL=1; done
          exit $MAL

      # ⭐⭐ Y el DESPLIEGUE no cambia la etiqueta del manifiesto. Sigue siendo
      #   `:main` con `imagePullPolicy: Always`, para que `kubectl apply -f
      #   malla/…` a mano siga diciendo la verdad. Lo que se escribe es una
      #   ANOTACIÓN con el commit: provoca el relevo **y** deja escrito de qué
      #   árbol salió lo que está corriendo, que es lo que hoy no se podía
      #   averiguar mirando un pod.
      - name: desplegar, y dejar dicho de que commit
        if: steps.punta.outputs.sigue == 'si'
        run: |
          gcloud container clusters get-credentials ore-mesh \
            --zone europe-west1-b --project project-8853a180-450d-47be-b83
          # -- ¿DUERME EL CLÚSTER? (ADR 0060 B1·3, 2026-10-10) ----------------
          #
          # Fuera de horas los nodos están a 0 (G8). El plano de control contesta,
          # pero NO SE PUEDE ESCRIBIR UN Deployment: el webhook de Kueue
          # (`mdeployment.kb.io`, `failurePolicy: Fail`) no tiene pods que lo
          # atiendan (medido en la primera corrida, 38053087597). Dormido, el
          # relevo no se hace: las etiquetas ya se movieron (paso anterior), y
          # `malla/despertar.sh`, con el clúster en pie, vuelve a lanzar ESTE job
          # (`gh run rerun --job`), que entonces releva y comprueba como siempre.
          LISTOS=$(kubectl get nodes -l cloud.google.com/gke-nodepool=sistema-spot \
            -o jsonpath='{range .items[*]}{.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}' \
            | grep -c '^True$' || true)
          DORMIDO=no; [ "${LISTOS:-0}" = 0 ] && DORMIDO=si
          echo "DORMIDO=$DORMIDO" >> "$GITHUB_ENV"
          echo "  sistema-spot: ${LISTOS:-0} nodos listos · dormido: $DORMIDO"
          if [ "$DORMIDO" = si ]; then
            echo "⏸ el clúster duerme: las imágenes de ${GITHUB_SHA::12} ya son \`:main\`/\`:1\`; el relevo lo hace \`malla/despertar.sh\` volviendo a lanzar este job" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # -- LA LISTA SE PREGUNTA, NO SE ESCRIBE ---------------------------
          #
          # 2026-09-10 · esto decia `identidad/ore-iam t-demo/ore-serve
          # t-demo/ore-cofre`, con `demo` puesto a mano. Y el SEGUNDO inquilino
          # llevaba medio dia corriendo sin que nadie le diera el relevo:
          # medido, `t-prueba/ore-serve` tenia la anotacion en `<none>`
          # mientras `t-demo/ore-serve` iba al dia. Y CI pasaba en VERDE.
          #
          # => TERCERA vez el mismo error en dos dias: nombrar a UN inquilino
          #   donde habia que nombrar una CLASE. Las otras dos fueron la lista
          #   de invitados de la forja y la `NetworkPolicy` del IdP, y las dos
          #   se arreglaron igual — preguntando por la etiqueta.
          #
          # Y `ore-serve` no lleva ni una etiqueta `ore.dev/*` propia: quien la
          # lleva es su NAMESPACE, `ore.dev/rol: cargas` — la MISMA por la que
          # pregunta esa `NetworkPolicy`. Se pregunta por ahi a proposito: asi
          # esto funciona sobre los compartimentos que YA estan rendidos, sin
          # tener que volver a rendir ninguno.
          DESTINOS="identidad/ore-iam"
          for NS in $(kubectl get ns -l ore.dev/rol=cargas -o jsonpath='{.items[*].metadata.name}'); do
            DESTINOS="$DESTINOS $NS/ore-serve $NS/ore-cofre"
            # El informador (0026 E2) solo en las celdas que ya lo tienen rendido.
            kubectl -n "$NS" get deployment informador >/dev/null 2>&1 && DESTINOS="$DESTINOS $NS/informador"
            # `ore-medios` (0049 B2·4), igual: viaja en la imagen de `ore-serve`.
            kubectl -n "$NS" get deployment ore-medios >/dev/null 2>&1 && DESTINOS="$DESTINOS $NS/ore-medios"
            # `ore-federation` (0053 F8·4), igual: viaja en la imagen de los
            #   drivers. Sin esto se quedaba con el binario de la víspera (medido
            #   el 2026-10-06: `/v1/check` daba 404 con `ore-serve` ya al día).
            kubectl -n "$NS" get deployment ore-federation >/dev/null 2>&1 && DESTINOS="$DESTINOS $NS/ore-federation"
            # `ore-motor` (0057 B4·3·3): viaja en la imagen del puesto, con SU clave.
            kubectl -n "$NS" get deployment ore-motor >/dev/null 2>&1 && DESTINOS="$DESTINOS $NS/ore-motor"
          done

          # Y si la pregunta no devuelve NADA, esto NO pasa en verde. Sin esta
          # linea una etiqueta mal puesta convierte «no releve a nadie» en
          # «releve a todos los que habia», que son cero — que es exactamente
          # el fallo que se acaba de arreglar, con otra cara.
          [ "$DESTINOS" = "identidad/ore-iam" ] && { echo "x ningun namespace con ore.dev/rol=cargas"; exit 1; }
          # El plano de control de Postgres (0058 P4·1), si ya está rendido: no es de
          # ninguna celda, va en `ore-pg`.
          # ⭐ (ADR 0060 C1·0, 2026-10-10) Y sólo si su grupo de nodos está en pie: vive en
          #   `ore.dev/pool: neon`, que va a 0 cuando Postgres no se usa, y esperar su
          #   relevo era agotar los 300 s (medido). Se releva cuando Postgres despierte.
          if kubectl -n ore-pg get deployment ore-postgres >/dev/null 2>&1; then
            if kubectl get nodes -l ore.dev/pool=neon --no-headers 2>/dev/null | grep -q " Ready"; then
              DESTINOS="$DESTINOS ore-pg/ore-postgres"
            else
              echo "  ore-pg/ore-postgres: su grupo de nodos está a 0; no se releva"
            fi
          fi

          # ⭐ Y sólo los que CAMBIAN (2026-10-03). Relevar un `ore-serve` cuyos
          #   binarios son los mismos no despliega nada y cierra las sesiones de
          #   los puestos (su estado vive en memoria). Cada Deployment lleva la
          #   clave de lo que corre (`ore.dev/binarios`); la misma, se queda.
          # ⭐ (ADR 0060 B2) La clave es la huella de SU imagen, `<imagen>:h-<huella>`:
          #   tocar `ore-serve` releva `ore-serve` y `ore-medios`, no `ore-cofre`.
          IMAGENES="${{ needs.construir.outputs.imagenes }}"
          [ -n "$IMAGENES" ] || { echo "x construir no dio las huellas de las imagenes"; exit 1; }
          clave_de() {
            case "${1##*/}" in
              ore-serve|ore-medios) I=ore-serve ;;  ore-cofre) I=ore-cofre ;;  ore-iam) I=ore-iam ;;
              informador) I=ore-informador ;;  ore-federation) I=ore-drivers ;;
              ore-motor) I=puesto-python ;;  ore-postgres) I=ore-postgres ;;  *) I="" ;;
            esac
            H=$(echo ",$IMAGENES," | grep -o ",$I=[0-9a-f]*" | cut -d= -f2)
            echo "${I:-?}:h-${H:-?}"
          }
          TODOS="$DESTINOS"; DESTINOS=""; IGUALES=""
          for D in $TODOS; do
            case "$(clave_de "$D")" in *'?'*) echo "x ${D##*/}: no sé de qué imagen es ($(clave_de "$D"))"; exit 1 ;; esac
            V=$(kubectl -n "${D%%/*}" get deployment "${D##*/}" \
              -o jsonpath='{.spec.template.metadata.annotations.ore\.dev/binarios}')
            if [ "$V" = "$(clave_de "$D")" ]; then IGUALES="$IGUALES $D"; else DESTINOS="$DESTINOS $D"; fi
          done
          echo "  sin cambios, NO se relevan:${IGUALES:- ninguno}"
          echo "  relevo para:${DESTINOS:- nadie}"
          # Y viaja al paso siguiente, que comprueba EXACTAMENTE estas listas.
          echo "DESTINOS=$DESTINOS" >> "$GITHUB_ENV"
          echo "TODOS=$TODOS" >> "$GITHUB_ENV"
          echo "IMAGENES=$IMAGENES" >> "$GITHUB_ENV"
          [ -n "$DESTINOS" ] || exit 0

          # ⭐ En paralelo, en DOS OLEADAS (2026-09-30). Uno a uno eran ~6 min
          #   de esperar `rollout status` en fila. Pero en fila había un canario
          #   sin querer: `ore-serve` y `ore-cofre` son `Recreate`, y una imagen
          #   que no arranca paraba el bucle en la primera celda y dejaba las
          #   demás sirviendo. Eso se conserva a proposito: `ore-iam` y la
          #   primera celda primero; el resto, sólo si esos quedaron en pie.
          PRIMERA=$(kubectl get ns -l ore.dev/rol=cargas -o jsonpath='{.items[0].metadata.name}')
          OLA1=""; OLA2=""
          for D in $DESTINOS; do
            case "$D" in identidad/*|"$PRIMERA"/*) OLA1="$OLA1 $D";; *) OLA2="$OLA2 $D";; esac
          done
          relevar() {
          PIDS=""
          for D in "$@"; do
            NS="${D%%/*}"; NOMBRE="${D##*/}"
            # ── ⛔⛔ APPLY DEL LADO DEL SERVIDOR, Y NO UN `patch` ──────────
            #
            # Con `patch` esta anotacion NO SOBREVIVIA. Flux gobierna ahora
            # estos tres `Deployment` —el inquilino desde la E3, la malla desde
            # hoy— y su apply del lado del servidor se lleva por delante los
            # campos que ningun gestor reclama.
            #
            # ⇒ Y el fallo era del peor tipo: CI parcheaba, comprobaba acto
            #   seguido y PASABA; minutos despues Flux borraba la anotacion. Un
            #   aviso en verde que no se sostenia. Medido: `ore-serve` llevaba
            #   dias sin ella y nadie lo vio.
            #
            # ⭐ Con `--server-side --field-manager=ore-ci`, este campo pasa a
            #   tener DUEÑO, y el apply de otro gestor ya no lo toca: Kubernetes
            #   solo quita lo que el propio gestor dejo de declarar. Probado
            #   forzando una reconciliacion con la anotacion puesta.
            #
            # ⚠️ El manifiesto va PARCIAL a proposito: el resto del
            #   `Deployment` lo pone el estado vivo. Reclamar aqui mas campos
            #   seria disputarselos a Flux, que es justo lo que no se quiere.
            # ⚠️ Y por `printf`, no por heredoc. Un heredoc dentro de un bloque
            #   `run: |` depende de que la indentacion sobreviva a dos capas
            #   —YAML y el shell— y este arbol ya ha pagado ese peaje varias
            #   veces. Aqui no hay columnas de las que fiarse.
            printf 'apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: %s\n  namespace: %s\nspec:\n  template:\n    metadata:\n      annotations:\n        ore.dev/commit: "%s"\n        ore.dev/binarios: "%s"\n' \
              "$NOMBRE" "$NS" "$GITHUB_SHA" "$(clave_de "$D")" \
              | kubectl -n "$NS" apply --server-side --field-manager=ore-ci \
                  --force-conflicts -f -
            kubectl -n "$NS" rollout status "deployment/$NOMBRE" --timeout=300s > "/tmp/relevo-$NS-$NOMBRE.txt" 2>&1 &
            PIDS="$PIDS $!"
          done
          MAL=0
          for P in $PIDS; do wait "$P" || MAL=1; done
          cat /tmp/relevo-*.txt; rm -f /tmp/relevo-*.txt
          return $MAL
          }
          echo "  primera oleada:$OLA1"
          [ -z "$OLA1" ] || relevar $OLA1 || { echo "x la primera oleada no quedo en pie: el resto no se toca"; exit 1; }
          [ -z "$OLA2" ] || { echo "  segunda oleada:$OLA2"; relevar $OLA2; }

      # ⛔ Y se COMPRUEBA que lo que quedó arriba es lo que se acaba de empujar.
      #   Un `rollout status` verde dice que hay pods listos, no que sean los
      #   nuestros: si el `patch` no hubiera cambiado nada —porque la anotación
      #   ya estuviera— no habría relevo y esto pasaría igual.
      - name: y comprobar que corre ESTE commit
        # Dormido no se releva nada (paso anterior): lo comprueba la vuelta de este job.
        if: steps.punta.outputs.sigue == 'si' && env.DORMIDO != 'si'
        run: |
          for D in $DESTINOS; do
            NS="${D%%/*}"; NOMBRE="${D##*/}"
            VISTO=$(kubectl -n "$NS" get deployment "$NOMBRE" \
              -o jsonpath='{.spec.template.metadata.annotations.ore\.dev/commit}')
            [ "$VISTO" = "$GITHUB_SHA" ] \
              || { echo "✗ $NOMBRE corre «$VISTO» y esperabamos «$GITHUB_SHA»"; exit 1; }
            echo "  · $NOMBRE · $VISTO"
          done
          # Y TODOS, relevados o no, corren los binarios de este commit.
          clave_de() {
            case "${1##*/}" in
              ore-serve|ore-medios) I=ore-serve ;;  ore-cofre) I=ore-cofre ;;  ore-iam) I=ore-iam ;;
              informador) I=ore-informador ;;  ore-federation) I=ore-drivers ;;
              ore-motor) I=puesto-python ;;  ore-postgres) I=ore-postgres ;;  *) I="" ;;
            esac
            H=$(echo ",$IMAGENES," | grep -o ",$I=[0-9a-f]*" | cut -d= -f2)
            echo "${I:-?}:h-${H:-?}"
          }
          for D in $TODOS; do
            VISTO=$(kubectl -n "${D%%/*}" get deployment "${D##*/}" \
              -o jsonpath='{.spec.template.metadata.annotations.ore\.dev/binarios}')
            [ "$VISTO" = "$(clave_de "$D")" ] \
              || { echo "✗ ${D##*/} corre los binarios «$VISTO» y esperabamos «$(clave_de "$D")»"; exit 1; }
          done
