name: construir

# ADR 0060 B1 · construir las imágenes en el runner de GitHub (gratis: el repositorio es
# público) en vez de en Cloud Build.
#
# B1·0 (2026-10-10): MEDIR, sin tocar Google. Sólo corre en ramas `b1/*` y a mano. No se
# autentica en GCP, no sube nada y no baja nada de Artifact Registry (bajar del registro a
# internet se cobra; subir no). Responde a una pregunta: ¿caben la compilación de Rust y
# las catorce imágenes en un runner de 4 núcleos, y cuánto tardan?
#
#   · los binarios, como en cloudbuild.yaml: las dependencias por su receta (cargo-chef),
#     aquí en la caché de GitHub y no en `ore-deps:h-…`; nuestro código, siempre entero;
#   · las catorce imágenes, en local, con `--build-arg BINARIOS=` la imagen local;
#   · el tiempo de cada etapa, el pico de disco y el tamaño de cada imagen, al resumen.
#
# Dos corridas: la primera en frío (sin la caché de las dependencias) y la segunda con ella.

on:
  push:
    branches: ['b1/**']
  workflow_dispatch:

concurrency:
  group: construir-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  medir:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      DOCKER_BUILDKIT: '1'
    steps:
      - name: el disco, antes y despues de liberar
        run: |
          df -h / | tail -1 | awk '{print "  antes: " $4 " libres de " $2}'
          # Lo que el runner trae y aquí no se usa: .NET, Android, GHC, CodeQL y las
          # imágenes de Docker precargadas.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune -af >/dev/null
          df -h / | tail -1 | awk '{print "  despues: " $4 " libres de " $2}'
          # El pico de disco, cada 5 s, para el resumen.
          ( while :; do df --output=used -B1 / | tail -1 >> /tmp/disco.txt; sleep 5; done ) &
          echo "T0=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: las huellas
        id: huella
        run: |
          t=$(date +%s)
          H=$(sh ci/huella-de-los-binarios.sh)
          docker build -q --target receta -t receta . >/dev/null
          D=$({ docker run --rm receta cat /receta.json
                awk '/^FROM rust:.* AS herramientas$/ {p=1} /^FROM deps AS build$/ {p=0} p' Dockerfile
                cat ci/compilar-binarios.sh rust-toolchain.toml; } | sha256sum | cut -c1-16)
          echo "binarios=$H" >> "$GITHUB_OUTPUT"
          echo "deps=$D" >> "$GITHUB_OUTPUT"
          echo "huellas|$(( $(date +%s) - t ))" >> /tmp/tiempos.txt
          echo "  binarios h-$H · deps h-$D"

      - name: las dependencias, de la cache de GitHub
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: /tmp/deps.tar.zst
          key: ore-deps-${{ steps.huella.outputs.deps }}

      - name: las dependencias (si no estaban, se compilan)
        run: |
          t=$(date +%s)
          if [ -f /tmp/deps.tar.zst ]; then
            zstd -dc /tmp/deps.tar.zst | docker load -q
            echo "deps (de la cache)|$(( $(date +%s) - t ))" >> /tmp/tiempos.txt
          else
            docker build -q --target deps -t ore-deps:local . >/dev/null
            echo "deps (compiladas)|$(( $(date +%s) - t ))" >> /tmp/tiempos.txt
            t=$(date +%s)
            docker save ore-deps:local | zstd -T0 -3 -q -o /tmp/deps.tar.zst
            echo "deps (guardar en la cache)|$(( $(date +%s) - t ))" >> /tmp/tiempos.txt
          fi
          ls -l /tmp/deps.tar.zst | awk '{printf "  deps en la cache: %.2f GB\n", $5/1e9}'
          docker image inspect ore-deps:local --format '{{.Size}}' | awk '{printf "  deps, imagen: %.2f GB\n", $1/1e9}'

      - name: los binarios (nuestro codigo, siempre entero)
        run: |
          t=$(date +%s)
          docker run --rm -v "$PWD:/src" -w /src -e SALIDA=/src/.binarios ore-deps:local sh ci/compilar-binarios.sh
          sudo chown -R "$(id -u):$(id -g)" .binarios
          printf 'FROM scratch\nCOPY . /b/\n' | docker build -q -t ore-binarios:local -f - .binarios >/dev/null
          echo "binarios|$(( $(date +%s) - t ))" >> /tmp/tiempos.txt
          du -sh .binarios | awk '{print "  binarios: " $1}'

      - name: las catorce imagenes, en local
        run: |
          # Las que copian binarios toman la imagen local; las demás no la nombran.
          construir() {
            t=$(date +%s)
            if docker build -q --target "$1" --build-arg BINARIOS=ore-binarios:local -t "img-$1" . >/tmp/log-$1.txt 2>&1; then
              echo "imagen $1|$(( $(date +%s) - t ))" >> /tmp/tiempos.txt
            else
              echo "imagen $1 FALLO|$(( $(date +%s) - t ))" >> /tmp/tiempos.txt
              tail -30 /tmp/log-$1.txt
              return 1
            fi
          }
          export -f construir
          t=$(date +%s)
          # Tres a la vez: cuatro núcleos, y las de los puestos instalan paquetes por red.
          printf '%s\n' ore informador capa-jvm capa-node capa-python idp drivers serve iam cofre \
                        postgres-plano puesto-python puesto-node puesto-jvm \
            | xargs -P 3 -I{} bash -c 'construir {}'
          echo "las catorce (en total, 3 a la vez)|$(( $(date +%s) - t ))" >> /tmp/tiempos.txt

      - name: el resumen
        if: always()
        run: |
          {
            echo "## B1·0 · construir en el runner de GitHub"
            echo
            echo "binarios \`h-${{ steps.huella.outputs.binarios }}\` · deps \`h-${{ steps.huella.outputs.deps }}\` · cache de deps: ${{ steps.cache-deps.outputs.cache-hit == 'true' && 'si' || 'no' }}"
            echo
            echo "| etapa | segundos |"
            echo "|---|---|"
            awk -F'|' '{print "| " $1 " | " $2 " |"}' /tmp/tiempos.txt 2>/dev/null
            echo "| **total del job** | **$(( $(date +%s) - T0 ))** |"
            echo
            echo "| imagen | tamaño |"
            echo "|---|---|"
            docker images --format '{{.Repository}} {{.Size}}' | grep '^img-' | sed 's/^img-//' | awk '{print "| " $1 " | " $2 " |"}'
            echo
            sort -n /tmp/disco.txt | tail -1 | awk '{printf "pico de disco usado: %.1f GB\n", $1/1e9}'
            df -h / | tail -1 | awk '{print "al final: " $4 " libres de " $2}'
          } | tee -a "$GITHUB_STEP_SUMMARY"
