name: horario

# ADR 0060 C1 · LA MALLA VIVE DE 08:00 A 00:00, HORA DE MADRID. Este workflow es el brazo:
#
#   · a las 08:00 de Madrid lo lanza Cloud Scheduler (`ore-despertar`, `Europe/Madrid`), que hace
#     el POST de la consola (`https://app.paladio.io/auth/despertar`). El cron de GitHub no: el
#     2026-10-12 no corrió ni a las 06 ni a las 07 UTC.
#   · a las 00:00 de Madrid duerme, DENTRO: la CronJob `dormir-de-noche`
#     (malla/18-el-horario.yaml).
#   · a mano o desde la consola (`workflow_dispatch`): `despertar` (`malla/despertar.sh`, que
#     relanza el job `imagen` de la última corrida de `ci`), `dormir` (si no hay trabajo en
#     Kueue) o `dormir-ya`. Despertada a mano fuera de horario, duerme en la siguiente pasada
#     de la noche (00:00–02:30) o, de 02:30 a 08:00, sigue hasta la medianoche siguiente.
#
# ⛔ La cuenta: `ore-horario`, federada desde el OIDC de GitHub y sólo para `main`
#   (`repo:describeloai/ore:ref:refs/heads/main`). En Google sólo cambia el tamaño de los
#   grupos de nodos (papel `oreHorario`); en el clúster, lo de `malla/18-el-horario.yaml`.

on:
  workflow_dispatch:
    inputs:
      accion:
        description: 'despertar | dormir (si no hay trabajo en Kueue) | dormir-ya'
        required: true
        default: despertar
        type: choice
        options: [despertar, dormir, dormir-ya]
      postgres:
        description: 'al despertar, también Postgres (0058)'
        required: false
        default: false
        type: boolean

# Una cosa a la vez: un despertar no se pisa con un dormir; el que llega espera.
concurrency:
  group: horario
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # la federación con Google
  actions: write    # despertar relanza el job `imagen` de `ci`

jobs:
  horario:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      ACCION: ${{ inputs.accion }}
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v2
        with:
          project_id: project-8853a180-450d-47be-b83
          workload_identity_provider: projects/339497864493/locations/global/workloadIdentityPools/github/providers/describeloai
          service_account: ore-horario@project-8853a180-450d-47be-b83.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - name: la malla, según la acción
        run: |
          echo "  acción: $ACCION"
          case "$ACCION" in
            despertar)
              if [ "${{ inputs.postgres }}" = true ]; then bash malla/despertar.sh --con-postgres
              else bash malla/despertar.sh; fi ;;
            dormir)    bash malla/dormir.sh ;;
            dormir-ya) bash malla/dormir.sh --forzar ;;
            *) echo "acción desconocida: $ACCION"; exit 64 ;;
          esac
