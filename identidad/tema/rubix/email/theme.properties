# ═══════════════════════════════════════════════════════════════════
# EL TEMA DE CORREO DE RUBIX
#
# ── ⭐⭐ POR QUÉ `parent=base` Y NO `keycloak` ───────────────────────
#
#   `base` trae los mensajes y la maquinaria, y NADA de presentación. `keycloak` trae
#   además la maquetación de fábrica — la de «This is a test message» sin marca.
#
#   ⇒ Heredando de `base`, lo que NO reescribamos sigue funcionando (verificación de
#     correo, notificaciones de evento) con la plantilla de siempre; lo que sí, es nuestro.
#     ⛔ Heredar de `keycloak` habría hecho que nuestra plantilla compitiera con la suya.
#
# ── ⚠️ Y ESTO NO VA EN LA IMAGEN, VA EN UN ConfigMap ────────────────
#
#   Un tema propio suele obligar a recocer la imagen. Para un tema de CORREO no: son cuatro
#   ficheros de texto, así que van por `configMapGenerator` y se montan en
#   `/opt/keycloak/themes/rubix`. ⭐ El ciclo de iteración pasa de «construir una imagen» a
#   «aplicar y reiniciar el pod», y sigue estando descrito por git.
#
#   ⛔ Para el tema de LOGIN esto no valdría igual de bien: lleva CSS, fuentes e imágenes, y
#     un ConfigMap no es sitio para binarios. Ése sí irá en la imagen el día que se haga.
# ═══════════════════════════════════════════════════════════════════
parent=base
locales=es,en
