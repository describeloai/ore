# ═══════════════════════════════════════════════════════════════════
# LOS TEXTOS, EN ESPAÑOL — y viven aquí y no dentro de la plantilla
#
# ⭐ Separarlos no es ceremonia de i18n: es lo que permite cambiar una frase sin tocar
#   FreeMarker, donde un error de sintaxis **rompe el envío entero** en vez de verse mal.
#
# ⚠️ Y las claves llevan nombre PROPIO (`passwordResetTitulo`, no `passwordResetBody`) a
#    propósito: reutilizar las de Keycloak haría que una actualización del servidor
#    cambiara nuestro texto sin que nadie lo pidiera.
#
# ⛔ `{0}` es el correo de la persona. Es el ÚNICO dato que se interpola, y va porque
#   confirma a quién se dirige el mensaje — que es lo que distingue un correo legítimo de
#   uno de phishing genérico.
# ═══════════════════════════════════════════════════════════════════

# El asunto. ⭐ Sin `[KEYCLOAK]`, que es lo que trae la plantilla de fábrica.
passwordResetSubject=Restablece tu contraseña

passwordResetTitulo=Restablece tu contraseña
passwordResetIntroCon=Alguien ha pedido restablecer la contraseña de {0}. Si has sido tú, pulsa el botón para elegir una nueva.
passwordResetIntroSin=Alguien ha pedido restablecer la contraseña de esta cuenta. Si has sido tú, pulsa el botón para elegir una nueva.
passwordResetBoton=Elegir una contraseña nueva
passwordResetCaduca=El enlace caduca en {0} y sólo se puede usar una vez.
passwordResetIgnorar=Si no has sido tú, puedes ignorar este correo: tu contraseña no cambia hasta que alguien pulse ese enlace.
passwordResetEnlaceLiteral=Si el botón no funciona, copia esta dirección en tu navegador:

piePaladio=Rubix · Paladio — este mensaje es automático, no hace falta responderlo.
