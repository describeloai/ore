[package]
name = "f2-motor"
version = "0.1.0"
edition = "2021"
description = "ORE 0072 F2·0 · el motor de teselas de laboratorio: polígonos, la cadena de consenso, el salto (no producto)"
publish = false

# Fuera del workspace de ORE: es un laboratorio.
[workspace]

[dependencies]
parquet = { version = "58", default-features = false, features = ["async", "object_store", "snap", "zstd", "geospatial", "arrow"] }
arrow = { version = "58", default-features = false }
object_store = { version = "0.13", features = ["gcp"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
futures = "0.3"
geo = "0.31"
flate2 = "1"
serde_json = "1"
rand = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
