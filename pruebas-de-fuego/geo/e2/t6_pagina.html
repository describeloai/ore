<!doctype html><html><head><meta charset="utf-8"><title>E2 T6</title>
<style>html,body{margin:0;height:100%;overflow:hidden}gmp-map-3d{position:absolute;inset:0}#d{position:absolute;inset:0;pointer-events:none}#r{position:fixed;top:0;left:0;background:#fff;font:12px monospace;padding:4px;z-index:9;white-space:pre}</style>
</head><body><div id="r">cargando</div><div id="d"></div><script>
const CLAVE = "__CLAVE__";
const P = new URLSearchParams(location.search).get('p') || 'a';
const out = []; const R = document.getElementById('r');
function log(o){ out.push(o); R.textContent = out.map(x => JSON.stringify(x)).join(String.fromCharCode(10)); window.E2 = out; }
window.gm_authFailure = () => log({error: 'auth'});
const C = {lat: 40.4168, lng: -3.7038};
const espera = ms => new Promise(r => setTimeout(r, ms));
const fps = async ms => { let n = 0; const t0 = performance.now(); await new Promise(res => { const f = () => { n++; if (performance.now() - t0 < ms) requestAnimationFrame(f); else res(); }; requestAnimationFrame(f); }); return Math.round(n * 1000 / ms); };
let map;
const vuelo = async () => { map.flyCameraAround({camera: {center: {...C, altitude: 650}, range: 70000, tilt: 50, heading: 0}, durationMillis: 6000, repeatCount: 1}); return fps(5000); };
window.__e2 = async () => {
  const lib = await google.maps.importLibrary('maps3d');
  map = new lib.Map3DElement({center: {...C, altitude: 650}, range: 70000, tilt: 50, heading: 0, mode: 'SATELLITE'});
  document.body.prepend(map);
  await espera(8000);
  log({p: P, n: 0, fps_quieto: await fps(3000), fps_vuelo: await vuelo()});
  if (P === 'a') await pruebaA(lib); else await pruebaB(lib);
  log({fin: true});
};
async function pruebaA(lib) {
  for (const f of (new URLSearchParams(location.search).get('f') || 'hex_10000,hex_100000,pts_100000,hex_300000,pts_300000,pts_1000000,hex_1000000').split(',')) {
    const t0 = performance.now();
    const m = new lib.Model3DElement({src: location.origin + '/' + f + '.glb', position: {...C, altitude: 150}, altitudeMode: 'RELATIVE_TO_GROUND', orientation: {heading: 0, tilt: +(new URLSearchParams(location.search).get('t') || 0), roll: 0}, scale: 1});
    let cargado = null; m.addEventListener('gmp-load', () => { cargado = Math.round(performance.now() - t0); });
    map.append(m);
    await espera(12000);
    log({f, cargado_ms: cargado, fps_quieto: await fps(3000), fps_vuelo: await vuelo(), heap_mb: performance.memory ? Math.round(performance.memory.usedJSHeapSize / 1048576) : null});
    if (new URLSearchParams(location.search).get('k')) return; m.remove(); await espera(2000);
  }
}
async function pruebaB(lib) {
  await new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://unpkg.com/deck.gl@9.1.0/dist.min.js'; s.onload = res; s.onerror = rej; document.head.append(s); });
  // referencias en el mapa de Google: 4 cuadrados en sitios conocidos, para ver si deck.gl cae encima
  const refs = [[40.4169, -3.7035], [40.4530, -3.6883], [40.3960, -3.7700], [40.4400, -3.6200]];
  for (const [la, ln] of refs) { const d = 0.0015; map.append(new lib.Polygon3DElement({path: [{lat: la-d, lng: ln-d}, {lat: la-d, lng: ln+d}, {lat: la+d, lng: ln+d}, {lat: la+d, lng: ln-d}], altitudeMode: 'CLAMP_TO_GROUND', fillColor: 'rgba(0,120,255,0.6)', strokeColor: '#0078ff'})); }
  const FH = map.fov || 35; const modo = new URLSearchParams(location.search).get('fov') || 'h';
  const fov = modo === 'h' ? 2 * Math.atan(Math.tan(FH / 2 * Math.PI / 180) * document.body.clientHeight / document.body.clientWidth) * 180 / Math.PI : FH;
  const vista = () => {
    const c = map.center, h = document.body.clientHeight, lat = c.lat * Math.PI / 180;
    const dpx = (h / 2) / Math.tan(fov / 2 * Math.PI / 180);           // distancia de la cámara en píxeles
    const mpp = map.range / dpx;                                         // metros por píxel en el centro
    const zoom = Math.log2(156543.03392 * Math.cos(lat) / mpp);
    return {longitude: c.lng, latitude: c.lat, zoom, pitch: map.tilt, bearing: map.heading, position: [0, 0, c.altitude || 0]};
  };
  const datos = n => { const a = new Float32Array(n * 2); for (let i = 0; i < n; i++) { a[2*i] = C.lng + (Math.random() - .5) * 0.6; a[2*i+1] = C.lat + (Math.random() - .5) * 0.45; } return a; };
  const deckgl = new deck.Deck({parent: document.getElementById('d'), controller: false, views: new deck.MapView({fovy: fov, nearZMultiplier: 0.01, farZMultiplier: 10}), viewState: vista(), layers: []});
  let vivo = true; const bucle = () => { if (!vivo) return; deckgl.setProps({viewState: vista()}); requestAnimationFrame(bucle); }; bucle();
  const anillos = new deck.ScatterplotLayer({id: 'ref', data: refs.map(([la, ln]) => [ln, la]), getPosition: d => [d[0], d[1], 650], getRadius: 120, stroked: true, filled: false, lineWidthMinPixels: 3, getLineColor: [255, 0, 0]});
  deckgl.setProps({layers: [anillos]});
  await espera(4000);
  if (new URLSearchParams(location.search).get('solo')) { window.DECK = deckgl; return; }
  log({fov_google: map.fov ?? null, nota: 'captura: anillos rojos (deck.gl) sobre cuadrados azules (Google)'});
  window.CAPTURA = true; await espera(15000); window.CAPTURA = false;
  for (const n of [100000, 1000000, 3000000]) {
    const a = datos(n);
    const capa = new deck.ScatterplotLayer({id: 'p' + n, data: {length: n, attributes: {getPosition: {value: a, size: 2}}}, getRadius: 25, radiusMinPixels: 1.5, getFillColor: [255, 90, 0, 200]});
    deckgl.setProps({layers: [anillos, capa]});
    await espera(4000);
    log({n, fps_quieto: await fps(3000), fps_vuelo: await vuelo()});
  }
  vivo = false;
}
const s = document.createElement('script');
s.src = 'https://maps.googleapis.com/maps/api/js?' + new URLSearchParams({key: CLAVE, v: 'beta', libraries: 'maps3d', callback: '__e2'});
document.head.append(s);
</script></body></html>
