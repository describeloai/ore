# Una VM de cómputo de NeonVM (D0b·2): plantilla.
#   source entorno.sh; plantilla vm.yaml [ORE_PG_VM=pg-rama] | kubectl apply -f -
# Su especificación va en el ConfigMap ${ORE_PG_VM}-config (lo crea `vm.sh`).
apiVersion: vm.neon.tech/v1
kind: VirtualMachine
metadata:
  name: ${ORE_PG_VM}
  namespace: ${ORE_PG_NS_COMPUTO}
  labels:
    autoscaling.neon.tech/enabled: 'true'
    # P3·4: la red de `ore-pg-computo` va por ore.dev/rol (malla/85-…); proyecto y endpoint son para
    # operar y medir, NO para aislar (alta cardinalidad: Cilium no las usa, P2·6)
    ore.dev/rol: postgres
    ore.dev/proyecto: prueba
    ore.dev/endpoint: ${ORE_PG_VM}
  annotations:
    autoscaling.neon.tech/bounds: '{ "min": { "cpu": 0.25, "mem": "1Gi" }, "max":
      { "cpu": 1, "mem": "3Gi" } }'
spec:
  schedulerName: autoscale-scheduler
  nodeSelector:
    ore.dev/pool: ${ORE_PG_POOL}
  tolerations:
  - key: ore.dev/neon
    operator: Equal
    value: 'true'
    effect: NoSchedule
  restartPolicy: Never
  guest:
    cpus:
      min: 0.25
      use: 0.5
      max: 1
    memorySlotSize: 1Gi
    memorySlots:
      min: 1
      use: 1
      max: 3
    rootDisk:
      image: ${ORE_PG_IMAGEN_VM}
      size: 8Gi
    command:
    - /usr/local/bin/compute_ctl
    args:
    - --pgdata
    - /var/db/postgres/compute
    - -C
    - postgresql://cloud_admin@127.0.0.1:55433/postgres
    - -b
    - /usr/local/bin/postgres
    - --compute-id
    - ${ORE_PG_VM}
    - --config
    - /var/db/postgres/configs/config.json
    - --filecache-connstr
    - host=127.0.0.1 port=55433 dbname=postgres user=cloud_admin sslmode=disable application_name=vm-monitor
    ports:
    - port: 55433
    - port: 3080
    - port: 10301
    - port: 9100
    env:
    - name: AUTOSCALING
      value: 'true'
  disks:
  - name: cfg
    mountPath: /var/db/postgres/configs
    configMap:
      name: ${ORE_PG_VM}-config
  extraNetwork:
    enable: true
