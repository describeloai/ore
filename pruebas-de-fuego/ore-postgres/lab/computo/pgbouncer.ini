;; El de la imagen de cómputo de Neon (compute/etc/pgbouncer.ini en 8269bece), sin tocar salvo lo
;; marcado: así se mide en el laboratorio lo que correrá en la VM.
[databases]
*=host=localhost port=5432 auth_user=cloud_admin application_name=pgbouncer
[pgbouncer]
listen_port=6432
listen_addr=0.0.0.0
auth_type=scram-sha-256
auth_user=cloud_admin
auth_dbname=postgres
client_tls_sslmode=disable
server_tls_sslmode=disable
pool_mode=transaction
max_client_conn=10000
default_pool_size=64
max_prepared_statements=0
admin_users=postgres
unix_socket_dir=/tmp/
unix_socket_mode=0777
ignore_startup_parameters=extra_float_digits
pidfile=/tmp/pgbouncer.pid
log_connections=0
log_disconnections=0
