# 0058 P5 · El laboratorio local (ADR 0058, «P5 · En el laboratorio local»).
#
# Los binarios de producción —`ore-postgres` y el proxy de Neon de la imagen del
# almacenamiento— con lo que en el clúster es Kubernetes cambiado por contenedores:
#
#   base       la base de `ore-postgres` (en el clúster, storcon-db)
#   iam        un ore-iam de mentira: dos celdas, dos organizaciones
#   redis      por donde `ore-postgres` le dice al proxy qué olvidar (neondb-proxy-ws-updates)
#   plano      `ore-postgres servir`, el binario compilado en el volumen ore-pruebas-t
#   computo-a  un postgres:17 en 55433: hace de la VM del endpoint (el rol y el verificador
#   computo-b    los pone lab.sh, que hace aquí de reconciliador)
#   proxy      el proxy de Neon, `--auth-backend control-plane` contra `plano`
#   cliente    psql, con el SNI de `ep-….europe-west1.pg.paladio.io`
#
# Lo arranca y lo para `lab.sh`; las llaves (certificado, token, contraseñas) las genera
# él en `.secretos/`, que no entra en git.
name: p5lab
networks:
  lab:
    ipam: { config: [{ subnet: 172.29.51.0/24 }] }
volumes:
  ore-pruebas-t: { external: true }
x-computo: &computo
  image: postgres:17
  command: [postgres, -p, "55433"]
  env_file: .secretos/computo.env
  environment: { POSTGRES_HOST_AUTH_METHOD: scram-sha-256 }
services:
  base:
    image: postgres:17
    env_file: .secretos/base.env
    environment: { POSTGRES_DB: ore_postgres }
    networks: { lab: { ipv4_address: 172.29.51.5 } }
    healthcheck: { test: [CMD, pg_isready, -U, postgres], interval: 1s, retries: 30 }
  iam:
    image: python:3.12-slim
    command: [python, -I, /lab/iam.py]
    volumes: [./iam.py:/lab/iam.py:ro]
    networks: { lab: { ipv4_address: 172.29.51.6 } }
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --save, "", --appendonly, "no"]
    networks: { lab: { ipv4_address: 172.29.51.8 } }
  plano:
    image: rust:1
    command: [/tt/p4pg/release/ore-postgres, servir, --bind, 0.0.0.0:8100, --iam, "172.29.51.6:8090",
              --llaves-almacen, /no-hay, --llaves-proxy, /llaves/proxy, --redis, "172.29.51.8:6379"]
    env_file: .secretos/plano.env
    volumes: [ore-pruebas-t:/tt:ro, ./.secretos/proxy:/llaves/proxy:ro]
    networks: { lab: { ipv4_address: 172.29.51.7 } }
    depends_on: { base: { condition: service_healthy }, iam: { condition: service_started }, redis: { condition: service_started } }
  computo-a:
    <<: *computo
    networks: { lab: { ipv4_address: 172.29.51.11 } }
  computo-b:
    <<: *computo
    networks: { lab: { ipv4_address: 172.29.51.12 } }
  proxy:
    image: europe-west1-docker.pkg.dev/project-8853a180-450d-47be-b83/ore/neon:8269bece3fd934fd0a9746794b5e7b6c3aaf1d6b
    entrypoint: [sh, -c]
    command:
      - exec /usr/local/bin/proxy --region europe-west1 --proxy 0.0.0.0:4432 --mgmt 127.0.0.1:7000
        --http 0.0.0.0:7001 --wss 0.0.0.0:443 --auth-backend control-plane
        --auth-endpoint http://172.29.51.7:8100/proxy/ --control-plane-token="$$(cat /llaves/proxy/token)"
        --tls-cert /llaves/tls/tls.crt --tls-key /llaves/tls/tls.key
        --redis-auth-type plain --redis-plain redis://172.29.51.8:6379
    volumes: [./.secretos/proxy:/llaves/proxy:ro, ./.secretos/tls:/llaves/tls:ro]
    environment: { OTEL_SDK_DISABLED: "true" }
    networks: { lab: { ipv4_address: 172.29.51.20 } }
    depends_on: [plano]
  cliente:
    image: postgres:17
    entrypoint: [sleep, infinity]
    volumes: [./.secretos/tls:/llaves/tls:ro]
    networks: { lab: { ipv4_address: 172.29.51.30 } }
