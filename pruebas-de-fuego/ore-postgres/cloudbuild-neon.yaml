# D0c·C1 · Neon compilado por nosotros (fork) — un commit fijado de neondatabase/neon, su propio
# Dockerfile (BuildKit + cargo chef + build-tools:pinned), publicado en nuestro registro.
# Medido: cuánto tarda y cuánto cuesta cada compilación (es el tiempo de reacción ante un CVE).
substitutions:
  _COMMIT: fa504217c61bbcaf5c512d75830564541f917f8f
  _REGISTRO: europe-west1-docker.pkg.dev/project-8853a180-450d-47be-b83/ore
steps:
  - id: fuente
    name: gcr.io/cloud-builders/git
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        git init -q neon && cd neon
        git remote add origin https://github.com/neondatabase/neon.git
        git fetch -q --depth 1 origin ${_COMMIT}
        git checkout -q FETCH_HEAD
        # los cuatro Postgres son submódulos (../postgres.git)
        git submodule update -q --init --depth 1 --recursive
        # el BuildKit de cloud-builders/docker es viejo: no entiende ${VAR/patron/...} del Dockerfile
        sed -i '1i # syntax=docker/dockerfile:1' Dockerfile && head -2 Dockerfile
        git log -1 --format='%H %ci %s'
        du -sh . vendor/*
  - id: compilar
    name: gcr.io/cloud-builders/docker
    dir: neon
    env: [DOCKER_BUILDKIT=1]
    args: [build, --build-arg, 'GIT_VERSION=${_COMMIT}', --build-arg, BUILD_TAG=ore-d0c,
           -t, '${_REGISTRO}/neon:${_COMMIT}', .]
  - id: comprobar
    name: '${_REGISTRO}/neon:${_COMMIT}'
    entrypoint: bash
    args: [-c, 'pageserver --version && safekeeper --version && storage_broker --version']
images: ['${_REGISTRO}/neon:${_COMMIT}']
options:
  machineType: E2_HIGHCPU_32
  diskSizeGb: 200
  logging: CLOUD_LOGGING_ONLY
timeout: 7200s
