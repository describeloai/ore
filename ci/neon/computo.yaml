# El cómputo de ORE Serverless Postgres (ADR 0058, P1·2): la imagen de VM que arranca NeonVM
# (`vm-compute-node-v17`), toda desde NUESTROS forks y en un commit fijado:
#
#   compute-node-v17     compute/compute-node.Dockerfile de describeloai/neon (Postgres 17 de
#                        describeloai/postgres, compute_ctl, extensiones, pgbouncer, local_proxy…)
#   vm-builder           de describeloai/autoscaling en _VM_BUILDER; mete la imagen de cómputo en un
#                        disco de VM con el init de NeonVM y el neonvm-daemon de ci/neon/autoscaling.yaml
#                        (que tiene que estar ya en el registro con esa misma etiqueta)
#   vm-compute-node-v17  el resultado: lo que va en `spec.guest.rootDisk.image`
#
# ⭐ Paralelismo de BuildKit acotado: cada etapa ya hace `make -j$(nproc)` y Neon lo pone a 1 en su CI
#   («blows up the Runner»). Aquí igual: con 4, el enlazado LTO de compute_ctl y local_proxy murió por memoria (SIGKILL).
#
#   gcloud builds submit --no-source --async --region=global --config ci/neon/computo.yaml \
#     --service-account=projects/<P>/serviceAccounts/ore-ci@<P>.iam.gserviceaccount.com
substitutions:
  _REPO: https://github.com/describeloai/neon.git
  _COMMIT: baad49aa38dbf272c5874aa0d547e2cfb841ec1a   # ore/main = fa504217 + h3-pg + Postgres 17.10 + ARP gratuito al arrancar (P3·6)
  _AUTOSCALING: https://github.com/describeloai/autoscaling.git
  _VM_BUILDER: v0.49.1-ore.1                           # la de NeonVM (ci/neon/autoscaling.yaml); el CI de Neon en _COMMIT usa v0.46.0
  _PARALELO: '1'                                       # con 4: SIGKILL (32 GB) al enlazar con LTO compute_ctl+local_proxy
  _CACHE: leer                                         # leer | escribir
  _REGISTRO_HOST: europe-west1-docker.pkg.dev
  _REGISTRO: europe-west1-docker.pkg.dev/project-8853a180-450d-47be-b83/ore
steps:
  - id: fuente
    name: gcr.io/cloud-builders/git
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        git init -q neon && cd neon
        git remote add origin ${_REPO}
        git fetch -q --depth 1 origin ${_COMMIT} && git checkout -q FETCH_HEAD
        # sólo Postgres 17
        git submodule update -q --init --depth 1 vendor/postgres-v17
        u=$(git -C vendor/postgres-v17 remote get-url origin); echo "vendor/postgres-v17 <- $u"
        case $u in *describeloai*) ;; *) echo "✗ no viene del fork"; exit 1;; esac
        # P3·1: vm-builder va con NeonVM, no con el CI de Neon (que en _COMMIT usaba v0.46.0)
        echo "CI de Neon: $(grep -o 'VM_BUILDER_VERSION: v[0-9.]*' .github/workflows/build_and_test.yml) · aquí ${_VM_BUILDER}"
        git log -1 --format='%H %ci %s'
        cd .. && git clone -q --depth 1 --branch ${_VM_BUILDER} ${_AUTOSCALING} autoscaling
        git -C autoscaling log -1 --format='autoscaling %H %ci'

  - id: vm-builder
    name: golang:1.24
    dir: autoscaling
    waitFor: [fuente]
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        source versions.env   # alpine y busybox fijados por sha, como el Makefile del fork ($$: no son sustituciones)
        CGO_ENABLED=0 go build -o /workspace/vm-builder \
          -ldflags "-X main.Version=${_VM_BUILDER} -X main.NeonvmDaemonImage=${_REGISTRO}/neonvm-daemon:${_VM_BUILDER}
            -X main.AlpineImageTag=$$ALPINE_IMG_TAG -X main.AlpineImageShaAmd64=$$ALPINE_IMG_SHA_AMD64
            -X main.BusyboxImageTag=$$BUSYBOX_IMG_TAG -X main.BusyboxImageShaAmd64=$$BUSYBOX_IMG_SHA_AMD64" \
          vm-builder/*.go
        /workspace/vm-builder -version

  - id: neonvm-daemon
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    entrypoint: bash
    args:
      - -c
      - |
        docker pull -q ${_REGISTRO}/neonvm-daemon:${_VM_BUILDER} \
          || { echo "✗ falta neonvm-daemon:${_VM_BUILDER}: antes, ci/neon/autoscaling.yaml"; exit 1; }

  - id: compute-node
    name: docker:27-cli
    dir: neon
    waitFor: [fuente]
    entrypoint: sh
    args:
      - -c
      - |
        set -e
        printf '[worker.oci]\n  max-parallelism = %s\n' ${_PARALELO} > /tmp/buildkitd.toml
        docker buildx create --name ore --driver docker-container --config /tmp/buildkitd.toml --use
        # caché de capas en el registro (P1·3): Postgres + ~40 extensiones (~65 min en serie) casi
        # nunca cambian; un cambio en compute_ctl sólo recompila su etapa. Escribirla cuesta: sólo
        # con _CACHE=escribir (cambió Postgres, una extensión o build-tools).
        # ⛔ NO `docker login` con el token del metadata: CADUCA A LA HORA, y en frío esto tarda más. Medido
        #   (P3·1, build 5510e505): 1 h 31 min compilando y 401 al subir la caché. Un credential helper
        #   pide un token nuevo en cada petición al registro.
        cat > /usr/local/bin/docker-credential-metadatos <<'H'
        #!/bin/sh
        [ "$1" = get ] || exit 0
        cat >/dev/null
        t=$(wget -qO- --header 'Metadata-Flavor: Google' \
          http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token \
          | sed 's/.*"access_token":"\([^"]*\)".*/\1/')
        printf '{"Username":"oauth2accesstoken","Secret":"%s"}\n' "$t"
        H
        chmod +x /usr/local/bin/docker-credential-metadatos
        mkdir -p ~/.docker && printf '{"credHelpers":{"%s":"metadatos"}}\n' ${_REGISTRO_HOST} > ~/.docker/config.json
        echo "${_REGISTRO_HOST}" | docker-credential-metadatos get | grep -q '"Secret":"ya29' || { echo "✗ sin token del metadata"; exit 1; }
        cache_to=""; [ "${_CACHE}" = escribir ] && cache_to="--cache-to type=registry,ref=${_REGISTRO}/cache:neon-computo-v17,mode=max,image-manifest=true,oci-mediatypes=true"
        args="--progress plain --cache-from type=registry,ref=${_REGISTRO}/cache:neon-computo-v17
          --build-arg GIT_VERSION=${_COMMIT} --build-arg PG_VERSION=v17
          --build-arg BUILD_TAG=ore --build-arg DEBIAN_VERSION=bookworm -f compute/compute-node.Dockerfile"
        # ⛔ ...y tampoco basta el helper: buildkit pide la credencial AL ABRIR la sesión y la guarda; a la hora
        #   caduca igual (medido: 72d19f97 falló idéntico a la 1 h 25). Regla: ninguna sesión que ESCRIBA en el
        #   registro puede pasar de la hora. Así que lo largo se construye antes, en sesiones que no exportan
        #   nada (se queda en la caché local del builder `ore`), y la última —montar la imagen y subir la caché—
        #   empieza con credencial nueva y sólo tiene lo que falta.
        for parte in neon-pg-ext-build compute-tools; do
          echo "== parte: $parte ($(date -u +%T))"
          docker buildx build $args --target $parte .
        done
        echo "== imagen final y caché ($(date -u +%T))"
        docker buildx build $args --load $cache_to -t ${_REGISTRO}/compute-node-v17:${_COMMIT} .
        echo "== hecho ($(date -u +%T))"

  - id: vm-compute-node
    name: gcr.io/cloud-builders/docker
    dir: neon
    waitFor: [vm-builder, neonvm-daemon, compute-node]
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        /workspace/vm-builder -size=2G -spec=compute/vm-image-spec-bookworm.yaml \
          -src=${_REGISTRO}/compute-node-v17:${_COMMIT} \
          -dst=${_REGISTRO}/vm-compute-node-v17:${_COMMIT} \
          -target-arch=linux/amd64

  - id: comprobar
    name: '${_REGISTRO}/compute-node-v17:${_COMMIT}'
    waitFor: [compute-node]
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        compute_ctl --help >/dev/null && echo "compute_ctl ok"
        postgres --version
        echo "extensiones: $(ls $(pg_config --sharedir)/extension/*.control | wc -l)"
        test "$(ls $(pg_config --sharedir)/extension/*.control | wc -l)" -gt 50

images:
  - '${_REGISTRO}/compute-node-v17:${_COMMIT}'
  - '${_REGISTRO}/vm-compute-node-v17:${_COMMIT}'
options:
  machineType: E2_HIGHCPU_32
  diskSizeGb: 300
  logging: CLOUD_LOGGING_ONLY
timeout: 10800s
