# El almacenamiento de ORE Serverless Postgres (ADR 0058): pageserver, safekeeper, storage_broker,
# storage_controller, proxy… — la imagen `neon` de NUESTRO fork, en un commit fijado.
#
# ⭐ Aquí, y sólo aquí, se dice qué motor corre: `_COMMIT` (+ la etiqueta `ore/…` que lo protege en el
#   fork). Los forks no llevan CI: cada fichero nuestro allí sería un conflicto en el rebase.
# ⭐ Los Postgres son submódulos con URL RELATIVA (`../postgres.git`): desde describeloai/neon resuelven
#   solos a describeloai/postgres. El paso `fuente` lo comprueba.
# Medido en D0c·C1 (sin caché, E2_HIGHCPU_32): 19 min 24 s, ~1,2 USD.
#
#   gcloud builds submit --no-source --async --region=global --config ci/neon/almacen.yaml #     --service-account=projects/<P>/serviceAccounts/ore-ci@<P>.iam.gserviceaccount.com
substitutions:
  _REPO: https://github.com/describeloai/neon.git
  _COMMIT: baad49aa38dbf272c5874aa0d547e2cfb841ec1a   # el de computo.yaml; baad49aa sólo cambia la imagen de VM: lo desplegado (83) sigue en 8269bece
  _CACHE: leer                                         # leer | escribir
  _REGISTRO_HOST: europe-west1-docker.pkg.dev
  _REGISTRO: europe-west1-docker.pkg.dev/project-8853a180-450d-47be-b83/ore
steps:
  - id: fuente
    name: gcr.io/cloud-builders/git
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        git init -q neon && cd neon
        git remote add origin ${_REPO}
        git fetch -q --depth 1 origin ${_COMMIT}
        git checkout -q FETCH_HEAD
        # los cuatro Postgres son submódulos (../postgres.git)
        git submodule update -q --init --depth 1 --recursive
        # que los Postgres vienen de NUESTRO fork, no de neondatabase
        for v in vendor/postgres-v*; do u=$(git -C $v remote get-url origin); echo "$v <- $u"; case $u in *describeloai*) ;; *) echo "✗ $v no viene del fork"; exit 1;; esac; done
        git log -1 --format='%H %ci %s'
        du -sh . vendor/*
  - id: compilar
    # buildx con caché de capas en NUESTRO registro (P1·3): pg-build (sólo depende de vendor/) y
    # `cargo chef cook` (sólo de las dependencias) salen de la caché; un cambio en Neon recompila
    # sólo sus crates. ⚠️ Los cuatro Postgres se quedan: postgres_ffi genera los tipos de v14–v17.
    name: docker:27-cli
    dir: neon
    entrypoint: sh
    args:
      - -c
      - |
        set -e
        # credencial de la cuenta del build (ore-ci) para el registro, sin claves: el token del metadata
        wget -qO- --header 'Metadata-Flavor: Google' \
          http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token \
          | sed 's/.*"access_token":"\([^"]*\)".*/\1/' \
          | docker login -u oauth2accesstoken --password-stdin https://${_REGISTRO_HOST} >/dev/null
        docker buildx create --name ore --driver docker-container --use >/dev/null
        # escribir la caché cuesta 11–15 min (mode=max sube la capa de cargo): sólo cuando se pide
        # (_CACHE=escribir: cambió Cargo.lock, Postgres o build-tools); si no, sólo se lee
        cache_to=""; [ "${_CACHE}" = escribir ] && cache_to="--cache-to type=registry,ref=${_REGISTRO}/cache:neon-almacen,mode=max,image-manifest=true,oci-mediatypes=true"
        docker buildx build --push --progress plain $cache_to \
          --cache-from type=registry,ref=${_REGISTRO}/cache:neon-almacen \
          --build-arg GIT_VERSION=${_COMMIT} --build-arg BUILD_TAG=ore \
          -t ${_REGISTRO}/neon:${_COMMIT} .
  - id: comprobar
    name: '${_REGISTRO}/neon:${_COMMIT}'
    entrypoint: bash
    args: [-c, 'pageserver --version && safekeeper --version && storage_broker --version']
options:
  machineType: E2_HIGHCPU_32
  diskSizeGb: 200
  logging: CLOUD_LOGGING_ONLY
timeout: 7200s
